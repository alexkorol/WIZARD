name: post-deployment smoke

on:
  workflow_run:
    workflows: [pages-build-deployment]
    types: [completed]
    branches: [gh-pages]

permissions:
  contents: read

concurrency:
  group: deploy-smoke-production
  cancel-in-progress: true

jobs:
  smoke:
    name: verify deployed production
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'gh-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify the live deployment
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_BASE_URL: https://alexkorol.github.io/WIZARD/
        run: node scripts/deploy-smoke.mjs

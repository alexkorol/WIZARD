name: deploy-smoke

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify the deployed site matches gh-pages tip
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          git fetch origin gh-pages
          node scripts/deploy-smoke.mjs --ref origin/gh-pages --max-attempts 6 --backoff-ms 10000 --backoff-cap-ms 30000

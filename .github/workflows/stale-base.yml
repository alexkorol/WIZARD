name: stale-base

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  stale-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fail stale candidates touching deployment surfaces
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: node scripts/check-pr-base.mjs

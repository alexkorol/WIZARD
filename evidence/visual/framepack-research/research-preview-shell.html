<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>375px research document verification</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 375px; max-width: 375px; margin: 0; min-height: 100%; overflow-x: hidden; background: #0d1117; color: #e6edf3; }
  body { font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow-wrap: anywhere; word-break: normal; }
  .capture-label {
    position: sticky;
    top: 0;
    z-index: 3;
    padding: 8px 12px;
    border-bottom: 1px solid #30363d;
    background: rgba(13, 17, 23, .96);
    color: #d2a8ff;
    max-width: 100%;
    overflow: hidden;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .markdown-body { width: 100%; max-width: 100%; padding: 18px 16px 48px; }
  h1, h2, h3 { line-height: 1.25; margin: 24px 0 12px; font-weight: 600; }
  h1 { margin-top: 0; padding-bottom: 10px; border-bottom: 1px solid #30363d; font-size: 25px; }
  h2 { padding-bottom: 7px; border-bottom: 1px solid #30363d; font-size: 20px; }
  h3 { font-size: 17px; }
  p, ul, ol, table, blockquote, pre { margin: 0 0 16px; }
  ul, ol { padding-left: 24px; }
  a { color: #58a6ff; }
  code { padding: .15em .35em; border-radius: 4px; background: #161b22; color: #f0f6fc; font: 12px/1.45 ui-monospace, monospace; overflow-wrap: anywhere; word-break: break-word; white-space: normal; }
  pre { max-width: 100%; overflow-x: auto; padding: 12px; border: 1px solid #30363d; background: #161b22; }
  pre code { padding: 0; background: transparent; white-space: pre; word-break: normal; }
  table { display: block; width: 100%; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
  th, td { padding: 6px 9px; border: 1px solid #30363d; text-align: left; vertical-align: top; }
  img { display: block; max-width: 100%; height: auto; }
  hr { height: 1px; border: 0; background: #30363d; }
  blockquote { margin-left: 0; padding: 0 12px; border-left: 4px solid #3b434b; color: #9da7b1; }
</style>
</head>
<body>
<div class="capture-label">375 px viewport · GitHub GFM render · WIZARD-SURGE-001</div>
<article class="markdown-body">__GFM_FRAGMENT__</article>
</body>
</html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIZARD — Verdigris Systems Laboratory</title>
<meta name="description" content="WIZARD is the Verdigris Systems Laboratory: static calibration, authoring, presentation, and integration tools for HUD resources, the passive tree, itemization, zones, and world presentation.">
<link rel="canonical" href="https://alexkorol.github.io/WIZARD/">
<meta property="og:title" content="WIZARD — Verdigris Systems Laboratory">
<meta property="og:description" content="Calibrate Verdigris systems: load a scenario, tune values, compare alternatives, annotate proposals, and export agent-ready feedback.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://alexkorol.github.io/WIZARD/">
<meta property="og:image" content="https://alexkorol.github.io/WIZARD/tools/wizard_orbs/screenshots/shot_hero.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="WIZARD — Verdigris Systems Laboratory">
<meta name="twitter:description" content="Static GitHub Pages laboratory for Verdigris calibration, authoring, presentation, and integration.">
<meta name="twitter:image" content="https://alexkorol.github.io/WIZARD/tools/wizard_orbs/screenshots/shot_hero.png">
<meta name="theme-color" content="#0d0c0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0c0a;
  --bg-card:#100f0c;
  --ink:#e9e4d8;
  --ink-dim:#9c9587;
  --ink-faint:#6e685e;
  --gold:#c9a227;
  --gold-soft:rgba(201,162,39,.55);
  --gold-faint:rgba(201,162,39,.22);
  --hairline:rgba(233,228,216,.12);
  --hairline-soft:rgba(233,228,216,.07);
  --serif:'Cinzel',Georgia,serif;
  --sans:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:1.0625rem;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(201,162,39,.05), transparent 60%),
    radial-gradient(90% 60% at 50% 115%, rgba(20,16,10,.6), transparent 65%);
  z-index:0;
}
::selection{background:rgba(201,162,39,.28);color:#fff}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px}
.skip-link{
  position:absolute;left:50%;top:-3rem;transform:translateX(-50%);
  background:var(--bg);color:var(--gold);padding:.5rem 1rem;
  border:1px solid var(--gold-soft);z-index:10;transition:top .15s ease;
}
.skip-link:focus{top:.75rem}
.wrap{
  position:relative;
  z-index:1;
  max-width:1180px;
  margin:0 auto;
  padding:0 clamp(1.25rem,4vw,2.5rem);
}
.masthead{
  text-align:center;
  padding:clamp(3.5rem,8vh,6rem) 0 clamp(1.75rem,4vh,2.5rem);
}
.masthead h1{
  font-family:var(--serif);
  font-weight:500;
  font-size:clamp(2.4rem,8vw,4.2rem);
  letter-spacing:.32em;
  text-indent:.32em;
  margin:0;
  line-height:1.1;
}
.lab-name{
  display:block;
  margin:1.1rem 0 0;
  font-size:.78rem;
  font-weight:600;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--gold);
}
.backronym{
  max-width:38em;
  margin:.9rem auto 0;
  font-size:.92rem;
  font-style:italic;
  color:var(--ink-dim);
}
.ornament{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:1.1rem;
  margin:clamp(1.6rem,3vh,2.4rem) auto 0;
  max-width:420px;
  color:var(--gold);
  font-size:.8rem;
}
.ornament::before,.ornament::after{
  content:"";
  flex:1;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-faint));
}
.ornament::after{background:linear-gradient(90deg,var(--gold-faint),transparent)}
.section-label{
  display:flex;
  align-items:center;
  gap:1.25rem;
  margin:0 0 0.85rem;
  font-size:.74rem;
  font-weight:600;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--gold);
}
.section-label::before,.section-label::after{
  content:"";
  flex:1;
  height:1px;
  background:var(--hairline);
}
.group-blurb{
  margin:0 0 1.5rem;
  color:var(--ink-dim);
  text-align:center;
  max-width:42em;
  margin-left:auto;
  margin-right:auto;
}
.featured{padding:clamp(1.5rem,4vh,2.5rem) 0 clamp(1.5rem,4vh,2.75rem)}
.plate-wrap{position:relative;max-width:880px;margin:0 auto}
.plate-wrap::before,.plate-wrap::after{
  content:"";
  position:absolute;
  top:8%;
  width:46%;
  height:84%;
  pointer-events:none;
  z-index:-1;
}
.plate-wrap::before{
  left:-6%;
  background:radial-gradient(closest-side,rgba(214,38,38,.13),transparent 70%);
}
.plate-wrap::after{
  right:-6%;
  background:radial-gradient(closest-side,rgba(42,98,214,.13),transparent 70%);
}
.plate{
  display:block;
  padding:clamp(8px,1.4vw,12px);
  background:#0a0908;
  border:1px solid var(--gold-soft);
  outline:1px solid var(--gold-faint);
  outline-offset:6px;
  margin:8px;
}
.plate img{display:block;width:100%;height:auto}
.plate-caption{
  margin:1.4rem auto 0;
  text-align:center;
  font-size:.85rem;
  font-style:italic;
  color:var(--ink-dim);
}
.featured-body{
  max-width:640px;
  margin:clamp(1.8rem,4vh,2.6rem) auto 0;
  text-align:center;
}
.featured-body h2{
  font-family:var(--serif);
  font-weight:500;
  font-size:clamp(1.5rem,3.6vw,2.1rem);
  letter-spacing:.06em;
  margin:0 0 1rem;
}
.featured-body p{margin:0;color:var(--ink-dim)}
.statline{
  margin-top:1.25rem;
  font-size:.78rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--gold);
}
.collection{padding:clamp(1.25rem,3vh,2rem) 0}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));
  gap:1.1rem;
}
.card{
  display:flex;
  flex-direction:column;
  background:var(--bg-card);
  border:1px solid var(--hairline-soft);
  min-width:0;
  transition:border-color .22s ease,transform .22s ease,background-color .22s ease;
}
.card:hover,.card:focus-within{
  border-color:var(--gold-soft);
  background:#12100c;
  transform:translateY(-3px);
}
.card-preview{
  width:100%;
  height:140px;
  object-fit:cover;
  border-bottom:1px solid var(--hairline-soft);
  background:#0a0908;
}
.card-body{
  display:flex;
  flex-direction:column;
  gap:.7rem;
  padding:1.35rem 1.4rem 1.45rem;
  flex:1;
}
.card-kicker{display:flex;flex-wrap:wrap;gap:.45rem}
.card h3{
  font-family:var(--serif);
  font-weight:500;
  font-size:1.12rem;
  letter-spacing:.04em;
  line-height:1.35;
  margin:0;
  overflow-wrap:anywhere;
}
.purpose{
  margin:0;
  color:var(--ink-dim);
  font-size:.95rem;
  overflow-wrap:anywhere;
  flex:1;
}
.target{
  margin:0;
  font-size:.78rem;
  letter-spacing:.04em;
  color:var(--ink-faint);
}
.target span{
  display:block;
  font-size:.66rem;
  font-weight:600;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:.2rem;
}
.badge{
  font-size:.66rem;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--gold);
  border:1px solid var(--gold-faint);
  padding:.22em .7em;
}
.badge-status{color:var(--ink-dim);border-color:var(--hairline)}
.cta-row{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:.2rem}
.btn{
  display:inline-block;
  padding:.72em 1.15em;
  font-size:.72rem;
  font-weight:600;
  letter-spacing:.18em;
  text-transform:uppercase;
  text-decoration:none;
  border:1px solid var(--hairline);
  color:var(--ink);
  transition:border-color .2s ease,background-color .2s ease,color .2s ease;
}
.btn-primary{border-color:var(--gold-soft);color:var(--gold)}
.btn-primary:hover,.btn-primary:focus-visible{border-color:var(--gold);background:rgba(201,162,39,.08)}
.btn-ghost:hover,.btn-ghost:focus-visible{border-color:var(--ink-dim);color:#fff}
footer{
  border-top:1px solid var(--hairline-soft);
  padding:2.25rem 0 3rem;
  margin-top:2rem;
}
.foot-row{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:1rem;
  font-size:.9rem;
  color:var(--ink-dim);
}
.gh-link{
  display:inline-flex;
  align-items:center;
  gap:.55rem;
  text-decoration:none;
  color:var(--ink-dim);
}
.gh-link:hover,.gh-link:focus-visible{color:var(--gold)}
.gh-link svg{fill:currentColor}
.js .reveal{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.js .reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important;animation:none!important}
  .js .reveal{opacity:1;transform:none}
  .card:hover,.card:focus-within{transform:none}
}
@media (max-width:1366px){
  .masthead h1{letter-spacing:.26em;text-indent:.26em}
}
@media (max-width:480px){
  .masthead h1{letter-spacing:.18em;text-indent:.18em}
  .card-preview{height:110px}
}
</style>
</head>
<body>

<header class="masthead wrap">
  <h1>WIZARD</h1>
  <p class="lab-name">Verdigris Systems Laboratory</p>

<main class="wrap">

    <div class="plate-wrap reveal">

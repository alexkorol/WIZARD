<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower of Life Skill Tree</title>
    <style>
        :root {
            --bg-color: #0b0d12;
            
            /* Nodes */
            --node-center: #ffffff;
            --node-inactive: #1f242e;
            --node-available: #3b4c66;
            --node-active: #d4b483;
            --node-pending: #ffd700; /* Selection Mode */
            
            /* Straight Paths */
            --path-inactive: #1a1f29;
            --path-active: #d4b483;
            --path-ghost: rgba(255, 255, 255, 0.4); /* Potential Choice */
            
            /* Arcs */
            --arc-inactive: rgba(255, 255, 255, 0.05);
            --arc-available: rgba(100, 200, 255, 0.3); 
            --arc-active: #ffd700;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #e0e0e0;
            user-select: none;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .hud-panel {
            position: absolute;
            background: rgba(11, 13, 18, 0.95);
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        #stats-panel { top: 20px; left: 20px; min-width: 220px; }
        #controls-panel { bottom: 20px; right: 20px; }

        h1 {
            margin: 0 0 15px 0;
            font-size: 16px;
            color: var(--node-active);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
            color: #888;
        }

        .stat-value { font-weight: bold; color: #fff; }
        .axis-legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; font-size: 11px; color: #9ca3af; }
        .axis-pill { display: flex; align-items: center; gap: 6px; background: #0f1219; border: 1px solid #1f2937; padding: 6px 8px; border-radius: 4px; }
        .axis-dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
        .axis-dot.might { color: #ff5252; }
        .axis-dot.dex { color: #34d399; }
        .axis-dot.int { color: #60a5fa; }

        .btn {
            background: #1a1f29;
            border: 1px solid #444;
            color: #ccc;
            padding: 8px 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover { background: var(--node-active); color: #000; }

        /* --- SVG ELEMENTS --- */

        /* Straight Links */
        .straight-path {
            fill: none;
            stroke: var(--path-inactive);
            stroke-width: 4;
            stroke-linecap: round;
            transition: all 0.3s;
        }
        .straight-path.active {
            stroke: var(--path-color, var(--path-active));
            filter: drop-shadow(0 0 3px var(--path-color, var(--path-active)));
        }
        .straight-path.ghost {
            stroke: var(--path-ghost);
            stroke-dasharray: 10, 5;
            animation: dash 1s linear infinite;
            cursor: pointer;
        }
        .straight-path.ghost:hover {
            stroke: #fff;
            stroke-width: 6;
        }

        @keyframes dash {
            to { stroke-dashoffset: -15; }
        }

        /* Curved Arcs */
        .curve-path {
            fill: none;
            stroke: var(--arc-inactive);
            stroke-width: 2;
            transition: all 0.3s;
            pointer-events: stroke;
            cursor: pointer;
        }
        .curve-path.available {
            stroke: var(--arc-color, var(--arc-available));
            stroke-width: 3;
        }
        .curve-path.available:hover {
            stroke: #fff;
            stroke-width: 4;
        }
        .curve-path.active {
            stroke: var(--arc-color, var(--arc-active));
            stroke-width: 3;
            filter: drop-shadow(0 0 4px var(--arc-color, var(--arc-active)));
        }

        /* Hit Areas */
        .hit-area { stroke: transparent; stroke-width: 20; fill: none; cursor: pointer; }

        /* Nodes */
        .node-group { cursor: pointer; }
        .node-group circle {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: center;
            transform-box: fill-box;
        }
        .node-group:hover circle.node-fill { transform: scale(1.4); }

        .node-bg { fill: var(--bg-color); stroke: var(--axis-base, var(--node-inactive)); stroke-width: 2; }
        .node-fill { fill: var(--axis-base, var(--node-inactive)); }

        /* Node States */
        .node-group.active .node-fill { fill: var(--axis-strong, var(--node-active)); filter: drop-shadow(0 0 5px var(--axis-glow, var(--axis-strong, var(--node-active)))); }
        .node-group.active .node-bg { stroke: var(--axis-strong, var(--node-active)); }
        
        .node-group.available .node-bg { stroke: var(--axis-base, var(--node-available)); }
        .node-group.available .node-fill { fill: var(--axis-base, var(--node-available)); }
        
        /* Center Node Unique Style */
        .node-group.type-center .node-fill { fill: var(--node-center); filter: drop-shadow(0 0 10px var(--node-center)); }
        
        /* Pending Choice State */
        .node-group.pending .node-bg { stroke: var(--node-pending); stroke-dasharray: 4 2; }
        .node-group.pending .node-fill { fill: var(--node-pending); animation: pulse 1s infinite; }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        #tooltip {
            position: absolute;
            display: none;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #444;
            padding: 12px;
            border-radius: 2px;
            pointer-events: none;
            z-index: 100;
            min-width: 200px;
        }
        .tt-header { color: var(--node-active); font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .tt-body { color: #aaa; font-size: 12px; line-height: 1.4; }
        .choice-hint {
            position: absolute;
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 10px;
            border-radius: 4px;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            display: none;
            font-weight: bold;
            z-index: 20;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #canvas-container:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="hud-panel" id="stats-panel">
            <h1>Flower of Life</h1>
            <div class="stat-row">
                <span>Harmony (Nodes)</span>
                <span class="stat-value" id="node-points-display">20</span>
            </div>
            <div class="stat-row">
                <span>Flow (Arcs)</span>
                <span class="stat-value" id="arc-points-display">15</span>
            </div>
            <div class="axis-legend">
                <div class="axis-pill"><span class="axis-dot might"></span> Might</div>
                <div class="axis-pill"><span class="axis-dot dex"></span> Dex</div>
                <div class="axis-pill"><span class="axis-dot int"></span> Int</div>
            </div>
            <div style="margin-top:15px; font-size: 11px; color:#666; border-top: 1px solid #333; padding-top:10px; line-height: 1.6;">
                <strong style="color:#ccc">Left Click Node:</strong> Toggle (Awaken/Refund)<br>
                <strong style="color:#ccc">Click Ghost Path:</strong> Confirm Choice<br>
                <strong style="color:#ccc">Click Arcs:</strong> Channel Flow
            </div>
        </div>
        <div class="hud-panel" id="controls-panel">
            <button class="btn" onclick="skillTree.reset()">Rebirth</button>
            <button class="btn" onclick="viewController.center()">Center</button>
        </div>
        <div id="choice-hint" class="choice-hint">Choose a path to connect</div>
    </div>

    <div id="tooltip">
        <div class="tt-header"></div>
        <div class="tt-body"></div>
    </div>

    <div id="canvas-container">
        <svg id="main-svg" width="100%" height="100%">
            <g id="viewport-group">
                <g id="arcs-layer"></g>
                <g id="straight-layer"></g>
                <g id="nodes-layer"></g>
            </g>
        </svg>
    </div>

<script>
const RADIUS = 80;
const AXIS_COLORS = {
    might: { r: 255, g: 82, b: 82 },   // Red axis
    dex:   { r: 52,  g: 211, b: 153 }, // Green axis
    int:   { r: 96,  g: 165, b: 250 }  // Blue axis
};
const AXIS_FALLBACK = { r: 110, g: 130, b: 150 };

function clamp01(v) { return Math.max(0, Math.min(1, v)); }
function colorToCss(c) { return `rgb(${Math.round(c.r)},${Math.round(c.g)},${Math.round(c.b)})`; }
function mixAxis(weights) {
    const r = AXIS_COLORS.might.r * weights.might + AXIS_COLORS.dex.r * weights.dex + AXIS_COLORS.int.r * weights.int;
    const g = AXIS_COLORS.might.g * weights.might + AXIS_COLORS.dex.g * weights.dex + AXIS_COLORS.int.g * weights.int;
    const b = AXIS_COLORS.might.b * weights.might + AXIS_COLORS.dex.b * weights.dex + AXIS_COLORS.int.b * weights.int;
    return { r, g, b };
}
function lighten(color, amt = 0.2) {
    return {
        r: color.r + (255 - color.r) * amt,
        g: color.g + (255 - color.g) * amt,
        b: color.b + (255 - color.b) * amt
    };
}
function axisWeightsFromHex(hex) {
    const q = hex.q;          // Might axis (red)
    const r = hex.r;          // Dex axis (green)
    const s = -q - r;         // Int axis (blue) derived from cube coords

    // Use only the forward direction of each axis so colors radiate correctly
    const m = Math.max(0, q);
    const d = Math.max(0, r);
    const i = Math.max(0, s);
    const sum = m + d + i;

    if (sum === 0) {
        // Center point or perfectly opposite direction: keep neutral mix
        return { might: 1/3, dex: 1/3, int: 1/3 };
    }
    return {
        might: m / sum,
        dex: d / sum,
        int: i / sum,
    };
}
function makeAxisColors(hex) {
    const weights = axisWeightsFromHex(hex);
    const base = (weights.might + weights.dex + weights.int) === 0 ? AXIS_FALLBACK : mixAxis(weights);
    return {
        weights,
        base,
        strong: lighten(base, 0.25),
        glow: lighten(base, 0.45),
    };
}
function averageColor(c1, c2) {
    return { r: (c1.r + c2.r) / 2, g: (c1.g + c2.g) / 2, b: (c1.b + c2.b) / 2 };
}

class Hex {
    constructor(q, r) { this.q = q; this.r = r; }
    getKey() { return `${this.q},${this.r}`; }
    toPixel() {
        const x = RADIUS * (this.q + this.r/2);
        const y = RADIUS * (this.r * Math.sqrt(3)/2);
        return { x, y };
    }
    static neighbor(hex, i) {
        const dirs = [{q:1,r:0}, {q:0,r:1}, {q:-1,r:1}, {q:-1,r:0}, {q:0,r:-1}, {q:1,r:-1}];
        const d = dirs[i % 6];
        return new Hex(hex.q + d.q, hex.r + d.r);
    }
}

class Node {
    constructor(hex, type='small') {
        this.hex = hex;
        this.id = hex.getKey();
        this.type = type;
        this.active = false;
        this.connections = []; 
        this.data = { name: "Cosmic Point", desc: "A point of power." };
        this.axis = makeAxisColors(hex);
    }
}

class Connection {
    constructor(nodeA, nodeB) {
        const sorted = [nodeA.id, nodeB.id].sort();
        this.id = `${sorted[0]}:${sorted[1]}`;
        this.fromId = sorted[0];
        this.toId = sorted[1];
        this.straight = false; 
        this.curve1 = false;   
        this.curve2 = false;   
    }
}

class SkillTree {
    constructor() {
        this.nodes = new Map();
        this.connections = new Map();
        this.points = { nodes: 20, arcs: 15 };
        this.startId = '0,0';
        this.pendingNodeId = null; 

        this.generateTree(3);
        
        this.renderer = new SVGRenderer(this);
        this.renderer.draw();
        this.updateUI();
    }

    generateTree(layers) {
        const center = new Hex(0,0);
        this.addNode(center, 'center');
        this.nodes.get(center.getKey()).active = true;

        for (let l = 1; l <= layers; l++) {
            let cursor = new Hex(0,0);
            // Move to start of ring (Direction 4 scaled by layer)
            for(let k=0; k<l; k++) cursor = Hex.neighbor(cursor, 4);

            for (let i = 0; i < 6; i++) {
                for (let j = 0; j < l; j++) {
                    let type = 'small';
                    if (l === layers) type = 'keystone';
                    this.addNode(cursor, type);
                    this.connectNeighbors(cursor);
                    cursor = Hex.neighbor(cursor, i);
                }
            }
        }
    }

    addNode(hex, type) {
        const key = hex.getKey();
        if (!this.nodes.has(key)) this.nodes.set(key, new Node(hex, type));
    }

    connectNeighbors(hex) {
        for (let i = 0; i < 6; i++) {
            const nHex = Hex.neighbor(hex, i);
            if (this.nodes.has(nHex.getKey())) {
                const nodeA = this.nodes.get(hex.getKey());
                const nodeB = this.nodes.get(nHex.getKey());
                this.createConnection(nodeA, nodeB);
            }
        }
    }

    createConnection(n1, n2) {
        const conn = new Connection(n1, n2);
        if (!this.connections.has(conn.id)) {
            this.connections.set(conn.id, conn);
            if(!n1.connections.includes(n2.id)) n1.connections.push(n2.id);
            if(!n2.connections.includes(n1.id)) n2.connections.push(n1.id);
        }
    }

    // --- GAMEPLAY LOGIC ---

    isConnectedToStart(targetId, simulate = {}) {
        if (targetId === this.startId) return true;
        if (simulate.disableNode === targetId) return false;

        const queue = [this.startId];
        const visited = new Set([this.startId]);

        while (queue.length > 0) {
            const currId = queue.shift();
            if (currId === targetId) return true;
            const currNode = this.nodes.get(currId);
            
            for (const neighborId of currNode.connections) {
                if (visited.has(neighborId)) continue;
                if (neighborId === simulate.disableNode) continue;

                const neighbor = this.nodes.get(neighborId);
                const connId = [currId, neighborId].sort().join(':');
                const conn = this.connections.get(connId);

                const isNodeActive = neighbor.active;
                const isConnActive = conn.straight && (simulate.disableStraight !== connId);

                if (isNodeActive && isConnActive) {
                    visited.add(neighborId);
                    queue.push(neighborId);
                }
            }
        }
        return false;
    }

    handleNodeClick(id) {
        const node = this.nodes.get(id);

        // 1. If Pending, Cancel
        if (this.pendingNodeId === id) {
            this.pendingNodeId = null;
            this.refresh();
            return;
        }
        if (this.pendingNodeId) this.pendingNodeId = null;

        // 2. If Active -> Try Refund
        if (node.active) {
            this.deactivateNode(id);
            return;
        }

        // 3. If Inactive -> Try Activate
        this.attemptActivateNode(id);
    }

    attemptActivateNode(id) {
        const node = this.nodes.get(id);
        if (this.points.nodes <= 0) { alert("Not enough Node Points."); return; }

        // Find potential active neighbors
        const potentialSources = [];
        
        for (const nid of node.connections) {
            const n = this.nodes.get(nid);
            if (n.active) {
                const c = this.connections.get([id, nid].sort().join(':'));
                potentialSources.push({ node: n, conn: c });
            }
        }

        if (potentialSources.length === 0) {
            alert("Must be adjacent to an active node.");
            return;
        }

        // LOGIC FOR CHOICE:
        if (potentialSources.length === 1) {
            this.finalizeActivation(node, potentialSources[0].conn);
        } else {
            this.pendingNodeId = id;
            this.refresh();
            const hint = document.getElementById('choice-hint');
            hint.style.display = 'block';
            setTimeout(() => hint.style.display = 'none', 3000);
        }
    }

    confirmPath(connId) {
        const conn = this.connections.get(connId);
        if (!this.pendingNodeId) return;
        
        const targetNode = this.nodes.get(this.pendingNodeId);
        
        // Validate connection
        if (conn.fromId !== this.pendingNodeId && conn.toId !== this.pendingNodeId) return;

        this.finalizeActivation(targetNode, conn);
        this.pendingNodeId = null;
    }

    finalizeActivation(node, conn) {
        let costArc = !conn.straight; 
        
        if (costArc) {
            if (this.points.arcs <= 0) {
                alert("Not enough Flow (Arc Points) to build connection.");
                return;
            }
            conn.straight = true;
            this.points.arcs--;
        }
        
        node.active = true;
        this.points.nodes--;
        this.refresh();
    }

    deactivateNode(id) {
        if (id === this.startId) return;
        const node = this.nodes.get(id);
        
        // Dependency Check
        const otherActive = Array.from(this.nodes.values()).filter(n => n.active && n.id !== id);
        for (const other of otherActive) {
            if (!this.isConnectedToStart(other.id, { disableNode: id })) {
                alert("Cannot refund: This node supports other paths.");
                return;
            }
        }

        // Refund
        node.active = false;
        this.points.nodes++;
        
        // Refund straight links that are now dead ends
        for (const nid of node.connections) {
            const c = this.connections.get([id, nid].sort().join(':'));
            if (c.straight) {
                c.straight = false;
                this.points.arcs++;
                if(c.curve1) { c.curve1 = false; this.points.arcs++; }
                if(c.curve2) { c.curve2 = false; this.points.arcs++; }
            }
        }

        this.refresh();
    }

    toggleArc(connId, curveIndex) {
        const conn = this.connections.get(connId);
        if (!conn.straight) return; 

        const prop = curveIndex === 1 ? 'curve1' : 'curve2';
        
        if (conn[prop]) {
            conn[prop] = false;
            this.points.arcs++;
        } else {
            if (this.points.arcs > 0) {
                conn[prop] = true;
                this.points.arcs--;
            } else {
                alert("Not enough Flow.");
            }
        }
        this.refresh();
    }

    reset() {
        this.pendingNodeId = null;
        this.nodes.forEach(n => { if(n.id !== this.startId) n.active = false; });
        this.connections.forEach(c => { c.straight = false; c.curve1 = false; c.curve2 = false; });
        this.points = { nodes: 20, arcs: 15 };
        this.refresh();
    }

    refresh() {
        this.renderer.update();
        this.updateUI();
    }

    updateUI() {
        document.getElementById('node-points-display').innerText = this.points.nodes;
        document.getElementById('arc-points-display').innerText = this.points.arcs;
    }
}

class SVGRenderer {
    constructor(tree) {
        this.tree = tree;
        this.layers = {
            arcs: document.getElementById('arcs-layer'),
            straight: document.getElementById('straight-layer'),
            nodes: document.getElementById('nodes-layer')
        };
        this.cache = { nodes: new Map(), straight: new Map(), arcs: new Map() };
    }

    draw() {
        this.tree.connections.forEach(conn => {
            const n1 = this.tree.nodes.get(conn.fromId);
            const n2 = this.tree.nodes.get(conn.toId);
            const p1 = n1.hex.toPixel();
            const p2 = n2.hex.toPixel();
            const connColor = averageColor(n1.axis.strong, n2.axis.strong);
            const arcColor = averageColor(n1.axis.base, n2.axis.base);

            // Straight Link
            const gStraight = document.createElementNS("http://www.w3.org/2000/svg", "g");
            const straightLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
            straightLine.setAttribute("x1", p1.x); straightLine.setAttribute("y1", p1.y);
            straightLine.setAttribute("x2", p2.x); straightLine.setAttribute("y2", p2.y);
            straightLine.setAttribute("class", "straight-path");
            straightLine.style.setProperty('--path-color', colorToCss(connColor));

            const straightHit = document.createElementNS("http://www.w3.org/2000/svg", "line");
            straightHit.setAttribute("x1", p1.x); straightHit.setAttribute("y1", p1.y);
            straightHit.setAttribute("x2", p2.x); straightHit.setAttribute("y2", p2.y);
            straightHit.setAttribute("class", "hit-area");
            straightHit.onclick = (e) => {
                e.stopPropagation(); 
                if (this.tree.pendingNodeId) {
                    this.tree.confirmPath(conn.id);
                }
            };

            gStraight.appendChild(straightLine);
            gStraight.appendChild(straightHit);
            this.layers.straight.appendChild(gStraight);
            this.cache.straight.set(conn.id, straightLine);

            // Arcs
            const gArcs = document.createElementNS("http://www.w3.org/2000/svg", "g");
            const createArc = (sweep, index) => {
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                const d = `M ${p1.x} ${p1.y} A ${RADIUS} ${RADIUS} 0 0 ${sweep} ${p2.x} ${p2.y}`;
                path.setAttribute("d", d);
                path.setAttribute("class", "curve-path");
                path.style.setProperty('--arc-color', colorToCss(arcColor));
                const hit = document.createElementNS("http://www.w3.org/2000/svg", "path");
                hit.setAttribute("d", d); hit.setAttribute("class", "hit-area");
                hit.onclick = (e) => { e.stopPropagation(); this.tree.toggleArc(conn.id, index); };
                return { path, hit };
            };
            const c1 = createArc(0, 1);
            const c2 = createArc(1, 2);

            gArcs.appendChild(c1.path); gArcs.appendChild(c1.hit);
            gArcs.appendChild(c2.path); gArcs.appendChild(c2.hit);
            this.layers.arcs.appendChild(gArcs);
            this.cache.arcs.set(conn.id, { c1: c1.path, c2: c2.path });
        });

        this.tree.nodes.forEach(node => {
            const pos = node.hex.toPixel();
            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            g.setAttribute("transform", `translate(${pos.x},${pos.y})`);
            g.setAttribute("class", `node-group type-${node.type}`);
            g.style.setProperty('--axis-base', colorToCss(node.axis.base));
            g.style.setProperty('--axis-strong', colorToCss(node.axis.strong));
            g.style.setProperty('--axis-glow', colorToCss(node.axis.glow));
            
            g.onclick = (e) => { e.stopPropagation(); this.tree.handleNodeClick(node.id); };
            g.oncontextmenu = (e) => { e.preventDefault(); e.stopPropagation(); this.tree.deactivateNode(node.id); };
            g.onmouseenter = (e) => this.showTooltip(e, node);
            g.onmouseleave = () => this.hideTooltip();

            const bg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            bg.setAttribute("r", node.type === 'keystone' ? 12 : 6);
            bg.setAttribute("class", "node-bg");
            const fill = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            fill.setAttribute("r", node.type === 'keystone' ? 8 : 4);
            fill.setAttribute("class", "node-fill");

            g.appendChild(bg);
            g.appendChild(fill);
            this.layers.nodes.appendChild(g);
            this.cache.nodes.set(node.id, g);
        });
        this.update();
    }

    update() {
        const pendingId = this.tree.pendingNodeId;

        this.tree.nodes.forEach(node => {
            const el = this.cache.nodes.get(node.id);
            el.classList.remove('active', 'available', 'pending');
            
            if (node.active) {
                el.classList.add('active');
            } else if (node.id === pendingId) {
                el.classList.add('pending');
            } else {
                const isAvail = this.tree.points.nodes > 0 && node.connections.some(nid => this.tree.nodes.get(nid).active);
                if (isAvail) el.classList.add('available');
            }
        });

        this.tree.connections.forEach(conn => {
            const elStraight = this.cache.straight.get(conn.id);
            const elArcs = this.cache.arcs.get(conn.id);
            
            elStraight.classList.remove('active', 'ghost');
            elArcs.c1.classList.remove('active', 'available');
            elArcs.c2.classList.remove('active', 'available');

            if (conn.straight) {
                elStraight.classList.add('active');
                if (conn.curve1) elArcs.c1.classList.add('active');
                else elArcs.c1.classList.add('available');
                
                if (conn.curve2) elArcs.c2.classList.add('active');
                else elArcs.c2.classList.add('available');
            } else {
                if (pendingId && (conn.fromId === pendingId || conn.toId === pendingId)) {
                    const otherId = conn.fromId === pendingId ? conn.toId : conn.fromId;
                    if (this.tree.nodes.get(otherId).active) {
                        elStraight.classList.add('ghost');
                    }
                }
            }
        });
    }

    showTooltip(e, node) {
        const tt = document.getElementById('tooltip');
        tt.querySelector('.tt-header').innerText = node.data.name;
        const w = node.axis.weights;
        const pct = (v) => Math.round(v * 100);
        tt.querySelector('.tt-body').innerHTML = `
            <div style="margin-bottom:6px;">${node.data.desc}</div>
            <div style="display:flex; gap:8px; font-weight:bold; font-size:11px;">
                <span style="color:#fca5a5;">Might ${pct(w.might)}%</span>
                <span style="color:#86efac;">Dex ${pct(w.dex)}%</span>
                <span style="color:#93c5fd;">Int ${pct(w.int)}%</span>
            </div>`;
        tt.style.display = 'block';
        tt.style.left = (e.clientX + 15) + 'px';
        tt.style.top = (e.clientY + 15) + 'px';
    }
    hideTooltip() { document.getElementById('tooltip').style.display = 'none'; }
}

class ViewController {
    constructor() {
        this.svg = document.getElementById('main-svg');
        this.group = document.getElementById('viewport-group');
        
        // Default to screen center
        this.x = window.innerWidth / 2;
        this.y = window.innerHeight / 2;
        this.scale = 0.9;
        
        this.isDrag = false;
        this.last = {x:0,y:0};
        
        // Initial Center check
        this.center();
        
        // Re-check after delay to ensure layout
        setTimeout(() => this.center(), 100);
        window.addEventListener('resize', () => this.center());
        
        this.events();
    }
    
    center() {
        const rect = this.svg.getBoundingClientRect();
        const w = rect.width || window.innerWidth;
        const h = rect.height || window.innerHeight;
        
        if (w > 0 && h > 0) {
            this.x = w / 2;
            this.y = h / 2;
        }
        this.transform();
    }

    events() {
        const c = document.getElementById('canvas-container');
        c.onmousedown = e => { if(e.target.id==='canvas-container'||e.target.tagName==='svg'){this.isDrag=true;this.last={x:e.clientX,y:e.clientY}}};
        window.onmousemove = e => {
            if(this.isDrag) {
                this.x += e.clientX-this.last.x; this.y += e.clientY-this.last.y;
                this.last={x:e.clientX,y:e.clientY}; this.transform();
            }
            const tt = document.getElementById('tooltip');
            if(tt.style.display==='block'){tt.style.left=(e.clientX+15)+'px';tt.style.top=(e.clientY+15)+'px';}
        };
        window.onmouseup = () => this.isDrag = false;
        c.onwheel = e => { e.preventDefault(); this.scale = Math.min(Math.max(0.2, this.scale + e.deltaY*-0.001), 4); this.transform(); };
    }
    transform() { this.group.setAttribute('transform', `translate(${this.x},${this.y}) scale(${this.scale})`); }
}

const skillTree = new SkillTree();
const viewController = new ViewController();

<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      background: rgb(17, 24, 39);
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden; /* Prevent page scrolling */
    }

    .container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .skill-points {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-weight: bold;
      font-size: 1.125rem;
      z-index: 10;
    }

    .message {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(255, 255, 255, 0.9);
      color: #1A202C;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      z-index: 10;
      max-width: 300px;
      display: none;
    }

    svg {
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    .node {
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .node circle {
      stroke: #1a1a1a;
      stroke-width: 1;
      transition: all 0.3s ease;
    }

    .node text {
      fill: white;
      font-size: 2px;
      font-weight: 300;
      transition: all 0.3s ease;
      text-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
    }

    .node:hover text {
      font-size: 2.25px;
    }

    .arc {
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .inactive-node circle {
      fill: #2D3748;
      stroke: #1A202C;
    }

    .available-node circle {
      fill: #4A5568;
      stroke: #2D3748;
      filter: drop-shadow(0 0 2px #4A5568);
    }

    .active-node circle {
      fill: #6366F1;
      stroke: #4338CA;
      filter: drop-shadow(0 0 3px #6366F1);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { filter: drop-shadow(0 0 2px currentColor); }
      50% { filter: drop-shadow(0 0 4px currentColor); }
      100% { filter: drop-shadow(0 0 2px currentColor); }
    }

    .inactive-arc {
      stroke: #4A5568; /* Adjusted for visibility */
      stroke-width: 1; /* Increased stroke width */
    }

    .available-arc {
      stroke: #A0AEC0;
      stroke-width: 1.5;
      cursor: pointer;
    }

    .active-arc {
      stroke: #FCD34D;
      stroke-width: 2;
      filter: drop-shadow(0 0 1px #FCD34D);
    }

    .highlighted-arc {
      stroke: #818CF8;
      stroke-width: 1.5;
      filter: drop-shadow(0 0 3px #818CF8);
      animation: connectionPulse 1.5s infinite;
    }

    @keyframes connectionPulse {
      0% { stroke-width: 1; }
      50% { stroke-width: 1.5; }
      100% { stroke-width: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="skill-points">
      Node Points: <span id="nodePoints">10</span><br>
      Arc Points: <span id="arcPoints">10</span>
    </div>
    <div class="message" id="message"></div>
    <svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet">
      <!-- Circles, Arcs, and Nodes will be inserted here by JavaScript -->
    </svg>
  </div>

  <script>
    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;
    let isDragging = false;
    let lastX = 0;
    let lastY = 0;

    const svg = document.querySelector('svg');
    const mainGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
    svg.appendChild(mainGroup);

    // Create a background rectangle to capture pan events
    const bgRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    bgRect.setAttribute('width', '100%');
    bgRect.setAttribute('height', '100%');
    bgRect.setAttribute('fill', 'transparent');
    svg.insertBefore(bgRect, svg.firstChild);

    // Add event listeners for panning on background
    bgRect.addEventListener('mousedown', (e) => {
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      svg.style.cursor = 'grabbing';
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        offsetX += dx / scale;
        offsetY += dy / scale;
        lastX = e.clientX;
        lastY = e.clientY;
        updateTransform();
      }
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
      svg.style.cursor = 'grab';
    });

    svg.addEventListener('wheel', (e) => {
      e.preventDefault();

      const rect = svg.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      // Convert mouse coordinates to SVG coordinates
      const pt = svg.createSVGPoint();
      pt.x = mouseX;
      pt.y = mouseY;
      const cursorPt = pt.matrixTransform(mainGroup.getCTM().inverse());

      // Adjust scale
      const delta = e.deltaY > 0 ? 0.9 : 1.1; // Reversed zoom direction
      const oldScale = scale;
      scale *= delta;
      scale = Math.min(Math.max(0.5, scale), 5);

      // Get new cursor point after scaling
      const newCursorPt = pt.matrixTransform(mainGroup.getCTM().inverse());

      // Adjust offset to keep cursor point stationary
      offsetX += (cursorPt.x - newCursorPt.x);
      offsetY += (cursorPt.y - newCursorPt.y);

      updateTransform();
    });

    function updateTransform() {
      mainGroup.setAttribute('transform',
          `translate(${offsetX},${offsetY}) scale(${scale})`);
    }

    // Prevent context menu and page scrolling
    svg.addEventListener('contextmenu', e => e.preventDefault());
    document.body.style.overflow = 'hidden';

    const R = 20; // Radius of circles
    const centerX = 100;
    const centerY = 100;

    let nodeSkillPoints = 10;
    let arcSkillPoints = 10;

    let allocatedNodes = ['n0'];
    let allocatedArcs = [];

    let hoveredNode = null;
    let hoveredArc = null;

    const nodes = [];
    const arcs = [];

    // Positions of circles in the Flower of Life pattern
    const circlePositions = [];

    // Function to add circle positions in a hexagonal grid
    function addCirclePositions() {
      // Clear existing positions
      circlePositions.length = 0;

      // Center circle (first)
      circlePositions.push({ x: centerX, y: centerY });

      // First ring of 6 circles
      for (let i = 0; i < 6; i++) {
        const angle = (i * Math.PI / 3); // Start from right, go counter-clockwise
        const x = centerX + R * Math.cos(angle);
        const y = centerY + R * Math.sin(angle);
        circlePositions.push({ x, y });
      }
    }

    // Build the circle positions for the Flower of Life
    addCirclePositions();

    // Draw circles
    circlePositions.forEach((pos, index) => {
      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute('cx', pos.x);
      circle.setAttribute('cy', pos.y);
      circle.setAttribute('r', R);
      circle.setAttribute('fill', 'none');
      circle.setAttribute('stroke', '#ffffff44'); // Increased opacity
      mainGroup.appendChild(circle);
    });

    // Calculate nodes (intersection points)
    function calculateNodes() {
      nodes.length = 0;
      let nodeId = 0;

      const nodeMap = {};

      // First, add center node (n0)
      nodes.push({
        id: 'n0',
        x: centerX,
        y: centerY,
        connections: []
      });
      nodeMap[`${centerX.toFixed(3)},${centerY.toFixed(3)}`] = 'n0';

      // Then calculate intersections
      for (let i = 0; i < circlePositions.length; i++) {
        for (let j = i + 1; j < circlePositions.length; j++) {
          const intersections = circleCircleIntersection(
            circlePositions[i].x, circlePositions[i].y, R,
            circlePositions[j].x, circlePositions[j].y, R
          );

          intersections.forEach(point => {
            const key = `${point.x.toFixed(3)},${point.y.toFixed(3)}`;
            if (!nodeMap[key]) {
              const newId = `n${++nodeId}`;
              nodes.push({
                id: newId,
                x: point.x,
                y: point.y,
                connections: []
              });
              nodeMap[key] = newId;
            }
          });
        }
      }
    }

    // Function to calculate circle-circle intersection points
    function circleCircleIntersection(x0, y0, r0, x1, y1, r1) {
      const dx = x1 - x0;
      const dy = y1 - y0;
      const d = Math.hypot(dx, dy);

      // Check for no intersection
      if (d > r0 + r1 || d < Math.abs(r0 - r1) || d === 0) {
        return [];
      }

      const a = (r0 * r0 - r1 * r1 + d * d) / (2 * d);
      const h = Math.sqrt(r0 * r0 - a * a);
      const xm = x0 + (a * dx) / d;
      const ym = y0 + (a * dy) / d;
      const xs1 = xm + (h * dy) / d;
      const ys1 = ym - (h * dx) / d;
      const xs2 = xm - (h * dy) / d;
      const ys2 = ym + (h * dx) / d;

      return [{ x: xs1, y: ys1 }, { x: xs2, y: ys2 }];
    }

    // Calculate nodes
    calculateNodes();

    // Build connections between nodes (arcs)
    function calculateArcs() {
      arcs.length = 0;
      let arcId = 0;

      // For each node
      nodes.forEach((nodeA, i) => {
        // Find all nodes at distance R
        nodes.forEach((nodeB, j) => {
          if (i < j) {
            const dist = Math.hypot(nodeA.x - nodeB.x, nodeA.y - nodeB.y);
            if (Math.abs(dist - R) < 0.5) {
              // Create an arc
              arcs.push({
                id: `a${arcId++}`,
                from: nodeA.id,
                to: nodeB.id,
                x1: nodeA.x,
                y1: nodeA.y,
                x2: nodeB.x,
                y2: nodeB.y
              });

              // Add connections to nodes
              if (!nodeA.connections.includes(nodeB.id)) {
                nodeA.connections.push(nodeB.id);
              }
              if (!nodeB.connections.includes(nodeA.id)) {
                nodeB.connections.push(nodeA.id);
              }
            }
          }
        });
      });
    }

    // Calculate arcs
    calculateArcs();

    // Function to describe an arc path between two points
    function describeArc(x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const dr = Math.hypot(dx, dy);
      const largeArcFlag = 0;
      const sweepFlag = 1;
      return `M ${x1} ${y1} A ${dr} ${dr} 0 ${largeArcFlag} ${sweepFlag} ${x2} ${y2}`;
    }

    // Draw arcs
    arcs.forEach(arc => {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const d = describeArc(arc.x1, arc.y1, arc.x2, arc.y2);
      path.setAttribute('d', d);
      path.setAttribute('class', 'arc inactive-arc');
      path.setAttribute('data-id', arc.id);
      path.setAttribute('data-from', arc.from);
      path.setAttribute('data-to', arc.to);
      mainGroup.insertBefore(path, mainGroup.firstChild); // Insert into mainGroup

      // Event listeners
      path.addEventListener('mouseenter', () => handleArcHover(arc.id));
      path.addEventListener('mouseleave', () => handleArcHover(null));
      path.addEventListener('click', () => handleArcClick(arc.id));
    });

    // Draw nodes
    nodes.forEach(node => {
      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
      group.setAttribute('transform', `translate(${node.x},${node.y})`);
      group.setAttribute('class', 'node inactive-node');
      group.setAttribute('data-id', node.id);

      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute('r', '3'); // Increased radius

      group.appendChild(circle);
      mainGroup.appendChild(group);

      // Event listeners
      group.addEventListener('mouseenter', () => handleNodeHover(node.id));
      group.addEventListener('mouseleave', () => handleNodeHover(null));
      group.addEventListener('click', () => handleNodeClick(node.id));
    });

    function handleNodeHover(nodeId) {
      hoveredNode = nodeId;
      updateVisuals();
    }

    function handleArcHover(arcId) {
      hoveredArc = arcId;
      updateVisuals();
    }

    function handleNodeClick(nodeId) {
      if (nodeId === 'n0') return;

      if (allocatedNodes.includes(nodeId)) {
        // Deallocate node if it doesn't disconnect the tree
        // Simulate deallocation
        const tempAllocatedNodes = allocatedNodes.filter(id => id !== nodeId);

        // Check connectivity from 'n0' to all other allocated nodes
        const isConnected = checkConnectivity(tempAllocatedNodes, allocatedArcs);

        if (isConnected) {
          allocatedNodes = tempAllocatedNodes;
          nodeSkillPoints++;
          document.getElementById('nodePoints').textContent = nodeSkillPoints;
        } else {
          showMessage('Cannot deallocate this node as it would disconnect the tree from the origin.');
        }
      } else {
        // Allocate node if possible
        const connectedArcs = arcs.filter(a =>
          (a.from === nodeId || a.to === nodeId) && allocatedArcs.includes(a.id)
        );

        if (nodeSkillPoints > 0 && connectedArcs.length > 0) {
          allocatedNodes.push(nodeId);
          nodeSkillPoints--;
          document.getElementById('nodePoints').textContent = nodeSkillPoints;
        } else {
          showMessage('Cannot allocate this node. It must be connected via an allocated arc.');
        }
      }

      updateVisuals();
    }

    function handleArcClick(arcId) {
      const arc = arcs.find(a => a.id === arcId);

      const fromAllocated = allocatedNodes.includes(arc.from);
      const toAllocated = allocatedNodes.includes(arc.to);

      if (allocatedArcs.includes(arcId)) {
        // Deallocate arc if it doesn't disconnect the tree
        // Simulate deallocation
        const tempAllocatedArcs = allocatedArcs.filter(id => id !== arcId);

        // Check connectivity from 'n0' to all other allocated nodes
        const isConnected = checkConnectivity(allocatedNodes, tempAllocatedArcs);

        if (isConnected) {
          allocatedArcs = tempAllocatedArcs;
          arcSkillPoints++;
          document.getElementById('arcPoints').textContent = arcSkillPoints;
        } else {
          showMessage('Cannot deallocate this arc as it would disconnect the tree from the origin.');
        }
      } else if (arcSkillPoints > 0 && (fromAllocated || toAllocated)) {
        allocatedArcs.push(arcId);
        arcSkillPoints--;
        document.getElementById('arcPoints').textContent = arcSkillPoints;
      } else {
        showMessage('Cannot allocate this arc. At least one connected node must be allocated.');
      }

      updateVisuals();
    }

    // Function to check connectivity from 'n0' to all allocated nodes
    function checkConnectivity(nodesSet, arcsSet) {
      const visited = new Set();
      const stack = ['n0'];

      const allocatedArcsSet = new Set(arcsSet);

      while (stack.length > 0) {
        const currentNode = stack.pop();
        visited.add(currentNode);

        // Get all adjacent nodes via allocated arcs
        const adjacentNodes = arcs.filter(a =>
          allocatedArcsSet.has(a.id) &&
          (a.from === currentNode || a.to === currentNode)
        ).map(a => (a.from === currentNode ? a.to : a.from));

        adjacentNodes.forEach(nodeId => {
          if (!visited.has(nodeId) && nodesSet.includes(nodeId)) {
            stack.push(nodeId);
          }
        });
      }

      // Check if all allocated nodes are visited
      return nodesSet.every(nodeId => visited.has(nodeId));
    }

    function updateVisuals() {
      // Update nodes
      document.querySelectorAll('.node').forEach(nodeGroup => {
        const nodeId = nodeGroup.getAttribute('data-id');
        const circle = nodeGroup.querySelector('circle');
        const isActive = allocatedNodes.includes(nodeId);

        const connectedAllocatedArcs = arcs.filter(a =>
          (a.from === nodeId || a.to === nodeId) && allocatedArcs.includes(a.id)
        );

        const canActivate = !isActive && nodeSkillPoints > 0 && connectedAllocatedArcs.length > 0;

        circle.setAttribute('r', nodeId === hoveredNode ? '4' : '3'); // Adjust radius on hover
        nodeGroup.setAttribute('class', `node ${
          isActive ? 'active-node' : canActivate ? 'available-node' : 'inactive-node'
        }`);
      });

      // Update arcs
      document.querySelectorAll('.arc').forEach(path => {
        const arcId = path.getAttribute('data-id');
        const fromId = path.getAttribute('data-from');
        const toId = path.getAttribute('data-to');
        const isActive = allocatedArcs.includes(arcId);

        const fromAllocated = allocatedNodes.includes(fromId);
        const toAllocated = allocatedNodes.includes(toId);

        const canActivate = !isActive && arcSkillPoints > 0 && (fromAllocated || toAllocated);

        path.setAttribute('class', `arc ${
          arcId === hoveredArc ? 'highlighted-arc' :
          isActive ? 'active-arc' :
          canActivate ? 'available-arc' :
          'inactive-arc'
        }`);
      });
    }

    // Message display function
    function showMessage(text) {
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = text;
      messageDiv.style.display = 'block';
      clearTimeout(messageDiv.timeout);
      messageDiv.timeout = setTimeout(() => {
        messageDiv.style.display = 'none';
      }, 3000);
    }

    // Initial visual update
    updateVisuals();
  </script>
</body>
</html>

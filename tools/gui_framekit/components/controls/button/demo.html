<!--
  fk-button demo — standalone page per INTERFACES.md.
  Imports tokens then component CSS; zero build step.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fk-button demo</title>
<link rel="stylesheet" href="../../../tokens/tokens.css" />
<link rel="stylesheet" href="./button.css" />
<style>body { background: var(--fk-bg-0); color: var(--fk-fg-0); font-family: var(--fk-font); padding: var(--fk-space-5); }</style>
</head>
<body>
  <h1>.fk-button</h1>
  <p>
    <button class="fk-button">Default</button>
    <button class="fk-button" data-variant="primary">Primary</button>
    <button class="fk-button" data-variant="danger">Danger</button>
    <button class="fk-button" disabled>Disabled</button>
  </p>
  <p>
    <button class="fk-button" data-size="sm">Small</button>
    <button class="fk-button" data-size="md">Medium</button>
    <button class="fk-button" data-size="lg">Large</button>
  </p>
</body>
</html>

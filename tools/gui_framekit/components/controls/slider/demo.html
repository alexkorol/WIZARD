<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fk-slider demo</title>
<link rel="stylesheet" href="../../../tokens/tokens.css" />
<link rel="stylesheet" href="./slider.css" />
<style>body { background: var(--fk-bg-0); color: var(--fk-fg-0); font-family: var(--fk-font); padding: var(--fk-space-5); max-width: 420px; }</style>
</head>
<body>
  <h1>.fk-slider</h1>
  <label for="s">Attunement</label>
  <input id="s" class="fk-slider" type="range" min="0" max="100" value="42" />
  <p></p>
  <label for="d">Sealed (disabled)</label>
  <input id="d" class="fk-slider" type="range" min="0" max="10" value="3" disabled />
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fk-bar demo</title>
<link rel="stylesheet" href="../../../tokens/tokens.css" />
<link rel="stylesheet" href="./bar.css" />
<style>body { background: var(--fk-bg-0); color: var(--fk-fg-0); font-family: var(--fk-font); padding: var(--fk-space-5); display: grid; gap: var(--fk-space-3); max-width: 420px; }</style>
</head>
<body>
  <h1>.fk-bar</h1>
  <div class="fk-bar" data-tone="ok" role="meter" aria-valuenow="82" aria-valuemin="0" aria-valuemax="100"><div class="fk-bar-fill" style="width: 82%"></div></div>
  <div class="fk-bar" data-tone="warn" role="meter" aria-valuenow="41" aria-valuemin="0" aria-valuemax="100"><div class="fk-bar-fill" style="width: 41%"></div></div>
  <div class="fk-bar" data-tone="danger" role="meter" aria-valuenow="17" aria-valuemin="0" aria-valuemax="100"><div class="fk-bar-fill" style="width: 17%"></div></div>
  <div class="fk-bar" data-segments role="meter" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100"><div class="fk-bar-fill" style="width: 62%"></div></div>
</body>
</html>

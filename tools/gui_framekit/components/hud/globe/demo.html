<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fk-globe demo</title>
<link rel="stylesheet" href="../../../tokens/tokens.css" />
<link rel="stylesheet" href="./globe.css" />
<style>body { background: var(--fk-bg-0); color: var(--fk-fg-0); font-family: var(--fk-font); padding: var(--fk-space-5); display: flex; gap: var(--fk-space-4); }</style>
</head>
<body>
  <h1>.fk-globe</h1>
  <div class="fk-globe" data-tone="ok" role="meter" aria-label="Vitality" aria-valuenow="80"><div class="fk-globe-fill" style="--fk-globe-value: 80%"></div><span class="fk-globe-text">80</span></div>
  <div class="fk-globe" role="meter" aria-label="Mana" aria-valuenow="55"><div class="fk-globe-fill" style="--fk-globe-value: 55%"></div><span class="fk-globe-text">55</span></div>
  <div class="fk-globe" data-tone="danger" role="meter" aria-label="Essence" aria-valuenow="25"><div class="fk-globe-fill" style="--fk-globe-value: 25%"></div><span class="fk-globe-text">25</span></div>
</body>
</html>

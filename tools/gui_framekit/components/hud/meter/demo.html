<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fk-meter demo</title>
<link rel="stylesheet" href="../../../tokens/tokens.css" />
<link rel="stylesheet" href="./meter.css" />
<style>body { background: var(--fk-bg-0); color: var(--fk-fg-0); font-family: var(--fk-font); padding: var(--fk-space-5); display: flex; gap: var(--fk-space-3); flex-wrap: wrap; }</style>
</head>
<body>
  <h1>.fk-meter</h1>
  <div class="fk-meter"><span class="fk-meter-label">DPS</span><span class="fk-meter-value" data-delta="up">142</span></div>
  <div class="fk-meter"><span class="fk-meter-label">Mana/s</span><span class="fk-meter-value" data-delta="down">-3</span></div>
  <div class="fk-meter"><span class="fk-meter-label">Armor</span><span class="fk-meter-value">88</span></div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fk-context-menu demo</title>
<link rel="stylesheet" href="../../../tokens/tokens.css" />
<link rel="stylesheet" href="./context-menu.css" />
<style>body { background: var(--fk-bg-0); color: var(--fk-fg-0); font-family: var(--fk-font); padding: var(--fk-space-5); }</style>
</head>
<body>
  <h1>.fk-context-menu (open at a fixed spot in this demo)</h1>
  <div class="fk-context-menu" open role="menu">
    <button class="fk-menu-item" role="menuitem">Copy glyph</button>
    <button class="fk-menu-item" role="menuitem">Bind to hotbar</button>
    <button class="fk-menu-item" role="menuitem">Banish</button>
  </div>
</body>
</html>

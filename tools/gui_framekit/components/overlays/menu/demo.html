<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fk-menu demo</title>
<link rel="stylesheet" href="../../../tokens/tokens.css" />
<link rel="stylesheet" href="./menu.css" />
<style>body { background: var(--fk-bg-0); color: var(--fk-fg-0); font-family: var(--fk-font); padding: var(--fk-space-5); }</style>
</head>
<body>
  <h1>.fk-menu (open by default in this demo)</h1>
  <div class="fk-menu" open role="menu">
    <button class="fk-menu-item" role="menuitem">Inspect</button>
    <button class="fk-menu-item" role="menuitem">Attune</button>
    <button class="fk-menu-item" role="menuitem" disabled>Transmute</button>
    <button class="fk-menu-item" role="menuitem">Discard</button>
  </div>
</body>
</html>

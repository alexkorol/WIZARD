<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fk-modal demo</title>
<link rel="stylesheet" href="../../../tokens/tokens.css" />
<link rel="stylesheet" href="./modal.css" />
<style>body { background: var(--fk-bg-0); color: var(--fk-fg-0); font-family: var(--fk-font); padding: var(--fk-space-5); }</style>
</head>
<body>
  <h1>.fk-modal (open by default in this demo)</h1>
  <div class="fk-modal" open role="dialog" aria-modal="true" aria-label="Confirm?">
    <div class="fk-modal-box">
      <p>Confirm this action?</p>
      <p><small>This cannot be undone.</small></p>
    </div>
  </div>
</body>
</html>

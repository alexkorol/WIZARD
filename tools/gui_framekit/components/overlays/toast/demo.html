<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fk-toast demo</title>
<link rel="stylesheet" href="../../../tokens/tokens.css" />
<link rel="stylesheet" href="./toast.css" />
<style>body { background: var(--fk-bg-0); color: var(--fk-fg-0); font-family: var(--fk-font); padding: var(--fk-space-5); }</style>
</head>
<body>
  <h1>.fk-toast</h1>
  <div class="fk-toast-stack">
    <div class="fk-toast" open data-tone="ok">Potion brewed.</div>
    <div class="fk-toast" open data-tone="warn">Cauldron running low.</div>
    <div class="fk-toast" open data-tone="danger">Familiar escaped!</div>
  </div>
</body>
</html>

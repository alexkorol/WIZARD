<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Alchemy: Character Centric</title>
  <style>
    body {
      margin: 0;
      background-color: #111;
      color: #eee;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #game-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: #000;
    }

    canvas {
      image-rendering: pixelated;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      cursor: crosshair;
      max-width: 100%;
      max-height: 100%;
    }

    #ui-layer {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 10px 20px;
      border-radius: 12px;
      border: 1px solid #333;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      pointer-events: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      max-width: 95vw;
    }

    .material-btn {
      background: #222;
      border: 2px solid #444;
      color: #aaa;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      border-radius: 6px;
      transition: all 0.1s;
      text-transform: uppercase;
      min-width: 50px;
      text-align: center;
      user-select: none;
    }

    .material-btn:hover {
      background: #333;
      color: #fff;
      transform: translateY(-2px);
    }

    .material-btn.active {
      border-color: #fff;
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 0 8px rgba(255,255,255,0.3);
    }

    .btn-sand.active { background: #e6c229; color: #000; border-color: #e6c229; }
    .btn-water.active { background: #4fa4f2; color: #000; border-color: #4fa4f2; }
    .btn-stone.active { background: #757575; color: #fff; border-color: #757575; }
    .btn-wood.active { background: #8b5a2b; color: #fff; border-color: #8b5a2b; }
    .btn-fire.active { background: #f24f4f; color: #fff; border-color: #f24f4f; }
    .btn-plant.active { background: #5ebd3e; color: #000; border-color: #5ebd3e; }
    .btn-acid.active { background: #bfff00; color: #000; border-color: #bfff00; }
    .btn-tnt.active { background: #ff8c00; color: #000; border-color: #ff8c00; }
    .btn-lava.active { background: #cf1020; color: #fff; border-color: #cf1020; }
    .btn-oil.active { background: #3b3b2e; color: #fff; border-color: #3b3b2e; }
    .btn-ice.active { background: #a5f2f3; color: #000; border-color: #a5f2f3; }
    .btn-slime.active { background: #8A2BE2; color: #fff; border-color: #8A2BE2; }
    .btn-glass.active { background: #e0ffff; color: #000; border-color: #e0ffff; }
    .btn-gunpowder.active { background: #444; color: #fff; border-color: #888; }
    .btn-virus.active { background: #ff00ff; color: #fff; border-color: #ff00ff; }
    .btn-c4.active { background: #ddd; color: #000; border-color: #fff; }

    #info-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      pointer-events: none;
      font-family: monospace;
      font-size: 12px;
      color: #aaa;
      background: rgba(0,0,0,0.7);
      padding: 8px;
      border-radius: 4px;
      backdrop-filter: blur(2px);
    }

    .key-hint {
      color: #fff;
      background: #444;
      padding: 1px 4px;
      border-radius: 3px;
      margin-right: 4px;
      font-weight: bold;
    }

    #health-container {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 200px;
      height: 20px;
      background: #333;
      border: 2px solid #555;
      border-radius: 4px;
      overflow: hidden;
    }

    #health-bar {
      width: 100%;
      height: 100%;
      background: #f00;
      transition: width 0.1s;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="simCanvas"></canvas>
    <div id="info-overlay">
      <div>FPS: <span id="fps-counter">60</span> | Proj: <span id="particle-counter">0</span></div>
      <div style="margin-top:8px;"><span class="key-hint">WASD</span>Move <span class="key-hint">L-Click</span>Shoot <span class="key-hint">R-Click</span>Mine</div>
      <div style="margin-top:4px;"><span class="key-hint">1-9</span>Equip <span class="key-hint">R</span>Reset <span class="key-hint">Wheel</span>Blob Size</div>
    </div>
    <div id="health-container">
      <div id="health-bar"></div>
    </div>
    <div id="ui-layer">
      <!-- Buttons injected by JS -->
    </div>
  </div>

  <script>
    /**
     * PIXEL ALCHEMY V10
     * Feature: Character-Centric Gameplay (Wand Shooting & Mining)
     */

    // Configuration
    const WIDTH = 300;
    const HEIGHT = 200;
    const SCALE = 3;
    const FPS_TARGET = 60;
    const GRAVITY = 0.15;
    const TERMINAL_VELOCITY = 5;

    // Material IDs
    const MAT = {
      AIR: 0,
      SAND: 1,
      WATER: 2,
      STONE: 3,
      WOOD: 4,
      FIRE: 5,
      SMOKE: 6,
      PLANT: 7,
      ACID: 8,
      TNT: 9,
      STEAM: 10,
      LAVA: 11,
      OIL: 12,
      ICE: 13,
      OBSIDIAN: 14,
      SLIME: 15,
      GLASS: 16,
      GUNPOWDER: 17,
      VIRUS: 18,
      C4: 19,
      ACID_GAS: 20
    };

    // Material Properties
    const PROPS = {
      [MAT.AIR]:   { name: 'Air',   color: [0,0,0,0], density: 0, type: 'gas' },
      [MAT.SAND]:  { name: 'Sand',  color: [230, 194, 41, 255], density: 10, type: 'powder', variance: 20, bounce: 0.1 },
      [MAT.WATER]: { name: 'Water', color: [30, 144, 255, 180], density: 5, type: 'liquid', variance: 15, flowRate: 4 },
      [MAT.STONE]: { name: 'Stone', color: [100, 100, 100, 255], density: 100, type: 'solid', variance: 20, bounce: 0.2 },
      [MAT.WOOD]:  { name: 'Wood',  color: [139, 90, 43, 255], density: 50, type: 'solid', variance: 15, flammable: true, burnRate: 0.05, bounce: 0.3 },
      [MAT.FIRE]:  { name: 'Fire',  color: [255, 69, 0, 255], density: -1, type: 'plasma', life: 40, variance: 50, hot: true, damage: 1 },
      [MAT.SMOKE]: { name: 'Smoke', color: [80, 80, 80, 150], density: -5, type: 'gas', life: 80, variance: 20 },
      [MAT.PLANT]: { name: 'Plant', color: [34, 139, 34, 255], density: 20, type: 'solid', variance: 20, flammable: true, burnRate: 0.1 },
      [MAT.ACID]:  { name: 'Acid',  color: [170, 255, 0, 220], density: 4, type: 'liquid', variance: 10, corrosive: true, damage: 2 },
      [MAT.TNT]:   { name: 'TNT',   color: [205, 50, 50, 255], density: 40, type: 'solid', variance: 0, explosive: true, flammable: true, bounce: 0.4 },
      [MAT.STEAM]: { name: 'Steam', color: [220, 220, 230, 100], density: -2, type: 'gas', life: 100, variance: 10 },
      [MAT.LAVA]:  { name: 'Lava',  color: [207, 16, 32, 255], density: 50, type: 'liquid', variance: 30, hot: true, viscosity: 0.1, damage: 5, glow: true },
      [MAT.OIL]:   { name: 'Oil',   color: [50, 50, 20, 220], density: 2, type: 'liquid', variance: 10, flammable: true, burnRate: 0.3 },
      [MAT.ICE]:   { name: 'Ice',  color: [165, 242, 243, 220], density: 100, type: 'solid', variance: 10, meltable: true },
      [MAT.OBSIDIAN]: { name: 'Obsidian', color: [40, 0, 40, 255], density: 100, type: 'solid', variance: 10, bounce: 0.1 },
      [MAT.SLIME]: { name: 'Slime', color: [138, 43, 226, 220], density: 8, type: 'liquid', variance: 15, viscosity: 0.9, damage: 0, bounce: 0.9 },
      [MAT.GLASS]: { name: 'Glass', color: [220, 255, 255, 100], density: 100, type: 'solid', variance: 5, chunkChance: 1.0, brittle: true },
      [MAT.GUNPOWDER]: { name: 'Gunpowder', color: [60, 60, 60, 255], density: 12, type: 'powder', variance: 30, flammable: true, burnRate: 0.8 },
      [MAT.VIRUS]: { name: 'Virus', color: [255, 0, 255, 230], density: 50, type: 'solid', variance: 10, infects: true },
      [MAT.C4]:    { name: 'C4',    color: [220, 220, 200, 255], density: 60, type: 'solid', variance: 5, explosive: true, flammable: false },
      [MAT.ACID_GAS]: { name: 'Acid Gas', color: [100, 255, 0, 150], density: -3, type: 'gas', life: 120, variance: 20, corrosive: true }
    };

    // Simulation State
    let grid = new Int8Array(WIDTH * HEIGHT);
    let lifeGrid = new Uint8Array(WIDTH * HEIGHT);
    let colorOffsetGrid = new Float32Array(WIDTH * HEIGHT);
    let frameCount = 0;
    let explosionQueue = [];

    // Physics Arrays
    let particles = [];
    let projectiles = [];
    const MAX_PARTICLES = 800;

    // Player State
    const player = {
      x: WIDTH / 2,
      y: 20,
      vx: 0,
      vy: 0,
      width: 4,
      height: 7,
      onGround: false,
      facingRight: true,
      hp: 100,
      maxHp: 100,
      iframes: 0
    };

    // Input State
    const input = {
      keys: {},
      mouse: { x: 0, y: 0, left: false, right: false },
      brushSize: 2,
      selectedMat: MAT.SAND
    };

    // Setup Canvas
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    canvas.width = WIDTH;
    canvas.height = HEIGHT;
    canvas.style.width = `${WIDTH * SCALE}px`;
    canvas.style.height = `${HEIGHT * SCALE}px`;

    const imgData = ctx.createImageData(WIDTH, HEIGHT);
    const data = imgData.data;

    // UI Setup
    const uiLayer = document.getElementById('ui-layer');
    const buttons = [
      { mat: MAT.SAND, class: 'btn-sand' },
      { mat: MAT.WATER, class: 'btn-water' },
      { mat: MAT.STONE, class: 'btn-stone' },
      { mat: MAT.WOOD, class: 'btn-wood' },
      { mat: MAT.PLANT, class: 'btn-plant' },
      { mat: MAT.FIRE, class: 'btn-fire' },
      { mat: MAT.LAVA, class: 'btn-lava' },
      { mat: MAT.OIL, class: 'btn-oil' },
      { mat: MAT.ICE, class: 'btn-ice' },
      { mat: MAT.SLIME, class: 'btn-slime' },
      { mat: MAT.ACID, class: 'btn-acid' },
      { mat: MAT.TNT, class: 'btn-tnt' },
      { mat: MAT.GLASS, class: 'btn-glass' },
      { mat: MAT.GUNPOWDER, class: 'btn-gunpowder' },
      { mat: MAT.VIRUS, class: 'btn-virus' },
      { mat: MAT.C4, class: 'btn-c4' }
    ];

    buttons.forEach((btn, idx) => {
      const el = document.createElement('div');
      el.className = `material-btn ${btn.class} ${idx === 0 ? 'active' : ''}`;
      el.textContent = PROPS[btn.mat].name;
      el.onclick = () => setMaterial(btn.mat, el);
      uiLayer.appendChild(el);
    });

    function setMaterial(mat, btnEl) {
      input.selectedMat = mat;
      document.querySelectorAll('.material-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) {
        btnEl.classList.add('active');
      } else {
        const targetName = PROPS[mat].name;
        const domBtn = Array.from(document.querySelectorAll('.material-btn')).find(b => b.textContent === targetName);
        if (domBtn) domBtn.classList.add('active');
      }
    }

    // --- WORLD GENERATION ---

    function initWorld() {
      grid.fill(MAT.AIR);
      lifeGrid.fill(0);
      particles = [];
      projectiles = [];
      explosionQueue = [];
      player.x = WIDTH / 2;
      player.y = 10;
      player.vx = 0;
      player.vy = 0;
      player.hp = 100;
      updateHealthUI();

      const surface = new Int16Array(WIDTH);
      const noiseOffset = Math.random() * 1000;

      for (let x = 0; x < WIDTH; x++) {
        let n1 = Math.sin((x + noiseOffset) * 0.03) * 15;
        let n2 = Math.sin((x + noiseOffset) * 0.1) * 5;
        surface[x] = Math.floor(HEIGHT * 0.6 + n1 + n2);
      }

      for (let x = 0; x < WIDTH; x++) {
        for (let y = 0; y < HEIGHT; y++) {
          const idx = y * WIDTH + x;
          colorOffsetGrid[idx] = Math.random();
          if (y >= surface[x]) {
            grid[idx] = MAT.STONE;
          }
        }
      }

      const numWorms = 8;
      for (let i = 0; i < numWorms; i++) {
        let wx = Math.random() * WIDTH;
        let wy = Math.random() * (HEIGHT - 50) + 50;
        let wSize = 2 + Math.random() * 3;
        let wAngle = Math.random() * Math.PI * 2;
        const wLen = 50 + Math.random() * 100;

        for (let step = 0; step < wLen; step++) {
          for (let cy = -wSize; cy <= wSize; cy++) {
            for (let cx = -wSize; cx <= wSize; cx++) {
              if (cx * cx + cy * cy <= wSize * wSize) {
                setPixel(Math.floor(wx + cx), Math.floor(wy + cy), MAT.AIR);
              }
            }
          }
          wx += Math.cos(wAngle);
          wy += Math.sin(wAngle);
          wAngle += (Math.random() - 0.5) * 0.5;
          if (wx < 0 || wx >= WIDTH) wAngle = Math.PI - wAngle;
          if (wy < 20 || wy >= HEIGHT) wAngle = -wAngle;
        }
      }
    }

    function setPixel(x, y, type) {
      if (x < 0 || x >= WIDTH || y < 0 || y >= HEIGHT) return;
      const idx = y * WIDTH + x;
      grid[idx] = type;
      colorOffsetGrid[idx] = Math.random();
      if (PROPS[type].life) lifeGrid[idx] = PROPS[type].life + Math.random() * 10;
    }

    function getPixel(x, y) {
      if (x < 0 || x >= WIDTH || y < 0 || y >= HEIGHT) return MAT.STONE;
      return grid[y * WIDTH + x];
    }

    // Game Loop
    let lastTime = 0;
    let lastFpsTime = 0;

    function loop(time) {
      const dt = Math.min((time - lastTime) / 1000, 0.05);
      lastTime = time;

      updateInput();
      updateProjectiles();
      processExplosions();
      updateParticles();
      updatePhysics();
      updatePlayer();
      draw();

      frameCount++;
      if (time - lastFpsTime >= 1000) {
        document.getElementById('fps-counter').textContent = frameCount;
        document.getElementById('particle-counter').textContent = projectiles.length;
        frameCount = 0;
        lastFpsTime = time;
      }

      requestAnimationFrame(loop);
    }

    // --- INPUT & PROJECTILES ---

    function updateInput() {
      const aimDx = (input.mouse.x / SCALE) - player.x;
      const aimDy = (input.mouse.y / SCALE) - (player.y - 4);
      const aimAngle = Math.atan2(aimDy, aimDx);

      if (input.mouse.left && frameCount % 8 === 0) {
        const speed = 6;
        const mat = input.selectedMat;

        if (player.onGround) player.vx -= Math.cos(aimAngle) * 0.2;
        else {
          player.vx -= Math.cos(aimAngle) * 0.5;
          player.vy -= Math.sin(aimAngle) * 0.5;
        }

        projectiles.push({
          x: player.x,
          y: player.y - 4,
          vx: Math.cos(aimAngle) * speed,
          vy: Math.sin(aimAngle) * speed,
          mat: mat,
          life: 180,
          size: input.brushSize
        });
      }

      if (input.mouse.right && frameCount % 4 === 0) {
        const speed = 14;
        projectiles.push({
          x: player.x,
          y: player.y - 4,
          vx: Math.cos(aimAngle) * speed,
          vy: Math.sin(aimAngle) * speed,
          mat: MAT.AIR,
          life: 30,
          size: 3
        });
      }

      for (let i = 1; i <= 9; i++) {
        if (input.keys[i.toString()] && buttons[i - 1]) setMaterial(buttons[i - 1].mat);
      }
      if (input.keys['r']) initWorld();
    }

    function updateProjectiles() {
      for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.mat !== MAT.AIR && p.mat !== MAT.FIRE && p.mat !== MAT.ACID_GAS) {
          p.vy += 0.15;
        }

        if (p.x < 0 || p.x >= WIDTH || p.y < 0 || p.y >= HEIGHT) {
          projectiles.splice(i, 1);
          continue;
        }

        const ix = Math.round(p.x);
        const iy = Math.round(p.y);
        const hit = !isEmpty(ix, iy);

        if (hit || p.mat === MAT.AIR) {
          if (p.mat === MAT.AIR) {
            if (hit) {
              const t = getPixel(ix, iy);
              if (t !== MAT.AIR && t !== MAT.OBSIDIAN) {
                if (Math.random() < 0.2) {
                  spawnDebris(ix, iy, t, -p.vx * 0.3, -p.vy * 0.3 + -1, 1, 1);
                }
                const r = Math.ceil(p.size);
                for (let dy = -r; dy <= r; dy++) {
                  for (let dx = -r; dx <= r; dx++) {
                    if (dx * dx + dy * dy <= r * r) {
                      setPixel(ix + dx, iy + dy, MAT.AIR);
                    }
                  }
                }
                projectiles.splice(i, 1);
              }
            }
          } else {
            if (hit) {
              const surfaceX = Math.round(p.x - p.vx);
              const surfaceY = Math.round(p.y - p.vy);
              const r = Math.ceil(p.size / 2);

              for (let dy = -r; dy <= r; dy++) {
                for (let dx = -r; dx <= r; dx++) {
                  if (dx * dx + dy * dy <= r * r) {
                    const targetX = surfaceX + dx;
                    const targetY = surfaceY + dy;

                    if (isEmpty(targetX, targetY)) {
                      setPixel(targetX, targetY, p.mat);
                    }
                  }
                }
              }
              projectiles.splice(i, 1);
            }
          }
        }

        p.life--;
        if (p.life <= 0) projectiles.splice(i, 1);
      }
    }

    // --- PHYSICS ENGINE (GRID) ---

    function updatePhysics() {
      const scanLeftToRight = Math.random() > 0.5;

      for (let y = HEIGHT - 1; y >= 0; y--) {
        const startX = scanLeftToRight ? 0 : WIDTH - 1;
        const endX = scanLeftToRight ? WIDTH : -1;
        const stepX = scanLeftToRight ? 1 : -1;

        for (let x = startX; x !== endX; x += stepX) {
          const idx = y * WIDTH + x;
          const type = grid[idx];

          if (type === MAT.AIR || type === MAT.STONE || type === MAT.OBSIDIAN) continue;

          const prop = PROPS[type];

          if (prop.life) {
            lifeGrid[idx]--;
            if (lifeGrid[idx] <= 0) {
              if (type === MAT.FIRE) {
                grid[idx] = Math.random() > 0.4 ? MAT.SMOKE : MAT.AIR;
                lifeGrid[idx] = PROPS[MAT.SMOKE].life;
              } else {
                grid[idx] = MAT.AIR;
              }
              continue;
            }
          }

          const rx = x + (Math.random() > 0.5 ? 1 : -1);
          const ry = y + (Math.random() > 0.5 ? 1 : -1);

          if (prop.hot) {
            const neighbor = getPixel(rx, ry);
            const nProp = PROPS[neighbor];

            if (nProp && nProp.explosive) {
              triggerExplosion(rx, ry, type === MAT.C4 ? 35 : 25);
            }
            else if (nProp && nProp.meltable) {
              setPixel(rx, ry, MAT.WATER);
            }
            else if (nProp && nProp.flammable && Math.random() < nProp.burnRate) {
              setPixel(rx, ry, MAT.FIRE);
              lifeGrid[ry * WIDTH + rx] = 80 + Math.random() * 20;
            }
            else if (neighbor === MAT.WATER) {
              setPixel(rx, ry, MAT.STEAM);
              if (type === MAT.LAVA) grid[idx] = MAT.STONE;
            }
          }

          if (prop.infects) {
            const neighbors = [[1,0], [-1,0], [0,1], [0,-1]];
            const n = neighbors[Math.floor(Math.random() * neighbors.length)];
            const tx = x + n[0];
            const ty = y + n[1];
            if (tx >= 0 && tx < WIDTH && ty >= 0 && ty < HEIGHT) {
              const t = grid[ty * WIDTH + tx];
              if (t === MAT.WOOD || t === MAT.PLANT || t === MAT.GUNPOWDER) {
                if (Math.random() < 0.1) setPixel(tx, ty, MAT.VIRUS);
              }
              if (t === MAT.FIRE || t === MAT.LAVA) {
                setPixel(x, y, MAT.FIRE);
              }
            }
          }

          if (prop.corrosive && type !== MAT.ACID_GAS) {
            if (Math.random() < 0.05) {
              if (y + 1 < HEIGHT) {
                const t = grid[(y + 1) * WIDTH + x];
                const tProp = PROPS[t];
                if (tProp && tProp.type === 'solid' && t !== MAT.GLASS && t !== MAT.OBSIDIAN) {
                  setPixel(x, y + 1, MAT.AIR);
                  setPixel(x, y, MAT.ACID_GAS);
                  continue;
                }
              }
            }
          }

          if (prop.type === 'powder') {
            if (tryMove(x, y, x, y + 1)) continue;
            if (tryMove(x, y, x - 1, y + 1)) continue;
            if (tryMove(x, y, x + 1, y + 1)) continue;
          }
          else if (prop.type === 'liquid') {
            if (prop.viscosity && Math.random() < prop.viscosity) continue;
            if (tryMoveLiquid(x, y, x, y + 1, type, prop.density)) continue;
            if (tryMoveLiquid(x, y, x - 1, y + 1, type, prop.density)) continue;
            if (tryMoveLiquid(x, y, x + 1, y + 1, type, prop.density)) continue;
            const dir = Math.random() > 0.5 ? 1 : -1;
            const rate = prop.flowRate || 1;
            for (let i = 1; i <= rate; i++) {
              if (tryMoveLiquid(x, y, x + (dir * i), y, type, prop.density)) break;
              else break;
            }
          }
          else if (prop.type === 'gas') {
            if (tryMove(x, y, x, y - 1)) continue;
            if (tryMove(x, y, x - 1, y - 1)) continue;
            if (tryMove(x, y, x + 1, y - 1)) continue;
            if (tryMove(x, y, x + (Math.random() > 0.5 ? 1 : -1), y)) continue;
          }
          else if (type === MAT.FIRE) {
            const fx = x + Math.floor(Math.random() * 3) - 1;
            const fy = y + Math.floor(Math.random() * 3) - 1;
            if (fx >= 0 && fx < WIDTH && fy >= 0 && fy < HEIGHT) {
              const t = grid[fy * WIDTH + fx];
              if (t === MAT.AIR) swap(x, y, fx, fy);
              else if (PROPS[t] && PROPS[t].flammable && Math.random() < PROPS[t].burnRate * 3) {
                setPixel(fx, fy, MAT.FIRE);
              } else if (PROPS[t] && PROPS[t].explosive) {
                triggerExplosion(fx, fy, t === MAT.C4 ? 35 : 25);
              }
            }
          }
        }
      }
    }

    // --- EXPLOSION & PARTICLES ---

    function triggerExplosion(x, y, r) {
      explosionQueue.push({ x, y, r });
    }

    function processExplosions() {
      if (explosionQueue.length === 0) return;
      if (explosionQueue.length > 50) explosionQueue = [];

      const batch = explosionQueue.splice(0, 4);
      for (let e of batch) {
        performExplosion(e.x, e.y, e.r);
      }
    }

    function performExplosion(cx, cy, radius) {
      for (let y = -radius; y <= radius; y++) {
        for (let x = -radius; x <= radius; x++) {
          if (x * x + y * y <= radius * radius) {
            const tx = cx + x;
            const ty = cy + y;

            if (tx >= 0 && tx < WIDTH && ty >= 0 && ty < HEIGHT) {
              const type = grid[ty * WIDTH + tx];
              if (type !== MAT.AIR && type !== MAT.OBSIDIAN) {
                const prop = PROPS[type];

                const dx = x;
                const dy = y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const normDist = dist / radius;

                const force = 12 * (1 - normDist) + 2;
                const angle = Math.atan2(dy, dx);
                const vx = Math.cos(angle) * force;
                const vy = Math.sin(angle) * force;

                if (prop.type === 'liquid') {
                  if (Math.random() < 0.3) {
                    spawnDebris(tx, ty, type, vx, vy, 2, 2);
                    setPixel(tx, ty, MAT.AIR);
                  } else {
                    setPixel(tx, ty, MAT.AIR);
                  }
                }
                else if (prop.type === 'solid') {
                  let chunkChance = 0.15;
                  if (type === MAT.GLASS) chunkChance = 0.9;

                  if (Math.random() < chunkChance) {
                    const w = Math.floor(Math.random() * 3) + 2;
                    const h = Math.floor(Math.random() * 3) + 2;
                    spawnDebris(tx, ty, type, vx, vy, w, h);
                    for (let r = 0; r < h; r++) {
                      for (let c = 0; c < w; c++) {
                        if (tx + c < WIDTH && ty + r < HEIGHT) setPixel(tx + c, ty + r, MAT.AIR);
                      }
                    }
                  } else {
                    if (Math.random() < 0.5) setPixel(tx, ty, MAT.AIR);
                    else if (Math.random() < 0.5) setPixel(tx, ty, MAT.SMOKE);
                    else setPixel(tx, ty, MAT.FIRE);
                  }
                }
                else {
                  setPixel(tx, ty, MAT.FIRE);
                }
              }
            }
          }
        }
      }

      canvas.style.transform = `translate(${Math.random() * 6 - 3}px, ${Math.random() * 6 - 3}px)`;
      setTimeout(() => canvas.style.transform = 'none', 50);

      const dx = player.x - cx;
      const dy = player.y - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < radius + 15) {
        damagePlayer(40);
        if (dist > 0.01) {
          player.vx += (dx / dist) * 15;
          player.vy += (dy / dist) * 15;
        }
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        const w = p.w;
        const h = p.h;

        p.vy += GRAVITY;
        p.vx *= 0.99;
        p.x += p.vx;
        p.y += p.vy;
        p.angle += p.vAngle;

        if (p.x < 0 || p.x >= WIDTH || p.y >= HEIGHT) {
          particles.splice(i, 1);
          continue;
        }

        const ix = Math.round(p.x);
        const iy = Math.round(p.y);

        let collision = false;
        if (iy + h >= HEIGHT) collision = true;
        else if (ix < 0 || ix + w >= WIDTH) collision = true;
        else {
          if (!isEmpty(ix + Math.floor(w / 2), iy + h)) collision = true;
        }

        if (collision) {
          const myProps = PROPS[p.type];
          const bounce = myProps.bounce || 0;

          if (bounce > 0 && Math.abs(p.vy) > 2) {
            p.y -= p.vy;
            p.vy *= -bounce;
            p.vx *= 0.6;
            p.vAngle *= 0.8;
          } else {
            let settleY = iy;
            while (settleY + h < HEIGHT && isEmpty(ix + Math.floor(w / 2), settleY + h)) settleY++;

            if (settleY >= 0 && settleY + h < HEIGHT && ix >= 0 && ix + w < WIDTH) {
              for (let r = 0; r < h; r++) {
                for (let c = 0; c < w; c++) {
                  if (ix + c < WIDTH && settleY + r < HEIGHT) {
                    const existing = getPixel(ix + c, settleY + r);
                    const exProp = PROPS[existing];
                    if (existing === MAT.AIR || (myProps.type === 'solid' && exProp && exProp.type === 'liquid')) {
                      setPixel(ix + c, settleY + r, p.type);
                    }
                  }
                }
              }
            }
            particles.splice(i, 1);
          }
        }

        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function spawnDebris(x, y, type, vx, vy, w, h) {
      if (particles.length > MAX_PARTICLES) return;
      particles.push({
        x: x,
        y: y,
        vx: vx,
        vy: vy,
        type: type,
        life: 300,
        w: w,
        h: h,
        angle: Math.random() * 6.28,
        vAngle: (Math.random() - 0.5) * 0.5
      });
    }

    // --- HELPERS ---

    function tryMove(x, y, tx, ty) {
      if (tx < 0 || tx >= WIDTH || ty < 0 || ty >= HEIGHT) return false;
      const tIdx = ty * WIDTH + tx;
      const target = grid[tIdx];
      const tProp = PROPS[target];
      if (target === MAT.AIR || (tProp && tProp.type === 'liquid') || (tProp && tProp.type === 'gas')) {
        swap(x, y, tx, ty);
        return true;
      }
      return false;
    }

    function tryMoveLiquid(x, y, tx, ty, myType, myDensity) {
      if (tx < 0 || tx >= WIDTH || ty < 0 || ty >= HEIGHT) return false;
      const tIdx = ty * WIDTH + tx;
      const target = grid[tIdx];
      if (target === myType) return false;
      const tProp = PROPS[target];
      if (target === MAT.AIR || (tProp && tProp.type === 'gas') || (tProp && tProp.type === 'liquid' && tProp.density < myDensity)) {
        swap(x, y, tx, ty);
        return true;
      }
      return false;
    }

    function swap(x1, y1, x2, y2) {
      const i1 = y1 * WIDTH + x1;
      const i2 = y2 * WIDTH + x2;
      const temp = grid[i1];
      grid[i1] = grid[i2];
      grid[i2] = temp;
      const tempLife = lifeGrid[i1];
      lifeGrid[i1] = lifeGrid[i2];
      lifeGrid[i2] = tempLife;
      const tempCol = colorOffsetGrid[i1];
      colorOffsetGrid[i1] = colorOffsetGrid[i2];
      colorOffsetGrid[i2] = tempCol;
    }

    function isEmpty(x, y) {
      if (x < 0 || x >= WIDTH || y < 0 || y >= HEIGHT) return false;
      return grid[y * WIDTH + x] === MAT.AIR;
    }

    // --- PLAYER CONTROLLER ---

    function updatePlayer() {
      if (isNaN(player.x) || isNaN(player.y)) {
        player.x = WIDTH / 2;
        player.y = 20;
        player.vx = 0;
        player.vy = 0;
      }

      if (input.keys['ArrowLeft'] || input.keys['a']) {
        player.vx -= 0.5;
        player.facingRight = false;
      }
      if (input.keys['ArrowRight'] || input.keys['d']) {
        player.vx += 0.5;
        player.facingRight = true;
      }
      if (input.keys['ArrowUp'] || input.keys['w']) {
        if (player.onGround) {
          player.vy = -3.5;
          player.onGround = false;
        } else {
          player.vy -= 0.25;
          if (Math.random() > 0.5) {
            setPixel(Math.floor(player.x), Math.floor(player.y + player.height), MAT.FIRE);
            lifeGrid[Math.floor(player.y + player.height) * WIDTH + Math.floor(player.x)] = 5;
          }
        }
      }

      player.vy += GRAVITY;
      player.vx *= 0.9;
      player.vy = Math.max(Math.min(player.vy, TERMINAL_VELOCITY), -TERMINAL_VELOCITY);

      let nextX = player.x + player.vx;
      if (checkCollision(nextX, player.y)) {
        player.vx = 0;
        nextX = player.x;
      }
      player.x = nextX;

      let nextY = player.y + player.vy;
      if (checkCollision(player.x, nextY)) {
        if (player.vy > 0) player.onGround = true;
        player.vy = 0;
        nextY = Math.round(player.y);
      } else {
        player.onGround = false;
      }
      player.y = nextY;

      if (player.x < 0) player.x = 0;
      if (player.x > WIDTH - 1) player.x = WIDTH - 1;
      if (player.y > HEIGHT - 1) damagePlayer(100);

      checkHazards();
      if (frameCount % 60 === 0 && player.hp < player.maxHp && player.hp > 0) {
        player.hp++;
        updateHealthUI();
      }
      if (player.iframes > 0) player.iframes--;
    }

    function checkCollision(px, py) {
      const w = player.width;
      const h = player.height;
      const left = Math.floor(px - w / 2 + 1);
      const right = Math.floor(px + w / 2 - 1);
      const top = Math.floor(py - h + 1);
      const bottom = Math.floor(py);

      return isSolid(left, top) || isSolid(right, top) ||
        isSolid(left, bottom) || isSolid(right, bottom) ||
        isSolid(left, (top + bottom) / 2) || isSolid(right, (top + bottom) / 2);
    }

    function isSolid(x, y) {
      const t = getPixel(x, y);
      if (!PROPS[t]) return false;
      const type = PROPS[t].type;
      return type === 'solid';
    }

    function checkHazards() {
      if (player.hp <= 0) return;
      const cx = Math.floor(player.x);
      const cy = Math.floor(player.y - player.height / 2);
      const mats = [getPixel(cx, cy), getPixel(cx, Math.floor(player.y))];
      for (let m of mats) {
        if (PROPS[m] && PROPS[m].damage && player.iframes === 0) {
          damagePlayer(PROPS[m].damage);
          break;
        }
      }
    }

    function damagePlayer(amount) {
      if (player.hp <= 0) return;
      player.hp -= amount;
      player.iframes = 30;
      if (player.hp <= 0) {
        player.hp = 0;
        triggerExplosion(Math.floor(player.x), Math.floor(player.y), 10);
        setTimeout(initWorld, 2000);
      }
      updateHealthUI();
    }

    function updateHealthUI() {
      const bar = document.getElementById('health-bar');
      const pct = (player.hp / player.maxHp) * 100;
      bar.style.width = `${pct}%`;
      bar.style.backgroundColor = pct > 50 ? '#0f0' : pct > 20 ? '#ff0' : '#f00';
    }

    // --- RENDERING ---

    function draw() {
      const len = grid.length;
      for (let i = 0; i < len; i++) {
        const type = grid[i];
        const idx = i * 4;

        if (type === MAT.AIR) {
          data[idx] = 20;
          data[idx + 1] = 20;
          data[idx + 2] = 25;
          data[idx + 3] = 255;
        } else {
          const prop = PROPS[type];
          const color = prop.color;
          const noise = colorOffsetGrid[i];
          const variance = prop.variance || 0;
          const mod = (noise - 0.5) * variance;

          let r = color[0] + mod;
          let g = color[1] + mod;
          let b = color[2] + mod;

          if (prop.hot) {
            const flicker = Math.random() * 40;
            r += flicker;
            g += flicker / 2;
          }

          if (type === MAT.WATER) {
            data[idx] = r;
            data[idx + 1] = g;
            data[idx + 2] = b + Math.sin(i + frameCount * 0.1) * 5;
            data[idx + 3] = 200;
          } else if (type === MAT.SLIME) {
            data[idx] = r;
            data[idx + 1] = g + Math.sin(i + frameCount * 0.05) * 10;
            data[idx + 2] = b;
            data[idx + 3] = 220;
          } else if (type === MAT.GLASS) {
            data[idx] = 220;
            data[idx + 1] = 255;
            data[idx + 2] = 255;
            data[idx + 3] = 80;
          } else if (type === MAT.ACID_GAS) {
            data[idx] = r;
            data[idx + 1] = g;
            data[idx + 2] = b;
            data[idx + 3] = 100;
          } else {
            data[idx] = r;
            data[idx + 1] = g;
            data[idx + 2] = b;
            data[idx + 3] = 255;
          }
        }
      }
      ctx.putImageData(imgData, 0, 0);

      for (let p of projectiles) {
        let color = [255, 255, 255];
        if (p.mat !== MAT.AIR) color = PROPS[p.mat].color;
        else color = [255, 0, 0];

        ctx.fillStyle = `rgba(${color[0]}, ${color[1]}, ${color[2]}, 1)`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size || 2, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let p of particles) {
        const prop = PROPS[p.type];
        const w = p.w;
        const h = p.h;

        ctx.save();
        ctx.translate(p.x + w / 2, p.y + h / 2);
        ctx.rotate(p.angle);

        ctx.fillStyle = `rgba(${prop.color[0]}, ${prop.color[1]}, ${prop.color[2]}, ${prop.color[3] / 255})`;
        ctx.fillRect(-w / 2, -h / 2, w, h);

        ctx.restore();
      }

      if (player.hp > 0) {
        ctx.save();
        ctx.translate(player.x, player.y);
        if (player.iframes > 0 && Math.floor(frameCount / 4) % 2 === 0) ctx.globalAlpha = 0.5;

        ctx.fillStyle = '#a020f0';
        ctx.fillRect(-player.width / 2, -player.height, player.width, player.height);

        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.moveTo(-player.width / 2 - 1, -player.height);
        ctx.lineTo(player.width / 2 + 1, -player.height);
        ctx.lineTo(0, -player.height - 5);
        ctx.fill();

        if (input.keys['w'] || input.keys['ArrowUp']) {
          ctx.fillStyle = '#ffaa00';
          ctx.beginPath();
          ctx.moveTo(-2, 0);
          ctx.lineTo(2, 0);
          ctx.lineTo(0, 4 + Math.random() * 3);
          ctx.fill();
        }

        ctx.restore();

        const aimDx = (input.mouse.x / SCALE) - player.x;
        const aimDy = (input.mouse.y / SCALE) - (player.y - 4);
        const aimLen = Math.sqrt(aimDx * aimDx + aimDy * aimDy);
        const maxLen = 15;
        const ratio = Math.min(1, maxLen / aimLen);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - 4);
        ctx.lineTo(player.x + aimDx * ratio, (player.y - 4) + aimDy * ratio);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.beginPath();
        ctx.arc(input.mouse.x / SCALE, input.mouse.y / SCALE, 3, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    window.addEventListener('keydown', e => { input.keys[e.key] = true; });
    window.addEventListener('keyup', e => { input.keys[e.key] = false; });
    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      input.mouse.x = e.clientX - rect.left;
      input.mouse.y = e.clientY - rect.top;
    });
    canvas.addEventListener('mousedown', e => {
      if (e.button === 0) input.mouse.left = true;
      if (e.button === 2) input.mouse.right = true;
    });
    canvas.addEventListener('mouseup', e => {
      if (e.button === 0) input.mouse.left = false;
      if (e.button === 2) input.mouse.right = false;
    });
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      if (e.deltaY < 0) input.brushSize = Math.min(20, input.brushSize + 1);
      else input.brushSize = Math.max(1, input.brushSize - 1);
    }, { passive: false });
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    initWorld();
    requestAnimationFrame(loop);
  </script>
</body>
</html>

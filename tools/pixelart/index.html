<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pixel Art Creator — WIZARD</title><meta name="description" content="A small in-browser pixel art editor with mirror drawing, undo/redo, palette tracking, and PNG/JSON export. Part of the WIZARD atelier."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"><style>
:root {
  --bg: #0d0c0a;
  --panel: #100f0c;
  --ink: #e9e4d8;
  --ink-dim: #9c9587;
  --gold: #c9a227;
  --hairline: rgba(233, 228, 216, .12);
  --serif: 'Cinzel', Georgia, serif;
  --sans: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
}
html {
  margin: 0;
  padding: 0;
}
body {
  margin: 0;
  font-family: var(--sans);
  background-color: var(--bg);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 56px 20px 40px;
  min-height: 100vh;
  box-sizing: border-box;
}
.back-link {
  position: absolute;
  top: 16px;
  left: 20px;
  font-family: var(--serif);
  font-size: 13px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-dim);
  text-decoration: none;
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 4px 8px;
  transition: color .2s ease, border-color .2s ease;
}
.back-link:hover {
  color: var(--gold);
  border-color: var(--hairline);
}
h1 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 28px;
  letter-spacing: .06em;
  margin: 0 0 6px;
  text-align: center;
}
.tool-label {
  font-size: 11px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--gold);
  margin: 0 0 22px;
}
.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
  background-color: var(--panel);
  border: 1px solid var(--hairline);
  border-radius: 8px;
  padding: 12px 14px;
  width: 100%;
  max-width: 920px;
  box-sizing: border-box;
}
#palette {
  background: none;
  border: none;
  padding: 0;
  margin-bottom: 16px;
}
#palette:empty {
  display: none;
}
#palette button {
  padding: 0;
  box-sizing: border-box;
}
input[type="color"] {
  width: 50px;
  height: 32px;
  padding: 2px;
  background-color: var(--bg);
  border: 1px solid var(--hairline);
  border-radius: 4px;
  cursor: pointer;
}
button, select {
  padding: 6px 12px;
  font-family: var(--sans);
  font-size: 14px;
  color: var(--ink);
  background-color: var(--bg);
  border: 1px solid var(--hairline);
  cursor: pointer;
  border-radius: 4px;
  transition: border-color .2s ease, color .2s ease, transform .2s ease;
}
button:hover, select:hover, input[type="color"]:hover {
  border-color: var(--gold);
  transform: translateY(-1px);
}
button:focus-visible, select:focus-visible, input[type="color"]:focus-visible, a:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}
button.active {
  color: var(--gold);
  border-color: var(--gold);
  background-color: rgba(201, 162, 39, .08);
}
#pixel-canvas {
  border: 1px solid var(--hairline);
  border-radius: 2px;
  background-color: #fff;
  cursor: crosshair;
  image-rendering: pixelated;
  touch-action: none;
  max-width: 100%;
  height: auto;
}
@media (max-width: 480px) {
  body {
    padding: 64px 12px 28px;
  }
  h1 {
    font-size: 22px;
  }
  .controls {
    gap: 8px;
    padding: 10px;
  }
  button, select {
    padding: 6px 10px;
    font-size: 13px;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
  button:hover, select:hover, input[type="color"]:hover {
    transform: none;
  }
}
</style></head>
<body>
  <a class="back-link" href="../../index.html">&larr; WIZARD</a>
  <h1>Pixel Art Creator</h1>
  <p class="tool-label">Atelier Tool</p>
  <div class="controls">
    <input type="color" id="colorPicker" value="#000000" title="Choose color">
    <select id="canvasSize">
      <option value="16">16x16</option>
      <option value="32" selected>32x32</option>
      <option value="64">64x64</option>
    </select>
    <button id="paintTool" class="active">Paint</button>
    <button id="eraseTool">Erase</button>
    <button id="eyedropperTool">Eyedropper</button>
    <button id="mirrorXBtn">Mirror X</button>
    <button id="mirrorYBtn">Mirror Y</button>
    <button id="undoBtn">Undo</button>
    <button id="redoBtn">Redo</button>
    <button id="clearBtn">Clear</button>
    <button id="saveBtn">Export PNG</button>
    <button id="exportDataBtn">Export Data</button>
    <button id="toggleGridBtn">Grid</button>
  </div>
  <div id="palette" class="controls" style="margin-top: 10px; flex-wrap: wrap;"></div>
  <canvas id="pixel-canvas" width="512" height="512"></canvas>

<script>
const canvas = document.getElementById('pixel-canvas');
const ctx = canvas.getContext('2d');
const colorPicker = document.getElementById('colorPicker');
const canvasSizeSelect = document.getElementById('canvasSize');
const clearBtn = document.getElementById('clearBtn');
const saveBtn = document.getElementById('saveBtn');
const toggleGridBtn = document.getElementById('toggleGridBtn');
const undoBtn = document.getElementById('undoBtn');
const redoBtn = document.getElementById('redoBtn');
const exportDataBtn = document.getElementById('exportDataBtn');
const mirrorXBtn = document.getElementById('mirrorXBtn');
const mirrorYBtn = document.getElementById('mirrorYBtn');
const paintTool = document.getElementById('paintTool');
const eraseTool = document.getElementById('eraseTool');
const eyedropperTool = document.getElementById('eyedropperTool');
const paletteEl = document.getElementById('palette');

const state = {
  gridSize: parseInt(canvasSizeSelect.value, 10),
  pixelSize: canvas.width / parseInt(canvasSizeSelect.value, 10),
  showGrid: true,
  isDrawing: false,
  currentTool: 'paint',
  mirrorX: false,
  mirrorY: false,
  pixels: [],
  history: [],
  redoStack: []
};

function createEmptyPixels() {
  return Array.from({ length: state.gridSize }, () => Array(state.gridSize).fill('#ffffff'));
}

function drawAll() {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let y = 0; y < state.gridSize; y++) {
    for (let x = 0; x < state.gridSize; x++) {
      const color = state.pixels[y][x];
      if (color !== '#ffffff') {
        ctx.fillStyle = color;
        ctx.fillRect(x * state.pixelSize, y * state.pixelSize, state.pixelSize, state.pixelSize);
      }
    }
  }

  if (state.showGrid) {
    ctx.strokeStyle = '#d1d5db';
    ctx.lineWidth = 1;
    for (let i = 0; i <= state.gridSize; i++) {
      ctx.beginPath();
      ctx.moveTo(i * state.pixelSize, 0);
      ctx.lineTo(i * state.pixelSize, canvas.height);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, i * state.pixelSize);
      ctx.lineTo(canvas.width, i * state.pixelSize);
      ctx.stroke();
    }
  }

  updatePalette();
}

function initCanvas() {
  state.gridSize = parseInt(canvasSizeSelect.value, 10);
  state.pixelSize = canvas.width / state.gridSize;
  state.pixels = createEmptyPixels();
  state.history = [];
  state.redoStack = [];
  drawAll();
}

function toGridCoordinate(evt) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = Math.floor(((evt.clientX - rect.left) * scaleX) / state.pixelSize);
  const y = Math.floor(((evt.clientY - rect.top) * scaleY) / state.pixelSize);
  return { x, y };
}

function pushHistory() {
  const snapshot = state.pixels.map(row => [...row]);
  state.history.push(snapshot);
  if (state.history.length > 50) {
    state.history.shift();
  }
  state.redoStack = [];
}

function restoreFromSnapshot(snapshot) {
  state.pixels = snapshot.map(row => [...row]);
  drawAll();
}

function applyTool(x, y) {
  if (x < 0 || y < 0 || x >= state.gridSize || y >= state.gridSize) return;

  if (state.currentTool === 'eyedropper') {
    const sampled = state.pixels[y][x];
    colorPicker.value = sampled;
    setActiveTool('paint');
    return;
  }

  const color = state.currentTool === 'erase' ? '#ffffff' : colorPicker.value;
  setPixelWithMirrors(x, y, color);
}

function setPixelWithMirrors(x, y, color) {
  const targets = [{ x, y }];
  if (state.mirrorX) targets.push({ x: state.gridSize - 1 - x, y });
  if (state.mirrorY) targets.push({ x, y: state.gridSize - 1 - y });
  if (state.mirrorX && state.mirrorY) {
    targets.push({ x: state.gridSize - 1 - x, y: state.gridSize - 1 - y });
  }

  targets.forEach(({ x: tx, y: ty }) => {
    if (tx < 0 || ty < 0 || tx >= state.gridSize || ty >= state.gridSize) return;
    state.pixels[ty][tx] = color;
  });
  drawAll();
}

function startDrawing(evt) {
  state.isDrawing = true;
  pushHistory();
  handlePointer(evt);
}

function stopDrawing() {
  state.isDrawing = false;
}

function handlePointer(evt) {
  if (!state.isDrawing && state.currentTool !== 'eyedropper') return;
  const { x, y } = toGridCoordinate(evt);
  applyTool(x, y);
}

function undo() {
  if (state.history.length === 0) return;
  const snapshot = state.history.pop();
  state.redoStack.push(state.pixels.map(row => [...row]));
  restoreFromSnapshot(snapshot);
}

function redo() {
  if (state.redoStack.length === 0) return;
  const snapshot = state.redoStack.pop();
  state.history.push(state.pixels.map(row => [...row]));
  restoreFromSnapshot(snapshot);
}

function saveCanvas() {
  const link = document.createElement('a');
  link.download = 'pixel_art.png';
  link.href = canvas.toDataURL();
  link.click();
}

function exportData() {
  const data = {
    gridSize: state.gridSize,
    palette: [...new Set(state.pixels.flat().filter(color => color !== '#ffffff'))],
    pixels: state.pixels
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'pixel_art.json';
  link.click();
  URL.revokeObjectURL(url);
}

function toggleGrid() {
  state.showGrid = !state.showGrid;
  drawAll();
}

function clearCanvas() {
  pushHistory();
  state.pixels = createEmptyPixels();
  drawAll();
}

function toggleMirror(axis) {
  if (axis === 'x') {
    state.mirrorX = !state.mirrorX;
    mirrorXBtn.classList.toggle('active', state.mirrorX);
  } else {
    state.mirrorY = !state.mirrorY;
    mirrorYBtn.classList.toggle('active', state.mirrorY);
  }
}

function setActiveTool(tool) {
  state.currentTool = tool;
  [paintTool, eraseTool, eyedropperTool].forEach(btn => btn.classList.remove('active'));
  if (tool === 'paint') paintTool.classList.add('active');
  if (tool === 'erase') eraseTool.classList.add('active');
  if (tool === 'eyedropper') eyedropperTool.classList.add('active');
}

function updatePalette() {
  const colors = [...new Set(state.pixels.flat())].filter(color => color !== '#ffffff');
  paletteEl.innerHTML = '';
  colors.slice(0, 16).forEach(color => {
    const swatch = document.createElement('button');
    swatch.style.background = color;
    swatch.style.width = '32px';
    swatch.style.height = '32px';
    swatch.style.border = '1px solid rgba(233, 228, 216, .25)';
    swatch.style.borderRadius = '4px';
    swatch.style.cursor = 'pointer';
    swatch.title = color;
    swatch.addEventListener('click', () => {
      colorPicker.value = color;
      setActiveTool('paint');
    });
    paletteEl.appendChild(swatch);
  });
}

canvas.addEventListener('pointerdown', startDrawing);
canvas.addEventListener('pointermove', handlePointer);
window.addEventListener('pointerup', stopDrawing);
canvas.addEventListener('pointerleave', stopDrawing);

paintTool.addEventListener('click', () => setActiveTool('paint'));
eraseTool.addEventListener('click', () => setActiveTool('erase'));
eyedropperTool.addEventListener('click', () => setActiveTool('eyedropper'));
mirrorXBtn.addEventListener('click', () => toggleMirror('x'));
mirrorYBtn.addEventListener('click', () => toggleMirror('y'));
undoBtn.addEventListener('click', undo);
redoBtn.addEventListener('click', redo);
clearBtn.addEventListener('click', clearCanvas);
saveBtn.addEventListener('click', saveCanvas);
exportDataBtn.addEventListener('click', exportData);
toggleGridBtn.addEventListener('click', toggleGrid);
canvasSizeSelect.addEventListener('change', initCanvas);

initCanvas();
</script>
</body></html>

      tree: (props) => (<svg viewBox="0 0 24 24" {...iconBase} {...props}><path d="M12 2l5 7h-3l4 6h-5v0H11v0H6l4-6H7z" /><path d="M12 15v6" /></svg>),

      star: (props) => (<svg viewBox="0 0 24 24" {...iconBase} {...props}><path d="M12 3l2.4 5.8 6.1.5-4.7 4 1.5 6L12 16l-5.3 3.3 1.5-6-4.7-4 6.1-.5z" /></svg>),

    const Icon = ({ name, className, size = 20 }) => {
      const Comp = ICONS[name] || ICONS.shield;
      return <Comp className={className} width={size} height={size} />;
    };

    // ============================================================
    // Static data
    // ============================================================
    const generateId = () => Math.random().toString(36).substr(2, 9);
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const timeStamp = () => new Date().toLocaleTimeString([], { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
    const possessive = (fullName) => {
      const first = (fullName || 'Unknown').trim().split(/\s+/)[0];
      return first.endsWith('s') ? `${first}'` : `${first}'s`;
    };
    const apiKey = ""; // Optional: set if you want live LLM calls

    const SIGIL_COLORS = [
      { id: 'crimson', label: 'Crimson', hex: '#8c2f28' },
      { id: 'azure', label: 'Azure', hex: '#2c4a6e' },
      { id: 'verdant', label: 'Verdant', hex: '#3d5a3a' },
      { id: 'gold', label: 'Gold', hex: '#a9861f' },
      { id: 'amethyst', label: 'Amethyst', hex: '#5b3a72' },
      { id: 'slate', label: 'Slate', hex: '#4a4e57' },
      { id: 'umber', label: 'Umber', hex: '#6e4a2c' },
      { id: 'void', label: 'Void', hex: '#2a1f38' },
    ];
    const SIGIL_CHARGES = ['crown', 'sword', 'tower', 'tree', 'moon', 'flame', 'star', 'skull'];

    // Attributes: shared canon with tools/geometric_skilltree — same three axes, same colors.
    const ATTRS = {
      str: { short: 'STR', label: 'Strength', color: '#f06a54' },
      dex: { short: 'DEX', label: 'Dexterity', color: '#56c88b' },
      int: { short: 'INT', label: 'Intelligence', color: '#6e9cff' },
    };
    // STR soaks blows, DEX finds fortune, INT learns fast.
    const attrMods = (attrs) => ({
      dmg: Math.max(0.55, 1 - attrs.str * 0.03),
      loot: 1 + attrs.dex * 0.05,
      xp: 1 + attrs.int * 0.03,
    });
    const baseMaxHp = (attrs) => 70 + attrs.str * 6;
    // Classes lean on one axis. Plain archetypes on purpose — no invented titles.
    const CLASSES = [
      { id: 'warrior', name: 'Warrior', icon: 'shield', attr: 'str', desc: 'The wall the House hides behind. Slow to learn, slower to die.', attrs: { str: 8, dex: 4, int: 3 }, outfitItem: { form: 'Spear', material: 'copper' } },
      { id: 'rogue', name: 'Rogue', icon: 'sword', attr: 'dex', desc: 'Quick hands, quicker feet. Finds what others walk past.', attrs: { str: 4, dex: 8, int: 3 }, outfitItem: { form: 'Handaxe', material: 'copper' } },
      { id: 'mage', name: 'Mage', icon: 'scroll', attr: 'int', desc: 'Reads entrails and skies. Knows much, bleeds easily.', attrs: { str: 3, dex: 4, int: 8 }, outfitItem: { form: 'Ring', material: 'copper' } },
    ];

    const ZONES = [
      { id: 'fields', name: 'Millbrook Fields', danger: 1, minLevel: 1, desc: 'Tame farmland gone slightly wrong.', lines: ['Following a hedgerow', 'Questioning a nervous shepherd', 'Poking a scarecrow that moved'] },
      { id: 'woods', name: 'The Dark Woods', danger: 2, minLevel: 3, desc: 'The trees keep their own counsel.', lines: ['Cutting through bramble', 'Marking trunks with chalk', 'Losing sight of the sun'] },
      { id: 'ruins', name: 'Crumbling Ruins', danger: 3, minLevel: 5, desc: 'Something older than the kingdom.', lines: ['Reading half-worn inscriptions', 'Climbing a fallen column', 'Stepping over old bones'] },
      { id: 'crypts', name: 'The Sunken Crypts', danger: 4, minLevel: 8, desc: 'The dead here were buried standing up.', lines: ['Wading through black water', 'Counting alcoves in the dark', 'Snuffing the lantern to listen'] },
      { id: 'rift', name: 'The Pale Rift', danger: 5, minLevel: 11, desc: 'Where the map ends and the scribes go quiet.', lines: ['Walking on ground that hums', 'Ignoring a voice that knows your name', 'Watching two moons where one should be'] },
    ];

    const MONSTERS = {
      1: ['Field Rat', 'Kobold Scavenger', 'Mud Crab', 'Feral Hound'],
      2: ['Goblin Skirmisher', 'Dire Wolf', 'Bog Wisp', 'Roadside Bandit'],
      3: ['Skeleton', 'Raider', 'Ghoul', 'Mimic'],

      5: ['Rift Stalker', 'Pale Seraph', 'Void Beast', 'The Hollow King'],

    // Itemization: shared canon with tools/rpg_inventory (Vesselforge / Verdigris pack).
    // No rarity ladder — power IS the material. Form × material combos mirror verdigris-pack.js.

      flint: { name: 'Flint', tier: 1 }, bone: { name: 'Bone', tier: 1 }, hide: { name: 'Hide', tier: 1 },
      quilted: { name: 'Quilted', tier: 2 }, copper: { name: 'Copper', tier: 2 },
      bronze: { name: 'Bronze', tier: 3 }, obsidian: { name: 'Obsidian', tier: 3 },
      jade: { name: 'Jade', tier: 4 }, amber: { name: 'Amber', tier: 4 }, bronzescale: { name: 'Bronze-scale', tier: 4 },
      skymetal: { name: 'Skymetal', tier: 5 },
      rivetmail: { name: 'Riveted Mail', tier: 6 },
    };
    const FORMS = {
      Handaxe: ['flint', 'copper', 'bronze', 'obsidian', 'skymetal'],
      Spear: ['flint', 'bone', 'copper', 'bronze', 'obsidian', 'skymetal'],
      Macuahuitl: ['obsidian', 'flint', 'bone'],
      Atlatl: ['bone', 'copper', 'bronze'],
      Khopesh: ['copper', 'bronze', 'skymetal'],
      Sling: ['hide', 'quilted'],
      Shield: ['hide', 'bronze', 'bronzescale', 'rivetmail'],
      Wrap: ['hide', 'quilted', 'bronzescale', 'rivetmail'],
      Crest: ['bone', 'hide', 'copper', 'bronze', 'jade'],
      Gorget: ['jade', 'amber', 'bone', 'copper'],
      Ring: ['bone', 'copper', 'jade', 'amber'],
      Curio: ['bone', 'jade', 'amber'],

    const TIER_STYLE = {
      1: { text: 'text-stone-400', chip: 'text-stone-400 border-stone-700' },
      2: { text: 'text-orange-300', chip: 'text-orange-300 border-orange-900' },
      3: { text: 'text-amber-300', chip: 'text-amber-300 border-amber-800' },

    const itemStyle = (it) => it.relicId ? RELIC_STYLE : (TIER_STYLE[it.tier] || TIER_STYLE[1]);
    const makeItem = (form, material) => ({ id: generateId(), name: `${MATERIALS[material].name} ${form}`, form, material, tier: MATERIALS[material].tier });
    // Relics deepen by being carried and lived with (Bonds, in Vesselforge terms) — never "reforged".
    const TIER_EPITHETS = { 2: 'Remembered', 3: 'Storied', 4: 'Undying' };
    const relicDisplayName = (relic, tier) => {
      const t = Math.min(tier, 4);
      const suffix = TIER_EPITHETS[t] ? `, ${TIER_EPITHETS[t]}` : '';

    // Legacy boons: unlocked permanently at renown thresholds.
    const BOONS = [
      { id: 'oral_tradition', renown: 150, icon: 'book', name: 'Oral Tradition', corruptName: 'Whispered Heresies', desc: 'Tales of the fallen guide the young. Scions gain +15% experience.' },
      { id: 'ancestral_arms', renown: 400, icon: 'sword', name: 'Ancestral Arms', corruptName: 'Grave Goods', desc: 'New scions set out bearing a circulating relic of the House.' },
      { id: 'hardened_blood', renown: 800, icon: 'heart', name: 'Hardened Blood', corruptName: 'Ichor of the Void', desc: 'The lineage endures. Scions gain +25 vitality.' },

      { id: 'long_memory', renown: 3000, icon: 'history', name: 'The Long Memory', corruptName: 'Eternal Recurrence', desc: 'Each generation begins where the last left a mark. Scions start at level 3.' },
    ];
    const unlockedBoons = (house) => BOONS.filter(b => house.renown >= b.renown);
    const boonMods = (house) => {
      const ids = unlockedBoons(house).map(b => b.id);
      return {
        xp: ids.includes('oral_tradition') ? 1.15 : 1,
        hp: ids.includes('hardened_blood') ? 25 : 0,
        relicChance: ids.includes('grave_whispers') ? 2 : 1,
        startLevel: ids.includes('long_memory') ? 3 : 1,
        startRelic: ids.includes('ancestral_arms'),
      };
    };
    const boonName = (boon, isCorrupt) => (isCorrupt ? boon.corruptName : boon.name);

    // Verdigris canon: copper is wealth. The House vault counts copper, not gold.
    const OUTFIT_COST = 75;
    const NOBLE_COPPER = 100;
    const CORRUPT_COPPER = 666;

    // ============================================================
    // Lore: offline pools + optional LLM
    // ============================================================
    const OFFLINE_LORE = {
      houseName: ['Vaelmont', 'Druskane', 'Morvayne', 'Ashford', 'Thornholt', 'Caldrest', 'Veyrane', 'Oakhart', 'Greyford', 'Stillbrook', 'Blackwell', 'Marlowe'],
      voidName: ['The Unhallowed', 'The Hollow House', 'The Broken House', 'The Nameless', 'The Last House'],
      motto: ['Ash remembers', 'Iron before honey', 'We endure the long dark', 'No crown without thorns', 'The river forgets nothing', 'Silence keeps the keep', 'Debt is a kind of love', 'The last light is ours'],
      charName: ['Kaelen Dray', 'Mirelle of the Fen', 'Tobias Crane', 'Sera Voss', 'Aldric Thane', 'Wren Calloway', 'Edmun Hale', 'Isolde Marr', 'Petra Quill', 'Rooke Damaris', 'Fenn Oswic', 'Lysa Corveaux'],
      origin: [
        'Raised among the lime kilns of a dying quarry town, sworn to outlive its debts.',
        'Last survivor of a caravan lost in the Foggy Swamp; speaks little of what followed.',
        'A disgraced retainer seeking to buy back an honored name, one contract at a time.',
        'Schooled by hedge-clerics in letters and knife-work, in roughly equal measure.',
        'Born under a hanged moon; the village midwife refused payment and left by night.',
        'Third child of a third child, owed nothing and determined to collect anyway.',
        'Kept the tollbridge ledger for nine years, then one morning burned it and walked east.',
      ],
      epitaph: [
        'They walked into the dark so others would not have to.',
        'Went further than the maps.',
        'Debt paid in full.',
        'The river forgets nothing; neither do we.',
        'Third of the name, first to the wall.',
        'Asked the wrong question in the right place.',
        'The House endures because they did not.',
      ],
    };
    const offlineLore = (prompt) => {
      if (/house name/i.test(prompt)) return /void|chaos/i.test(prompt) ? pick(OFFLINE_LORE.voidName) : pick(OFFLINE_LORE.houseName);
      if (/motto/i.test(prompt)) return /void|chaos/i.test(prompt) ? 'Chaos Reigns Eternal' : pick(OFFLINE_LORE.motto);
      if (/character name/i.test(prompt)) return pick(OFFLINE_LORE.charName);
      if (/origin/i.test(prompt)) return pick(OFFLINE_LORE.origin);
      if (/epitaph/i.test(prompt)) return pick(OFFLINE_LORE.epitaph);
      return '';
    };
    async function callGeminiAPI(prompt, systemInstruction, responseSchema = null) {
      if (!apiKey) {
        // offline/dev fallback: judge leniently, draw lore from local pools
        return responseSchema ? { approved: true, message: 'The scribes nod in silence.' } : offlineLore(prompt);
      }
      const delays = [500, 1000, 2000];
      for (let i = 0; i <= delays.length; i++) {
        try {
          const payload = {
            contents: [{ parts: [{ text: prompt }] }],
            systemInstruction: { parts: [{ text: systemInstruction }] },
            generationConfig: responseSchema ? { responseMimeType: 'application/json', responseSchema } : {}
          };
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error(res.statusText);
          const data = await res.json();
          const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!text) throw new Error('No content');
          return responseSchema ? JSON.parse(text) : text;
        } catch (err) {
          if (i === delays.length) throw err;
          await new Promise(r => setTimeout(r, delays[i]));
        }
      }
    }
    const cleanAIOutput = (text) => (text || '').replace(/(\*\*|__)/g, '').replace(/^.*:\s*/, '').replace(/['"]+/g, '').replace(/\.$/, '').trim();

    const consultTheScribes = async (type, data) => {
      const systemPrompt = `
        You are the High Scribe of a grim fantasy realm. Approve only serious, immersive entries.
        1. Reject modern, silly, meme, or offensive names.
        2. Reject names that are too short or random characters.
        3. If rejected, respond with a short, in-character refusal.
        4. If approved, respond with a brief, atmospheric blessing.
      `;
      const userPrompt = `Judge this ${type}: ${data.name}. Context: ${data.context || 'None'}`;
      const schema = { type: 'OBJECT', properties: { approved: { type: 'BOOLEAN' }, message: { type: 'STRING' } } };
      try {
        return await callGeminiAPI(userPrompt, systemPrompt, schema);
      } catch (err) {
        console.error(err);
        return { approved: true, message: 'The scribes are silent, but you pass unchallenged.' };
      }
    };

    const generateLore = async (type, context) => {
      const systemPrompt = `
        You are a fantasy chronicler. Return ONLY the requested string.
        No labels, no quotes, no markdown. Keep it concise.
      `;
      const userPrompt = `Generate a ${type} for: ${context}`;
      try {
        const result = await callGeminiAPI(userPrompt, systemPrompt);
        return cleanAIOutput(result);
      } catch (err) {
        console.error(err);
        return '';
      }
    };

    // ============================================================
    // Persistence & migration
    // ============================================================
    const STORAGE_KEY = 'wizard_rp_v3';
    const V2_KEY = 'wizard_rp_v2';
    const V1_KEY = 'wizard_rp_houses';
    const LEGACY_COLOR_MAP = {
      'text-red-500': 'crimson', 'text-blue-500': 'azure', 'text-green-500': 'verdant',
      'text-amber-500': 'gold', 'text-purple-500': 'amethyst', 'text-slate-200': 'slate',
    };
    const CLASS_MIGRATION = {
      vanguard: 'warrior', shieldbearer: 'warrior',
      ranger: 'rogue', wayfarer: 'rogue',
      arcanist: 'mage', omenspeaker: 'mage',
    };
    const migrateClassId = (id) => CLASS_MIGRATION[id] || (CLASSES.some(c => c.id === id) ? id : 'warrior');
    const attrsFor = (classId, level) => {
      const def = CLASSES.find(c => c.id === classId) || CLASSES[0];
      const attrs = { ...def.attrs };
      for (let i = 1; i < (level || 1); i++) {
        attrs.str += def.attr === 'str' ? 2 : 1;
        attrs.dex += def.attr === 'dex' ? 2 : 1;
        attrs.int += def.attr === 'int' ? 2 : 1;
      }
      return attrs;
    };
    const V2_RARITY_TO_MATERIAL = { common: 'flint', fine: 'copper', runed: 'bronze', ancient: 'jade' };
    const migrateItem = (it) => {
      if (it.form && it.material) return it; // already v3
      if (it.relicId) return { ...it, tier: it.tier || 2 };
      const material = V2_RARITY_TO_MATERIAL[it.rarity] || 'flint';
      const forms = Object.keys(FORMS).filter(f => FORMS[f].includes(material));
      return makeItem(pick(forms), material);
    };
    const migrateV2Char = (c) => {
      const classId = migrateClassId(c.class);
      return {
        ...c, class: classId,
        attrs: c.attrs || attrsFor(classId, c.level),
        items: (c.items || []).map(migrateItem),
      };
    };
    function loadHouses() {
      try {
        const v3 = localStorage.getItem(STORAGE_KEY);
        if (v3) {
          // Normalize older class ids (e.g. shieldbearer/wayfarer/omenspeaker) in place.
          const parsed = JSON.parse(v3);
          Object.values(parsed).forEach(h => {
            (h.characters || []).forEach(c => { c.class = migrateClassId(c.class); });
            (h.crypt || []).forEach(d => { d.class = migrateClassId(d.class); });
          });
          return parsed;
        }
        const v2 = localStorage.getItem(V2_KEY);
        if (v2) {
          const old = JSON.parse(v2);
          const migrated = {};
          Object.values(old).forEach(h => {
            migrated[h.id] = {
              ...h,
              copper: h.copper ?? h.gold ?? NOBLE_COPPER,
              characters: (h.characters || []).map(migrateV2Char),
              crypt: (h.crypt || []).map(d => ({ ...d, class: migrateClassId(d.class) })),
              reliquary: h.reliquary || [],
            };
            delete migrated[h.id].gold;
          });
          return migrated;
        }
        const v1 = localStorage.getItem(V1_KEY);
        if (!v1) return {};
        const old = JSON.parse(v1);
        const migrated = {};
        Object.values(old).forEach(h => {
          migrated[h.id] = {
            id: h.id, name: h.name, motto: h.motto, origin: h.origin || 'noble',
            founded: new Date().toISOString(),
            sigil: { color: LEGACY_COLOR_MAP[h.sigilColor] || 'gold', charge: 'crown' },
            copper: h.resources?.gold ?? NOBLE_COPPER,
            renown: h.resources?.renown ?? 0,
            characters: (h.characters || []).map(c => {
              const classId = migrateClassId(c.class);
              const attrs = attrsFor(classId, c.level || 1);
              const maxHp = baseMaxHp(attrs);
              return {
                id: c.id, name: c.name, class: classId, level: c.level || 1, xp: c.xp || 0,
                hp: maxHp, maxHp, attrs, kills: 0, status: 'alive',
                origin: c.backstory || '', items: [], deeds: [], brand: c.perks?.includes('fools_errand') ? 'fool' : null,
                createdAt: c.createdAt || new Date().toISOString(),
              };
            }),
            crypt: (h.crypt || []).map(d => ({
              id: d.id, name: d.name, class: migrateClassId(d.class), level: d.level || 1,
              epitaph: 'From before the chronicles were kept.', cause: 'Lost to the old records',
              kills: 0, deeds: [], relics: [], diedAt: d.diedAt || new Date().toISOString(),
            })),
            reliquary: [],
          };
        });
        return migrated;
      } catch (err) {
        console.error('Failed to load houses', err);
        return {};
      }
    }

    // ============================================================
    // World simulation (pure step function)
    // ============================================================
    const TICK_MS = 1600;
    // Material tier weighted by zone danger; DEX (fortune) tilts toward better materials.
    // Skymetal only surfaces at danger 4+; riveted mail stays a rumor outside the Rift.
    function rollLootItem(danger, lootMod) {
      const w = {
        1: Math.max(5, 55 - danger * 9),
        2: 24,
        3: (6 + danger * 3) * lootMod,
        4: (1.5 + danger * 1.5) * lootMod,
        5: danger >= 4 ? danger * 0.7 * lootMod : 0,
        6: danger === 5 ? 0.25 : 0,
      };
      let r = Math.random() * Object.values(w).reduce((a, b) => a + b, 0);
      let tier = 1;
      for (const t of Object.keys(w)) { r -= w[t]; if (r <= 0) { tier = Number(t); break; } }
      const material = pick(Object.keys(MATERIALS).filter(m => MATERIALS[m].tier === tier));
      const form = pick(Object.keys(FORMS).filter(f => FORMS[f].includes(material)));
      return makeItem(form, material);
    }
    const pushLog = (logs, m, kind) => [...logs.slice(-44), { t: timeStamp(), m, kind }];
    const addDeed = (deeds, d) => (deeds.includes(d) || deeds.length >= 10) ? deeds : [...deeds, d];

    // One event per tick. `ctx` = { zone, mods, reliquary }
    function stepSim(sim, ctx) {
      if (sim.dead) return sim;
      const { zone, mods, reliquary } = ctx;
      const am = attrMods(sim.attrs);
      const d = zone.danger;
      let s = { ...sim, ticks: sim.ticks + 1 };
      const roll = Math.random();

      const circulating = reliquary.filter(r => r.status === 'circulating' && !s.foundRelics.includes(r.id));
      const relicChance = circulating.length ? 0.035 * mods.relicChance : 0;

      if (roll < relicChance) {
        // An ancestor's relic surfaces, its bonds deepened one tier by the years underground.
        const relic = pick(circulating);
        const newTier = Math.min(relic.tier + 1, 4);
        const name = relicDisplayName(relic, newTier);
        s.foundRelics = [...s.foundRelics, relic.id];
        s.items = [...s.items, { id: generateId(), name, base: relic.base, form: relic.form, material: relic.material, relicId: relic.id }];
        s.deeds = addDeed(s.deeds, `Reclaimed ${name}`);
        s.logs = pushLog(s.logs, `Unearthed ${name} — once borne by ${relic.origin}. The House remembers.`, 'relic');
        s.action = 'Turning a relic over in the light';
      } else if (roll < relicChance + 0.36) {
        // Combat: victory, but it costs blood. STR soaks, INT learns.
        const mob = pick(MONSTERS[d]);
        const dmg = Math.max(1, Math.round((3 + Math.random() * 7) * d * am.dmg));
        const xpGain = Math.round((12 + Math.random() * 10) * d * am.xp * mods.xp);
        s.hp = s.hp - dmg;
        s.kills += 1;
        s.xp += xpGain;
        s.logs = pushLog(s.logs, `Slew ${mob} (+${xpGain} xp, -${dmg} hp)`, 'fight');
        s.action = `Wiping the blade clean`;
        if (d >= 4) s.deeds = addDeed(s.deeds, `Felled a horror of ${zone.name}`);
        if (s.hp <= 0) {
          s.hp = 0;
          s.dead = true;
          s.cause = `Slain by ${mob} in ${zone.name}`;
          s.logs = pushLog(s.logs, `${s.name} has fallen.`, 'warn');
          return s;
        }
        if (s.hp / s.maxHp < 0.25) s.logs = pushLog(s.logs, 'Bleeding badly. The Hall is not far — yet.', 'warn');
      } else if (roll < relicChance + 0.58) {
        // Loot: copper always; sometimes a vessel worth keeping (tier 2+ material).
        const copper = Math.round((2 + Math.random() * 6) * d);
        s.copperFound += copper;
        const item = rollLootItem(d, am.loot);
        const art = /^[aeiou]/i.test(item.name) ? 'an' : 'a';
        if (item.tier <= 1) {
          s.logs = pushLog(s.logs, `Scavenged ${art} ${item.name.toLowerCase()} and ${copper} copper — anyone's tools`, 'loot');
        } else if (s.items.length < 8) {
          s.logs = pushLog(s.logs, `Found ${art} ${item.name} and ${copper} copper`, 'loot');
        } else {
          s.logs = pushLog(s.logs, `Found ${art} ${item.name}, but the pack is full. Left it for the crows. (+${copper} copper)`, 'loot');
        }
        s.action = 'Weighing the take';
      } else if (roll < relicChance + 0.72) {
        // Rest / recover
        const heal = Math.round(8 + d * 3 + Math.random() * 6);
        s.hp = Math.min(s.maxHp, s.hp + heal);
        s.logs = pushLog(s.logs, `Made camp and bound wounds (+${heal} hp)`, 'rest');
        s.action = 'Watching the fire burn low';
      } else {
        // Flavor / travel
        const line = pick(zone.lines);
        s.logs = pushLog(s.logs, `${line}...`, 'flavor');
        s.action = line;
      }

      // Level up (xp needed = level * 100, resets each level); +2 to the calling's axis, +1 to the others
      while (s.xp >= s.level * 100) {
        s.xp -= s.level * 100;
        s.level += 1;
        s.attrs = {
          str: s.attrs.str + (s.primary === 'str' ? 2 : 1),
          dex: s.attrs.dex + (s.primary === 'dex' ? 2 : 1),
          int: s.attrs.int + (s.primary === 'int' ? 2 : 1),
        };
        s.maxHp += 8;
        s.hp = Math.min(s.maxHp, s.hp + Math.round(s.maxHp * 0.4));
        s.logs = pushLog(s.logs, `${s.name} has reached level ${s.level}.`, 'level');
        if (s.level === 5) s.deeds = addDeed(s.deeds, 'Survived to the fifth rank');
        if (s.level === 10) s.deeds = addDeed(s.deeds, 'Stood among the ten-ranked');
      }
      return s;
    }

    // ============================================================

    // ============================================================

          <path d="M10 10 H90 V52 C90 80 72 98 50 108 C28 98 10 80 10 52 Z" fill="url(#banner-shine)" />

    const SharedDefs = () => (

    const DangerPips = ({ n }) => (

    const Meter = ({ value, max, color, label }) => (
      <div>

        <div className="h-2 w-full bg-stone-900 rounded-full overflow-hidden border border-stone-800">

        </div>

    );
    const SuggestBtn = ({ onClick, disabled, generating, label = 'Suggest' }) => (
      <button onClick={onClick} disabled={disabled || generating} className="text-amber-400 hover:text-amber-300 flex items-center gap-1 disabled:opacity-40">

    const RejectionRow = ({ rejects }) => rejects > 0 ? (

        {[...Array(3)].map((_, i) => <div key={i} className={`h-2 w-10 rounded-full ${i < rejects ? 'bg-red-600' : 'bg-stone-800'}`}></div>)}

    ) : null;
    const ScribeMessage = ({ message }) => message ? (

    // ============================================================
    // View: Gate (account home — all your Houses)

    function Gate({ houses, onEnter, onFound }) {

                <button onClick={onFound} className="border border-dashed border-stone-800 hover:border-amber-800 rounded-xl p-6 flex flex-col items-center justify-center gap-2 text-stone-600 hover:text-amber-400 transition min-h-[170px]">

            )}

            <p className="text-center text-xs text-stone-700 mt-10">

    }

    // ============================================================
    // View: Founding Ceremony

        setGenerating(false);
      };

        setGenerating(false);

        onCreate(corruptName, corruptMotto, { color: 'void', charge: 'skull' }, true);
        showNote('The scribes reject you; a Corrupt House is forged in spite.');

      const handleSubmit = async () => {
        setJudging(true); setMessage(null);

          showNote(verdict.message);
          onCreate(name, motto, { color, charge }, false);

                <p className="text-stone-500 italic text-sm mb-5">"State your name for the record. The scribes are listening."</p>
                <div className="space-y-5">
                  <div>
                    <div className="text-xs uppercase tracking-widest text-stone-500 mb-1.5">Sigil Color</div>

                      {SIGIL_COLORS.map(c => (
                        <button key={c.id} onClick={() => setColor(c.id)} title={c.label}

                          style={{ background: c.hex }}></button>

                  <div>
                    <div className="text-xs uppercase tracking-widest text-stone-500 mb-1.5">Sigil Charge</div>

                          <Icon name={ch} size={18} />

                      ))}

                  </div>
                  <div>
                    <div className="flex justify-between items-center text-xs uppercase tracking-widest text-stone-500 mb-1">
                      <span>House Name</span>
                      <SuggestBtn onClick={generateName} generating={generating} />
                    </div>
                    <input value={name} onChange={(e) => setName(e.target.value)} className="w-full bg-stone-900 border border-stone-700 rounded px-4 py-3 font-serif text-lg focus:border-amber-500 outline-none" />
                  </div>
                  <div>
                    <div className="flex justify-between items-center text-xs uppercase tracking-widest text-stone-500 mb-1">
                      <span>House Motto</span>
                      <SuggestBtn onClick={generateMotto} generating={generating} disabled={!name} />
                    </div>
                    <input value={motto} onChange={(e) => setMotto(e.target.value)} className="w-full bg-stone-900 border border-stone-700 rounded px-4 py-3 font-serif italic focus:border-amber-500 outline-none" />
                  </div>
                  <RejectionRow rejects={rejects} />
                  <ScribeMessage message={message} />
                  <button onClick={handleSubmit} disabled={!name || !motto || judging}
                    className="w-full bg-amber-600 hover:bg-amber-500 text-stone-900 font-bold py-3 rounded border border-amber-400 uppercase tracking-widest disabled:opacity-50">
                    {judging ? 'Consulting Scribes...' : 'Seal the Pact'}
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // View: Hall (house overview)
    // ============================================================

                    return (
                      <div key={ch.id} className="bg-stone-900 border border-stone-800 rounded-lg p-4 hover:border-amber-700 transition">
                        <div className="flex flex-wrap gap-y-3 items-center justify-between">
                          <div className="flex items-center gap-4">
                            <div className="w-12 h-12 rounded-full bg-stone-950 border border-stone-800 flex items-center justify-center shrink-0">

                            <div>
                              <div className="flex items-center gap-2">

                  <div className="mb-4">

                  <div className="space-y-3 max-h-96 overflow-y-auto pr-1">
                    {house.crypt.map(d => (
                      <button key={d.id} onClick={() => setOpenCrypt(openCrypt === d.id ? null : d.id)} className="w-full text-left group">
                        <div className="flex justify-between text-sm">
                          <span className="text-stone-300 group-hover:text-stone-100">{d.name}</span>
                          <span className="text-stone-600">Lvl {d.level} {CLASSES.find(c => c.id === d.class)?.name || d.class}</span>

                        <p className="text-xs text-stone-500 italic">"{d.epitaph}"</p>
                        {openCrypt === d.id && (
                          <div className="mt-1.5 pl-2 border-l border-stone-800 space-y-0.5">
                            <p className="text-[11px] text-red-300/70">{d.cause}</p>
                            <p className="text-[11px] text-stone-500">{d.kills} kills • {d.relics.length} relic{d.relics.length === 1 ? '' : 's'} interred</p>

              </div>
            </div>
          </div>
        </div>

    // ============================================================
    // View: Recruit
    // ============================================================
    function Recruit({ house, onCreate, onBack, showNote }) {
      const [name, setName] = useState('');
      const [cls, setCls] = useState(CLASSES[0].id);
      const [origin, setOrigin] = useState('');
      const [outfit, setOutfit] = useState(false);
      const [rejects, setRejects] = useState(0);
      const [judging, setJudging] = useState(false);
      const [message, setMessage] = useState(null);
      const [generating, setGenerating] = useState(false);
      const isCorrupt = house.origin === 'corrupt';
      const mods = boonMods(house);
      const unlocked = unlockedBoons(house);
      const canOutfit = house.copper >= OUTFIT_COST;

      const generateName = async () => {
        setGenerating(true);
        const n = await generateLore('Character Name', `High fantasy name for a ${cls}. Seed ${Math.floor(Math.random() * 1000)}.`);
        if (n) setName(n);
        setGenerating(false);
      };
      const generateOrigin = async () => {
        if (!name) return;
        setGenerating(true);
        const o = await generateLore('Character Origin', `${name}, a ${cls}, gritty dark fantasy origin.`);
        if (o) setOrigin(o);
        setGenerating(false);
      };
      const triggerFool = () => {
        const pool = ['Bozo the Lost', 'Jester of Ruin', 'The Unworthy', 'Buffoon McStumble', 'Giggles'];
        onCreate({ name: pick(pool), cls: 'warrior', origin: 'A fool branded by the scribes.', brand: 'fool', outfit: false });
        showNote('You are branded a Fool. The scribes choose your fate.');
      };
      const handleSubmit = async () => {
        setJudging(true); setMessage(null);
        const verdict = await consultTheScribes('Character', { name, context: origin });
        setJudging(false);
        if (verdict.approved) {
          showNote(verdict.message);
          onCreate({ name, cls, origin, brand: null, outfit: outfit && canOutfit });
        } else {
          const next = rejects + 1;
          setRejects(next);
          setMessage(verdict.message);
          if (next >= 3) setTimeout(triggerFool, 1200);
        }
      };

      const selected = CLASSES.find(c => c.id === cls);
      const startAttrs = attrsFor(selected.id, mods.startLevel);
      const startHp = baseMaxHp(startAttrs) + (mods.startLevel - 1) * 8 + mods.hp + (outfit && canOutfit ? 10 : 0);
      const outfitName = `${MATERIALS[selected.outfitItem.material].name} ${selected.outfitItem.form}`;

      return (
        <div className="min-h-screen flex items-center justify-center bg-stone-950 p-6">
          <div className="w-full max-w-5xl glass rounded-xl shadow-2xl grid md:grid-cols-2 overflow-hidden rise-in">
            <div className="p-8 border-b md:border-b-0 md:border-r border-stone-800">
              <button onClick={onBack} className="text-sm text-stone-500 hover:text-stone-200 mb-4 flex items-center gap-1">&larr; Return to Hall</button>
              <h2 className="text-2xl font-serif text-amber-400 mb-4">Choose a Path</h2>
              <div className="space-y-3">
                {CLASSES.map(c => (
                  <button key={c.id} onClick={() => setCls(c.id)} className={`w-full text-left p-4 rounded border transition ${cls === c.id ? 'border-amber-500 bg-amber-900/20' : 'border-stone-800 bg-stone-950 hover:border-stone-600'}`}>
                    <div className="flex items-start gap-3">
                      <Icon name={c.icon} className={cls === c.id ? 'text-amber-400' : 'text-stone-500'} />
                      <div className="flex-1">
                        <h3 className={`font-serif text-lg ${cls === c.id ? 'text-stone-100' : 'text-stone-400'}`}>{c.name}</h3>
                        <p className="text-xs text-stone-500">{c.desc}</p>
                        <div className="flex gap-3 mt-1.5 text-[11px] font-bold">
                          {Object.keys(ATTRS).map(k => (
                            <span key={k} title={ATTRS[k].label} style={{ color: ATTRS[k].color, opacity: c.attr === k ? 1 : 0.5 }}>{ATTRS[k].short} {c.attrs[k]}</span>
                          ))}
                        </div>
                      </div>
                    </div>
                  </button>
                ))}
              </div>
              {unlocked.length > 0 && (
                <div className="mt-5 border-t border-stone-800 pt-4">
                  <p className="text-xs uppercase tracking-widest text-stone-600 mb-2">The House provides</p>
                  <div className="space-y-1">
                    {unlocked.map(b => (
                      <p key={b.id} className="text-xs text-stone-500 flex items-center gap-2">
                        <Icon name={b.icon} size={13} className={isCorrupt ? 'text-purple-300' : 'text-amber-400'} /> {boonName(b, isCorrupt)}
                      </p>
                    ))}
                  </div>
                </div>
              )}
            </div>
            <div className="p-8 bg-stone-950/60">
              <h3 className="text-xl font-serif text-stone-200 mb-1">Identity</h3>
              <p className="text-xs text-stone-600 mb-4">Starts at level {mods.startLevel} with {startHp} vitality.</p>
              <div className="space-y-5">
                <div>
                  <div className="flex justify-between items-center text-xs uppercase tracking-widest text-stone-500 mb-1">
                    <span>Name</span>
                    <SuggestBtn onClick={generateName} generating={generating} />
                  </div>
                  <input value={name} onChange={(e) => setName(e.target.value)} className="w-full bg-stone-900 border border-stone-700 rounded px-3 py-2 focus:border-amber-500 outline-none" placeholder="Scion name" />
                </div>
                <div>
                  <div className="flex justify-between items-center text-xs uppercase tracking-widest text-stone-500 mb-1">
                    <span>Origin (optional)</span>
                    <SuggestBtn onClick={generateOrigin} generating={generating} disabled={!name} label="Imagine" />
                  </div>
                  <textarea value={origin} onChange={(e) => setOrigin(e.target.value)} className="w-full bg-stone-900 border border-stone-700 rounded px-3 py-2 h-24 resize-none text-sm focus:border-amber-500 outline-none" />
                </div>
                <label className={`flex items-start gap-3 text-sm rounded border p-3 cursor-pointer transition ${outfit && canOutfit ? 'border-amber-700 bg-amber-900/10' : 'border-stone-800'} ${canOutfit ? '' : 'opacity-50 cursor-not-allowed'}`}>
                  <input type="checkbox" checked={outfit && canOutfit} disabled={!canOutfit} onChange={(e) => setOutfit(e.target.checked)} className="mt-0.5 accent-amber-600" />
                  <span>
                    <span className="text-stone-200">Outfit from the vault</span>
                    <span className="text-orange-300 font-mono ml-2">−{OUTFIT_COST} copper</span>
                    <span className="block text-xs text-stone-500">Begin with a {outfitName} and +10 vitality. {canOutfit ? '' : 'The vault cannot afford it.'}</span>
                  </span>
                </label>
                <RejectionRow rejects={rejects} />
                <ScribeMessage message={message} />
                <button onClick={handleSubmit} disabled={!name || judging} className="w-full bg-stone-100 text-stone-900 py-3 font-bold rounded hover:bg-white disabled:opacity-50 flex items-center justify-center gap-2">
                  {judging ? <><Icon name="loader" size={16} className="text-stone-800" /><span>Consulting...</span></> : <><Icon name="sparkles" className="text-amber-600" /> Sign the Contract</>}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // View: World (the expedition)
    // ============================================================
    function World({ house, char, onSync, onDeath, onRetreat }) {
      const classDef = CLASSES.find(c => c.id === char.class) || CLASSES[0];
      const mods = boonMods(house);
      const [zoneId, setZoneId] = useState(ZONES[0].id);
      const [sim, setSim] = useState(() => ({
        name: char.name,
        hp: char.hp, maxHp: char.maxHp, xp: char.xp, level: char.level,
        attrs: char.attrs || attrsFor(char.class, char.level), primary: classDef.attr,
        kills: char.kills, items: char.items, deeds: char.deeds,
        copperFound: 0, houseCopperStart: house.copper, foundRelics: [],
        logs: [{ t: timeStamp(), m: `${char.name} sets out from the Hall of ${house.name}.`, kind: 'travel' }],
        ticks: 0, dead: false, cause: null, action: 'Setting out',
      }));
      const ctxRef = useRef(null);
      const deathSent = useRef(false);
      const endRef = useRef(null);
      const zone = ZONES.find(z => z.id === zoneId);
      ctxRef.current = { zone, mods, reliquary: house.reliquary };

      useEffect(() => {
        const iv = setInterval(() => setSim(s => stepSim(s, ctxRef.current)), TICK_MS);
        return () => clearInterval(iv);
      }, []);
      useEffect(() => {
        onSync(sim);
        if (sim.dead && !deathSent.current) {
          deathSent.current = true;
          setTimeout(() => onDeath(sim.cause), 900);
        }
      }, [sim]);
      useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [sim.logs]);

      const travelTo = (z) => {
        if (z.id === zoneId || sim.dead) return;
        setZoneId(z.id);
        setSim(s => ({ ...s, logs: pushLog(s.logs, `Traveling to ${z.name}. ${z.desc}`, 'travel'), action: `On the road to ${z.name}` }));
      };
      const LOG_COLORS = { fight: 'text-red-300', loot: 'text-amber-200', relic: 'text-purple-300', travel: 'text-stone-400', rest: 'text-green-300', flavor: 'text-stone-500', warn: 'text-red-400 font-bold', level: 'text-amber-400 font-bold' };

      return (
        <div className="min-h-screen bg-stone-950 text-stone-300 font-mono p-4 sm:p-6 rise-in">
          <div className="max-w-6xl mx-auto">
            <div className="flex flex-wrap gap-y-3 justify-between items-center border-b border-stone-800 pb-4 mb-4">
              <div className="flex items-center gap-4">
                <div className="w-12 h-12 rounded bg-stone-900 border border-stone-700 flex items-center justify-center">
                  <Icon name={classDef.icon} className="text-amber-500" />
                </div>
                <div>
                  <h1 className="text-xl font-bold font-serif">{sim.name}</h1>
                  <p className="text-xs text-stone-500">Level {sim.level} {classDef.name} of {house.name}</p>
                  <div className="flex gap-3 mt-0.5">
                    {Object.keys(ATTRS).map(k => (
                      <span key={k} className="text-[11px] font-bold" style={{ color: ATTRS[k].color }}>{ATTRS[k].short} {sim.attrs[k]}</span>
                    ))}
                  </div>
                </div>
              </div>
              <button onClick={() => onRetreat(sim)} disabled={sim.dead}
                className="text-stone-300 hover:text-amber-300 border border-stone-700 hover:border-amber-800 px-4 py-2 text-xs uppercase tracking-widest disabled:opacity-40 rounded">
                Retreat to the Hall
              </button>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-4 gap-4">
              {/* Zones */}
              <div className="space-y-2">
                <p className="text-[10px] uppercase tracking-widest text-stone-600">The Wilds</p>
                {ZONES.map(z => {
                  const active = z.id === zoneId;
                  const risky = sim.level < z.minLevel;
                  return (
                    <button key={z.id} onClick={() => travelTo(z)}
                      className={`w-full text-left p-3 rounded border text-xs transition ${active ? 'border-amber-600 bg-amber-900/15' : 'border-stone-800 bg-stone-900/40 hover:border-stone-600'}`}>
                      <div className="flex justify-between items-center gap-2">
                        <span className={active ? 'text-amber-300' : 'text-stone-300'}>{z.name}</span>
                        <DangerPips n={z.danger} />
                      </div>
                      <p className="text-stone-600 mt-0.5">{z.desc}</p>
                      {risky && <p className="text-red-400/80 mt-0.5">The scribes advise level {z.minLevel}.</p>}
                    </button>
                  );
                })}
                <p className="text-[10px] text-stone-700 leading-relaxed pt-1">Deeper wilds pay more in copper, glory, and relics — and take payment in blood. Retreat while you still can.</p>
              </div>

              {/* Main column */}
              <div className="lg:col-span-3 space-y-4">
                <div className="grid grid-cols-2 gap-4">
                  <Meter value={Math.max(0, Math.round(sim.hp))} max={sim.maxHp} color={sim.hp / sim.maxHp < 0.3 ? 'bg-red-600' : 'bg-red-800'} label="Vitality" />
                  <Meter value={sim.xp} max={sim.level * 100} color="bg-blue-700" label={`To level ${sim.level + 1}`} />
                </div>
                <div className="grid grid-cols-3 gap-3">
                  <div className="bg-stone-900/60 border border-stone-800 rounded p-3 flex justify-between items-center"><span className="text-[10px] text-stone-500 uppercase">Kills</span><span className="text-red-400 font-bold flex items-center gap-1"><Icon name="skull" size={15} />{sim.kills}</span></div>
                  <div className="bg-stone-900/60 border border-stone-800 rounded p-3 flex justify-between items-center"><span className="text-[10px] text-stone-500 uppercase">Copper</span><span className="text-orange-300 font-bold flex items-center gap-1"><Icon name="coins" size={15} />{sim.copperFound}</span></div>
                  <div className="bg-stone-900/60 border border-stone-800 rounded p-3 flex justify-between items-center"><span className="text-[10px] text-stone-500 uppercase">Relics</span><span className="text-purple-300 font-bold flex items-center gap-1"><Icon name="gem" size={15} />{sim.foundRelics.length}</span></div>
                </div>
                <div>
                  <div className="flex justify-between text-xs text-amber-500 mb-1 uppercase"><span>{zone.name}</span><span>{sim.action}...</span></div>
                  <div className="h-1.5 w-full bg-stone-900 rounded-full overflow-hidden border border-stone-800">
                    {!sim.dead && <div key={sim.ticks} className="h-full bg-amber-700/80 tick-bar"></div>}
                  </div>
                </div>
                <div className="relative bg-stone-950 border border-stone-800 rounded p-4 h-[44vh] overflow-y-auto scanline">
                  <div className="space-y-1">
                    {sim.logs.map((l, i) => (
                      <div key={i} className="text-sm">
                        <span className="text-stone-700 mr-2">[{l.t}]</span>
                        <span className={LOG_COLORS[l.kind] || 'text-stone-400'}>{l.m}</span>
                      </div>
                    ))}
                    <div ref={endRef}></div>
                  </div>
                </div>
                {sim.items.length > 0 && (
                  <div className="flex flex-wrap gap-1.5">
                    {sim.items.map(it => (
                      <span key={it.id} className={`text-[11px] border rounded px-1.5 py-0.5 ${itemStyle(it).chip}`}>{it.name}</span>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // Rite of Passing (death / retirement ceremony)
    // ============================================================
    function RiteModal({ char, cause, cancelable, onCommit, onCancel }) {
      const [epitaph, setEpitaph] = useState('');
      const [generating, setGenerating] = useState(false);
      // Tier-1 materials are anyone's tools; only tier 2+ vessels carry enough of a life to become relics.
      const relicsToInter = char.items.filter(it => it.relicId || it.tier >= 2);
      const renownGain = char.level * 100 + char.kills * 2 + relicsToInter.length * 50;
      const suggest = async () => {
        setGenerating(true);
        const e = await generateLore('Epitaph', `${char.name}, level ${char.level}, ${cause}. One short solemn line.`);
        if (e) setEpitaph(e);
        setGenerating(false);
      };
      return (
        <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-6">
          <div className="w-full max-w-lg glass rounded-xl p-8 text-center rise-in">
            <Icon name="skull" size={52} className="mx-auto text-red-400 mb-3" />
            <h2 className="text-2xl font-serif text-stone-100">{char.name} has fallen</h2>
            <p className="text-sm text-stone-500 mt-1">{cause}</p>
            <div className="grid grid-cols-3 gap-3 my-6 text-sm">
              <div className="bg-stone-900/70 border border-stone-800 rounded p-3">
                <div className="text-purple-300 font-mono text-lg">+{renownGain}</div>
                <div className="text-[10px] uppercase tracking-widest text-stone-600">Renown</div>
              </div>
              <div className="bg-stone-900/70 border border-stone-800 rounded p-3">
                <div className="text-stone-200 font-mono text-lg">{char.kills}</div>
                <div className="text-[10px] uppercase tracking-widest text-stone-600">Kills</div>
              </div>
              <div className="bg-stone-900/70 border border-stone-800 rounded p-3">
                <div className="text-purple-300 font-mono text-lg">{relicsToInter.length}</div>
                <div className="text-[10px] uppercase tracking-widest text-stone-600">Relics interred</div>
              </div>
            </div>
            {relicsToInter.length > 0 && (
              <div className="text-left bg-stone-900/50 border border-stone-800 rounded p-3 mb-5">
                <p className="text-[10px] uppercase tracking-widest text-stone-600 mb-1.5">Given back to the world</p>
                {relicsToInter.map(it => (
                  <p key={it.id} className={`text-xs ${itemStyle(it).text}`}>{it.name} <span className="text-stone-600">— its bonds sleep in the metal until another hand wakes them</span></p>
                ))}
              </div>
            )}
            <div className="text-left mb-5">
              <div className="flex justify-between items-center text-xs uppercase tracking-widest text-stone-500 mb-1">
                <span>Epitaph</span>
                <SuggestBtn onClick={suggest} generating={generating} />
              </div>
              <textarea value={epitaph} onChange={(e) => setEpitaph(e.target.value)} placeholder="Words for the crypt wall..."
                className="w-full bg-stone-900 border border-stone-700 rounded px-3 py-2 h-20 resize-none text-sm italic focus:border-amber-500 outline-none" />
            </div>
            <div className="flex gap-3">
              {cancelable && (
                <button onClick={onCancel} className="flex-1 border border-stone-700 text-stone-400 hover:text-stone-200 py-3 rounded uppercase tracking-widest text-xs">
                  Not Yet
                </button>
              )}
              <button onClick={() => onCommit(epitaph.trim() || pick(OFFLINE_LORE.epitaph))}
                className="flex-1 bg-stone-100 hover:bg-white text-stone-900 font-bold py-3 rounded uppercase tracking-widest text-xs">
                Commit to the Crypt
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // App
    // ============================================================
    function App() {
      const [houses, setHouses] = useState(loadHouses);
      const [view, setView] = useState('gate');
      const [currentHouseId, setCurrentHouseId] = useState(null);
      const [activeCharId, setActiveCharId] = useState(null);
      const [pendingDeath, setPendingDeath] = useState(null); // { charId, cause, cancelable }
      const [notification, setNotification] = useState(null);
      const noteTimer = useRef(null);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(houses));
      }, [houses]);

      const showNote = (msg) => {
        setNotification(msg);
        clearTimeout(noteTimer.current);
        noteTimer.current = setTimeout(() => setNotification(null), 4000);
      };

      const currentHouse = currentHouseId ? houses[currentHouseId] : null;
      const updateHouse = (id, fn) => setHouses(prev => (prev[id] ? { ...prev, [id]: fn(prev[id]) } : prev));

      // --- House lifecycle ---
      const createHouse = (name, motto, sigil, isCorrupt) => {
        if (!isCorrupt && Object.values(houses).some(h => h.name.toLowerCase() === name.toLowerCase())) {
          showNote('A House of that name already exists in this realm.');
          return;
        }
        const id = generateId();
        const house = {
          id, name, motto, sigil,
          origin: isCorrupt ? 'corrupt' : 'noble',
          founded: new Date().toISOString(),
          copper: isCorrupt ? CORRUPT_COPPER : NOBLE_COPPER,
          renown: 0,
          characters: [], crypt: [], reliquary: [],
        };
        setHouses(prev => ({ ...prev, [id]: house }));
        setCurrentHouseId(id);
        setView('hall');
      };

      // --- Character lifecycle ---
      const createCharacter = ({ name, cls, origin, brand, outfit }) => {
        if (!currentHouse) return;
        const classDef = CLASSES.find(c => c.id === cls) || CLASSES[0];
        const mods = boonMods(currentHouse);
        const level = mods.startLevel;
        const attrs = attrsFor(classDef.id, level);
        const maxHp = baseMaxHp(attrs) + (level - 1) * 8 + mods.hp + (outfit ? 10 : 0);
        const items = [];
        if (outfit) items.push(makeItem(classDef.outfitItem.form, classDef.outfitItem.material));
        updateHouse(currentHouseId, h => {
          const house = { ...h };
          if (outfit) house.copper = Math.max(0, house.copper - OUTFIT_COST);
          // Ancestral Arms: hand down a circulating relic, reforged.
          if (mods.startRelic) {
            const circ = house.reliquary.filter(r => r.status === 'circulating');
            if (circ.length) {
              const relic = pick(circ);
              const newTier = Math.min(relic.tier + 1, 4);
              items.push({ id: generateId(), name: relicDisplayName(relic, newTier), base: relic.base, form: relic.form, material: relic.material, relicId: relic.id });
              house.reliquary = house.reliquary.map(r => r.id === relic.id
                ? { ...r, tier: newTier, status: 'borne', history: [...r.history, `Handed down to ${name} at the recruiting rite.`] }
                : r);
            }
          }
          const newChar = {
            id: generateId(), name, class: cls, level, xp: 0,
            hp: maxHp, maxHp, attrs, kills: 0, status: 'alive',
            origin: origin || '', items, deeds: [], brand: brand || null,
            createdAt: new Date().toISOString(),
          };
          house.characters = [...house.characters, newChar];
          return house;
        });
        setView('hall');
      };

      // --- World sync: reconcile sim state into the house ---
      const syncSim = (sim) => {
        if (!currentHouseId || !activeCharId) return;
        updateHouse(currentHouseId, h => {
          const house = { ...h, copper: sim.houseCopperStart + sim.copperFound };
          house.characters = house.characters.map(c => c.id === activeCharId
            ? { ...c, hp: sim.hp, maxHp: sim.maxHp, xp: sim.xp, level: sim.level, attrs: sim.attrs, kills: sim.kills, items: sim.items, deeds: sim.deeds }
            : c);
          // Relics reclaimed this run: mark as borne, tier up, log provenance (idempotent via status check).
          house.reliquary = house.reliquary.map(r => {
            if (sim.foundRelics.includes(r.id) && r.status === 'circulating') {
              const char = house.characters.find(c => c.id === activeCharId);
              return { ...r, tier: Math.min(r.tier + 1, 4), status: 'borne', history: [...r.history, `Unearthed by ${char ? char.name : 'a scion'}, reforged.`] };
            }
            return r;
          });
          return house;
        });
      };

      const retreat = (sim) => {
        syncSim(sim);
        // The house tends its own: scions recover fully in the hall.
        updateHouse(currentHouseId, h => ({
          ...h,
          characters: h.characters.map(c => c.id === activeCharId ? { ...c, hp: c.maxHp } : c),
        }));
        showNote('The scion returns. The hearth does the rest.');
        setActiveCharId(null);
        setView('hall');
      };

      const commitDeath = (epitaph) => {
        if (!pendingDeath || !currentHouse) return;
        const char = currentHouse.characters.find(c => c.id === pendingDeath.charId);
        if (!char) { setPendingDeath(null); return; }
        const relicsToInter = char.items.filter(it => it.relicId || it.tier >= 2);
        const renownGain = char.level * 100 + char.kills * 2 + relicsToInter.length * 50;
        const before = unlockedBoons(currentHouse).length;
        updateHouse(currentHouseId, h => {
          const house = { ...h, renown: h.renown + renownGain };
          house.characters = h.characters.filter(c => c.id !== char.id);
          house.crypt = [{
            id: char.id, name: char.name, class: char.class, level: char.level,
            epitaph, cause: pendingDeath.cause, kills: char.kills, deeds: char.deeds,
            relics: relicsToInter.map(it => it.name), diedAt: new Date().toISOString(),
          }, ...h.crypt];
          // Inter the dead's notable items: they enter (or return to) circulation.
          const date = new Date().toLocaleDateString();
          const returned = [];
          relicsToInter.forEach(it => {
            if (it.relicId) {
              house.reliquary = house.reliquary.map(r => r.id === it.relicId
                ? { ...r, status: 'circulating', history: [...r.history, `Interred with ${char.name}; returned to the world.`] }
                : r);
              returned.push(it.relicId);
            }
          });
          const fresh = relicsToInter.filter(it => !it.relicId).map(it => ({
            id: generateId(), base: it.name, form: it.form, material: it.material, origin: char.name, tier: 1,
            status: 'circulating',
            history: [`Carried by ${char.name}, interred ${date}. Its bonds sleep in the metal, seeded into the world's drop tables.`],
          }));
          house.reliquary = [...fresh, ...house.reliquary];
          return house;
        });
        const after = BOONS.filter(b => (currentHouse.renown + renownGain) >= b.renown).length;
        if (after > before) {
          const boon = BOONS.filter(b => (currentHouse.renown + renownGain) >= b.renown).slice(-1)[0];
          showNote(`${char.name} has fallen. +${renownGain} renown — the House learns: ${boonName(boon, currentHouse.origin === 'corrupt')}.`);
        } else {
          showNote(`${char.name} has fallen. +${renownGain} renown. ${relicsToInter.length ? 'Their belongings now circulate as relics.' : ''}`);
        }
        setPendingDeath(null);
        setActiveCharId(null);
        setView('hall');
      };

      const retire = (charId) => setPendingDeath({ charId, cause: 'Took the Grey Vow and retired to the crypt', cancelable: true });
      const worldDeath = (cause) => setPendingDeath({ charId: activeCharId, cause, cancelable: false });

      // --- Render ---
      const activeChar = currentHouse?.characters.find(c => c.id === activeCharId);
      const riteChar = pendingDeath ? currentHouse?.characters.find(c => c.id === pendingDeath.charId) : null;

      return (
        <div className="font-sans antialiased">
          <SharedDefs />
          {notification && (
            <div className="fixed top-14 left-1/2 -translate-x-1/2 z-[60] bg-stone-900 border border-amber-900/50 text-amber-100 px-5 py-3 rounded shadow-2xl flex items-center gap-2 max-w-[90vw]">
              <span className="h-2 w-2 rounded-full bg-amber-500 shrink-0"></span>
              <span className="text-sm">{notification}</span>
            </div>
          )}
          {view === 'gate' && <Gate houses={houses} onEnter={(id) => { setCurrentHouseId(id); setView('hall'); }} onFound={() => setView('founding')} />}
          {view === 'founding' && <Founding onCreate={createHouse} onBack={() => setView('gate')} showNote={showNote} />}
          {view === 'hall' && currentHouse && (
            <Hall house={currentHouse}
              onRecruit={() => setView('recruit')}
              onEnterWorld={(id) => { setActiveCharId(id); setView('world'); }}
              onRetire={retire}
              onSwitchHouse={() => { setCurrentHouseId(null); setView('gate'); }} />
          )}
          {view === 'recruit' && currentHouse && (
            <Recruit house={currentHouse} onCreate={createCharacter} onBack={() => setView('hall')} showNote={showNote} />
          )}
          {view === 'world' && currentHouse && activeChar && (
            <World key={activeChar.id} house={currentHouse} char={activeChar}
              onSync={syncSim} onDeath={worldDeath} onRetreat={retreat} />
          )}
          {riteChar && (
            <RiteModal char={riteChar} cause={pendingDeath.cause} cancelable={pendingDeath.cancelable}
              onCommit={commitDeath} onCancel={() => setPendingDeath(null)} />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

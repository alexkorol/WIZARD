<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced ARPG Inventory System</title>
<!-- Include Tailwind CSS via CDN -->
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<!-- Include React and ReactDOM via CDN -->
<script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
<!-- Include Babel for JSX transformation -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  /* Custom scrollbar styling */
  .inventory-grid::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  .inventory-grid::-webkit-scrollbar-thumb {
    background-color: rgba(55, 65, 81, 0.8);
    border-radius: 4px;
  }
  .tooltip {
    position: absolute;
    z-index: 50;
    width: 12rem;
    padding: 0.5rem;
    background-color: #1f2937;
    border: 1px solid #374151;
    border-radius: 0.25rem;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    pointer-events: none;
  }
  /* Grid background */
  .grid-background {
    background-image: linear-gradient(to right, rgba(255,255,255,0.1) 1px, transparent 1px),
                      linear-gradient(to bottom, rgba(255,255,255,0.1) 1px, transparent 1px);
    background-size: 2.5rem 2.5rem;
  }
  /* Item outline */
  .item-outline {
    outline: 1px solid rgba(255,255,255,0.2);
  }
  /* Drag animation */
  .dragging {
    opacity: 0.5;
  }
  /* Item styling */
  .item {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    cursor: move;
    z-index: 10;
  }
  /* Occupied slot */
  .occupied {
    background-color: rgba(75, 85, 99, 0.3);
  }
</style>
</head>
<body class="bg-gray-900 text-white">

<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect } = React;

  // Define constants
  const GRID_COLS = 8;
  const INVENTORY_SIZE = 72;
  const SLOT_SIZE = 2.5; // rem

  // Define rarity colors
  const RARITY_COLORS = {
    common: 'text-gray-200 border-gray-600',
    uncommon: 'text-green-400 border-green-700',
    rare: 'text-blue-400 border-blue-700',
    epic: 'text-purple-400 border-purple-700',
    legendary: 'text-yellow-400 border-yellow-700',
  };

  // Define items
  const ITEMS = {
    POTION: { 
      id: 'potion',
      icon: '🧪', 
      name: 'Health Potion', 
      width: 1, 
      height: 1, 
      type: 'consumable',
      rarity: 'common',
      stats: 'Restores 100 HP',
      stackable: true,
      maxStack: 20,
      count: 1,
    },
    SWORD: { 
      id: 'sword',
      icon: '⚔️', 
      name: 'Ancient Broadsword', 
      width: 1, 
      height: 2, 
      type: 'weapon',
      rarity: 'rare',
      stats: '+45 Physical Damage\n+10% Attack Speed',
    },
    SHIELD: { 
      id: 'shield',
      icon: '🛡️', 
      name: 'Tower Shield', 
      width: 2, 
      height: 2, 
      type: 'shield',
      rarity: 'uncommon',
      stats: '+30 Armor\n+5% Block Chance',
    },
    CHEST: { 
      id: 'chest',
      icon: '🎽', 
      name: 'Plate Mail', 
      width: 2, 
      height: 2, 
      type: 'armor',
      rarity: 'rare',
      stats: '+150 Armor\n+20 Vitality',
    },
    HELM: { 
      id: 'helm',
      icon: '⛑️', 
      name: 'War Helm', 
      width: 2, 
      height: 2, 
      type: 'helm',
      rarity: 'uncommon',
      stats: '+50 Armor\n+10 Strength',
    },
    BOOTS: { 
      id: 'boots',
      icon: '👢', 
      name: 'Steel Boots', 
      width: 2, 
      height: 1, 
      type: 'boots',
      rarity: 'common',
      stats: '+40 Armor\n+5% Movement Speed',
    },
    GLOVES: { 
      id: 'gloves',
      icon: '🧤', 
      name: 'Leather Gloves', 
      width: 2, 
      height: 1, 
      type: 'gloves',
      rarity: 'common',
      stats: '+30 Armor\n+5 Dexterity',
    },
    RING: { 
      id: 'ring',
      icon: '💍', 
      name: 'Magic Ring', 
      width: 1, 
      height: 1, 
      type: 'ring',
      rarity: 'epic',
      stats: '+15% Magic Find\n+10 Intelligence',
    },
    AMULET: { 
      id: 'amulet',
      icon: '📿', 
      name: 'Ancient Amulet', 
      width: 1, 
      height: 1, 
      type: 'amulet',
      rarity: 'epic',
      stats: '+20% Experience Gain\n+15 All Attributes',
    },
    BELT: { 
      id: 'belt',
      icon: '🎗️', 
      name: 'Warrior Belt', 
      width: 2, 
      height: 1, 
      type: 'belt',
      rarity: 'uncommon',
      stats: '+50 Armor\n+10% Potion Effectiveness',
    },
    STAFF: { 
      id: 'staff',
      icon: '🏑', 
      name: 'Magic Staff', 
      width: 1, 
      height: 3, 
      type: 'weapon',
      rarity: 'rare',
      stats: '+60 Magic Damage\n+15% Spell Casting Speed',
    },
    BOOK: { 
      id: 'book',
      icon: '📕', 
      name: 'Spell Tome', 
      width: 2, 
      height: 2, 
      type: 'offhand',
      rarity: 'rare',
      stats: '+25 Intelligence\n+10% Mana Regeneration',
    },
    DAGGER: { 
      id: 'dagger',
      icon: '🗡️', 
      name: 'Shadow Dagger', 
      width: 1, 
      height: 1, 
      type: 'weapon',
      rarity: 'rare',
      stats: '+30 Physical Damage\n+20% Critical Strike Chance',
    },
    AXE: { 
      id: 'axe',
      icon: '🪓', 
      name: 'Battle Axe', 
      width: 2, 
      height: 3, 
      type: 'weapon',
      rarity: 'uncommon',
      stats: '+70 Physical Damage\n-5% Attack Speed',
    },
    MACE: { 
      id: 'mace',
      icon: '🔨', 
      name: 'War Hammer', 
      width: 2, 
      height: 3, 
      type: 'weapon',
      rarity: 'rare',
      stats: '+80 Physical Damage\n+10 Strength',
    },
    BOW: { 
      id: 'bow',
      icon: '🏹', 
      name: 'Longbow', 
      width: 2, 
      height: 3, 
      type: 'weapon',
      rarity: 'uncommon',
      stats: '+50 Physical Damage\n+15 Dexterity',
    },
  };

  // Tooltip component
  const Tooltip = ({ item, position }) => {
    if (!item) return null;
    
    return (
      <div
        className="tooltip"
        style={{ top: position.y, left: position.x }}
      >
        <div className={`font-bold ${RARITY_COLORS[item.rarity]}`}>{item.name}</div>
        <div className="mt-1 text-xs whitespace-pre-wrap">{item.stats}</div>
        {item.stackable && (
          <div className="mt-1 text-xs text-gray-400">
            Stackable (Max: {item.maxStack})
          </div>
        )}
      </div>
    );
  };

  // Single inventory slot component
  const InventorySlot = ({
    slotId,
    isEquipSlot,
    label,
    isOccupied,
    isDraggingOver,
    onDragOver,
    onDrop,
  }) => {
    return (
      <div
        id={slotId}
        className={`
          ${isEquipSlot ? 'border border-gray-600' : 'border border-gray-800'} 
          ${isOccupied ? 'occupied' : 'bg-gray-900/50'} 
          ${isDraggingOver ? 'ring-2 ring-blue-400' : ''}
          relative grid-background item-outline hover:bg-gray-800/40 transition-colors
        `}
        style={{
          width: `${SLOT_SIZE}rem`,
          height: `${SLOT_SIZE}rem`,
        }}
        onDragOver={(e) => onDragOver(e, slotId)}
        onDrop={(e) => onDrop(e, slotId)}
      >
        {label && (
          <span className="absolute -top-5 left-0 text-xs text-gray-400">
            {label}
          </span>
        )}
      </div>
    );
  };

  // Item component (overlaid on slots)
  const Item = ({
    item,
    slotId,
    onDragStart,
    onDragEnd,
    onMouseEnter,
    onMouseLeave,
    onRotate,
  }) => {
    if (!item) return null;
    
    return (
      <div
        className={`item ${RARITY_COLORS[item.rarity]}`}
        draggable
        onDragStart={(e) => onDragStart(e, slotId)}
        onDragEnd={onDragEnd}
        onMouseEnter={(e) => onMouseEnter(e, item)}
        onMouseLeave={onMouseLeave}
      >
        <div className="text-2xl mb-1">{item.icon}</div>
        <div className="text-xs text-center px-1">{item.name}</div>
        {item.stackable && item.count > 1 && (
          <div className="absolute bottom-0 right-1 text-xs bg-gray-900/80 px-1 rounded">
            {item.count}
          </div>
        )}
        {item.width !== item.height && (
          <button
            className="absolute top-0 right-0 text-xs bg-gray-800/70 px-1 rounded"
            onClick={(e) => {
              e.stopPropagation();
              onRotate(slotId);
            }}
          >
            🔄
          </button>
        )}
      </div>
    );
  };

  // Character silhouette
  const CharacterSilhouette = () => (
    <svg
      className="absolute inset-0 w-full h-full opacity-20 pointer-events-none"
      viewBox="0 0 100 200"
    >
      <path
        d="M50 10 C60 10, 65 15, 65 25 C65 35, 60 40, 50 40 C40 40, 35 35, 35 25 C35 15, 40 10, 50 10"
        fill="currentColor"
      />
      <path d="M45 40 L55 40 L60 90 L40 90 Z" fill="currentColor" />
      <path d="M60 50 L75 80 L65 85 L55 60" fill="currentColor" />
      <path d="M40 50 L25 80 L35 85 L45 60" fill="currentColor" />
      <path d="M45 90 L40 130 L45 130 L50 100 L55 130 L60 130 L55 90" fill="currentColor" />
    </svg>
  );

  // Main InventoryGrid component
  const InventoryGrid = () => {
    // Equipment slots state
    const [equipped, setEquipped] = useState(() => {
      const savedEquipped = localStorage.getItem('equipped');
      return savedEquipped ? JSON.parse(savedEquipped) : {
        ring1: null,
        ring2: null,
        amulet: null,
        helm: null,
        armor: null,
        gloves: null,
        boots: null,
        belt: null,
        weapon: null,
        offhand: null,
      };
    });

    // Create an inventory item object with its grid position
    const createInventoryItem = (item, position) => {
      if (!item) return null;
      return {
        ...item,
        position,
      };
    };

    // Initialize backpack items with their positions
    const initializeBackpack = () => {
      const initialItems = [
        createInventoryItem({ ...ITEMS.POTION, count: 5 }, { x: 0, y: 0 }),
        createInventoryItem(ITEMS.DAGGER, { x: 1, y: 0 }),
        createInventoryItem(ITEMS.RING, { x: 2, y: 0 }),
        createInventoryItem(ITEMS.AMULET, { x: 3, y: 0 }),
        createInventoryItem(ITEMS.SWORD, { x: 0, y: 1 }),
        createInventoryItem(ITEMS.SHIELD, { x: 2, y: 1 }),
        createInventoryItem(ITEMS.CHEST, { x: 4, y: 0 }),
        createInventoryItem(ITEMS.BOOTS, { x: 6, y: 0 }),
        createInventoryItem(ITEMS.STAFF, { x: 0, y: 3 }),
        createInventoryItem(ITEMS.BELT, { x: 2, y: 3 }),
        createInventoryItem(ITEMS.AXE, { x: 4, y: 3 }),
        createInventoryItem(ITEMS.BOOK, { x: 6, y: 3 }),
      ];
      
      return initialItems;
    };

    // Backpack items state
    const [backpackItems, setBackpackItems] = useState(() => {
      const savedBackpack = localStorage.getItem('backpackItems');
      return savedBackpack ? JSON.parse(savedBackpack) : initializeBackpack();
    });

    // Dragging state
    const [draggedItem, setDraggedItem] = useState(null);
    const [draggedFromSlot, setDraggedFromSlot] = useState(null);
    const [isDraggingOver, setIsDraggingOver] = useState(null);
    
    // Tooltip state
    const [tooltipItem, setTooltipItem] = useState(null);
    const [tooltipPosition, setTooltipPosition] = useState({ x: 0, y: 0 });

    // Save to local storage when state changes
    useEffect(() => {
      localStorage.setItem('equipped', JSON.stringify(equipped));
    }, [equipped]);

    useEffect(() => {
      localStorage.setItem('backpackItems', JSON.stringify(backpackItems));
    }, [backpackItems]);

    // Get row and column from slot ID
    const getCoordinatesFromSlotId = (slotId) => {
      if (slotId.startsWith('backpack_')) {
        const [_, coords] = slotId.split('backpack_');
        const [x, y] = coords.split('_').map(Number);
        return { x, y };
      }
      return null;
    };

    // Convert grid coordinates to slot ID
    const getSlotIdFromCoordinates = (x, y) => {
      return `backpack_${x}_${y}`;
    };

    // Create a map of occupied grid slots
    const createOccupationMap = () => {
      const occupationMap = {};
      
      // Mark slots occupied by items
      backpackItems.forEach(item => {
        if (!item) return;
        
        const { position, width, height } = item;
        
        for (let y = position.y; y < position.y + height; y++) {
          for (let x = position.x; x < position.x + width; x++) {
            occupationMap[getSlotIdFromCoordinates(x, y)] = item;
          }
        }
      });
      
      return occupationMap;
    };

    // Get item at slot coordinates
    const getItemAtCoordinates = (x, y) => {
      return backpackItems.find(item => {
        if (!item) return false;
        
        const { position, width, height } = item;
        
        return (
          x >= position.x && 
          x < position.x + width && 
          y >= position.y && 
          y < position.y + height
        );
      });
    };

    // Check if a space is available for an item
    const isSpaceAvailable = (item, targetX, targetY, occupationMap) => {
      // Don't check if item is null
      if (!item) return true;
      
      // Check if the target position is within bounds
      if (
        targetX < 0 || 
        targetY < 0 || 
        targetX + item.width > GRID_COLS
      ) {
        return false;
      }
      
      // Check if all required slots are empty or occupied by the same item
      for (let y = targetY; y < targetY + item.height; y++) {
        for (let x = targetX; x < targetX + item.width; x++) {
          const slotId = getSlotIdFromCoordinates(x, y);
          const occupyingItem = occupationMap[slotId];
          
          // If slot is occupied by a different item
          if (occupyingItem && occupyingItem !== draggedItem) {
            return false;
          }
        }
      }
      
      return true;
    };

    // Handle drag start
    const handleDragStart = (e, slotId) => {
      let item;
      
      if (slotId.startsWith('equip_')) {
        const slotType = slotId.split('_')[1];
        item = equipped[slotType];
      } else if (slotId.startsWith('backpack_')) {
        const coords = getCoordinatesFromSlotId(slotId);
        item = getItemAtCoordinates(coords.x, coords.y);
      }
      
      if (!item) {
        e.preventDefault();
        return;
      }
      
      setDraggedItem(item);
      setDraggedFromSlot(slotId);
      
      // Required for Firefox
      e.dataTransfer?.setData('text/plain', '');
    };

    // Handle drag over
    const handleDragOver = (e, slotId) => {
      e.preventDefault();
      
      if (!draggedItem) return;
      
      let canDrop = false;
      
      if (slotId.startsWith('equip_')) {
        const slotType = slotId.split('_')[1];
        canDrop = isValidEquipTarget(draggedItem, slotType);
      } else if (slotId.startsWith('backpack_')) {
        const coords = getCoordinatesFromSlotId(slotId);
        
        // Create a map of occupied slots
        const occupationMap = createOccupationMap();
        
        // Check if there's space for the item
        canDrop = isSpaceAvailable(draggedItem, coords.x, coords.y, occupationMap);
      }
      
      if (canDrop) {
        setIsDraggingOver(slotId);
      } else {
        setIsDraggingOver(null);
      }
    };

    // Handle drag end
    const handleDragEnd = () => {
      setDraggedItem(null);
      setDraggedFromSlot(null);
      setIsDraggingOver(null);
    };

    // Handle item drop
    const handleDrop = (e, targetSlotId) => {
      e.preventDefault();
      setIsDraggingOver(null);
      
      if (!draggedItem || draggedFromSlot === targetSlotId) {
        handleDragEnd();
        return;
      }
      
      // Handle equipment slots
      if (targetSlotId.startsWith('equip_')) {
        const slotType = targetSlotId.split('_')[1];
        
        // Check if item can be equipped
        if (!isValidEquipTarget(draggedItem, slotType)) {
          alert(`Cannot equip ${draggedItem.name} in this slot!`);
          handleDragEnd();
          return;
        }
        
        // Handle the swap
        const previousEquipped = equipped[slotType];
        
        // Update equipment slot
        setEquipped(prev => ({
          ...prev,
          [slotType]: { ...draggedItem, position: null }
        }));
        
        // If dragged from equipment, clear source slot
        if (draggedFromSlot.startsWith('equip_')) {
          const sourceSlotType = draggedFromSlot.split('_')[1];
          setEquipped(prev => ({
            ...prev,
            [sourceSlotType]: null
          }));
        } 
        // If dragged from backpack, remove from backpack
        else if (draggedFromSlot.startsWith('backpack_')) {
          setBackpackItems(prev => 
            prev.filter(item => item !== draggedItem)
          );
        }
        
        // If there was an item in the equipment slot, add it to backpack
        if (previousEquipped) {
          // Find first available position
          const position = findFirstAvailablePosition(previousEquipped);
          
          if (position) {
            setBackpackItems(prev => [
              ...prev, 
              { ...previousEquipped, position }
            ]);
          } else {
            alert("Not enough space in inventory!");
            // Revert the swap
            handleDragEnd();
            return;
          }
        }
      } 
      // Handle backpack slots
      else if (targetSlotId.startsWith('backpack_')) {
        const coords = getCoordinatesFromSlotId(targetSlotId);
        
        // Create a map of occupied slots
        const occupationMap = createOccupationMap();
        
        // Check if there's space for the item
        if (!isSpaceAvailable(draggedItem, coords.x, coords.y, occupationMap)) {
          handleDragEnd();
          return;
        }
        
        // Handle stacking for similar items
        const targetItem = getItemAtCoordinates(coords.x, coords.y);
        
        if (
          draggedItem.stackable && 
          targetItem && 
          targetItem.id === draggedItem.id && 
          targetItem !== draggedItem &&
          targetItem.stackable
        ) {
          // Stack items
          const totalCount = (targetItem.count || 1) + (draggedItem.count || 1);
          
          if (totalCount <= draggedItem.maxStack) {
            // Complete stack merge
            setBackpackItems(prev => {
              return prev.map(item => 
                item === targetItem 
                  ? { ...item, count: totalCount }
                  : item
              ).filter(item => item !== draggedItem);
            });
            
            // If dragged from equipment, clear source slot
            if (draggedFromSlot.startsWith('equip_')) {
              const sourceSlotType = draggedFromSlot.split('_')[1];
              setEquipped(prev => ({
                ...prev,
                [sourceSlotType]: null
              }));
            }
          } else {
            // Partial stack merge
            const remainder = totalCount - draggedItem.maxStack;
            
            setBackpackItems(prev => {
              return prev.map(item => {
                if (item === targetItem) {
                  return { ...item, count: draggedItem.maxStack };
                }
                if (item === draggedItem) {
                  return { ...item, count: remainder };
                }
                return item;
              });
            });
          }
        } else {
          // Move item to new position
          
          // If dragged from equipment, add to backpack
          if (draggedFromSlot.startsWith('equip_')) {
            const sourceSlotType = draggedFromSlot.split('_')[1];
            
            setEquipped(prev => ({
              ...prev,
              [sourceSlotType]: null
            }));
            
            setBackpackItems(prev => [
              ...prev, 
              { ...draggedItem, position: { x: coords.x, y: coords.y } }
            ]);
          } 
          // If dragged from backpack, update position
          else if (draggedFromSlot.startsWith('backpack_')) {
            setBackpackItems(prev => {
              return prev.map(item => 
                item === draggedItem 
                  ? { ...item, position: { x: coords.x, y: coords.y } }
                  : item
              );
            });
          }
        }
      }
      
      handleDragEnd();
    };

    // Check if item can be equipped in target slot
    const isValidEquipTarget = (item, slotType) => {
      if (!item) return false;
      
      const slotTypeMap = {
        ring1: ['ring'],
        ring2: ['ring'],
        amulet: ['amulet'],
        helm: ['helm'],
        armor: ['armor'],
        gloves: ['gloves'],
        boots: ['boots'],
        belt: ['belt'],
        weapon: ['weapon'],
        offhand: ['offhand', 'shield'],
      };
      
      return slotTypeMap[slotType]?.includes(item.type);
    };

    // Find first available position for item in backpack
    const findFirstAvailablePosition = (item) => {
      if (!item) return null;
      
      const occupationMap = createOccupationMap();
      
      for (let y = 0; y < Math.ceil(INVENTORY_SIZE / GRID_COLS); y++) {
        for (let x = 0; x < GRID_COLS; x++) {
          if (isSpaceAvailable(item, x, y, occupationMap)) {
            return { x, y };
          }
        }
      }
      
      return null;
    };

    // Rotate item (swap width and height)
    const rotateItem = (slotId) => {
      const coords = getCoordinatesFromSlotId(slotId);
      const item = getItemAtCoordinates(coords.x, coords.y);
      
      if (!item) return;
      
      // Create a copy of the item with swapped dimensions
      const rotatedItem = {
        ...item,
        width: item.height,
        height: item.width
      };
      
      // Check if the rotated item fits at its current position
      const occupationMap = createOccupationMap();
      
      // Remove the item from the occupation map to avoid self-collision
      for (let y = item.position.y; y < item.position.y + item.height; y++) {
        for (let x = item.position.x; x < item.position.x + item.width; x++) {
          const slotId = getSlotIdFromCoordinates(x, y);
          if (occupationMap[slotId] === item) {
            delete occupationMap[slotId];
          }
        }
      }
      
      if (isSpaceAvailable(rotatedItem, item.position.x, item.position.y, occupationMap)) {
        setBackpackItems(prev => 
          prev.map(i => i === item ? rotatedItem : i)
        );
      } else {
        alert("Not enough space to rotate item!");
      }
    };

    // Handle tooltip mouse enter
    const handleMouseEnter = (e, item) => {
      if (!item) return;
      
      const rect = e.target.getBoundingClientRect();
      setTooltipPosition({ x: rect.right + 10, y: rect.top });
      setTooltipItem(item);
    };

    // Handle tooltip mouse leave
    const handleMouseLeave = () => {
      setTooltipItem(null);
    };
    
    // Render equipment slots
    const renderEquipmentSlots = () => {
      const equipmentLayout = [
        { slot: 'helm', label: 'Helm', colStart: 3, rowStart: 1, width: 1, height: 1 },
        { slot: 'amulet', label: 'Amulet', colStart: 4, rowStart: 1, width: 1, height: 1 },
        { slot: 'weapon', label: 'Weapon', colStart: 1, rowStart: 2, width: 1, height: 2 },
        { slot: 'armor', label: 'Armor', colStart: 3, rowStart: 2, width: 1, height: 2 },
        { slot: 'offhand', label: 'Offhand', colStart: 5, rowStart: 2, width: 1, height: 2 },
        { slot: 'gloves', label: 'Gloves', colStart: 1, rowStart: 4, width: 1, height: 1 },
        { slot: 'belt', label: 'Belt', colStart: 3, rowStart: 4, width: 1, height: 1 },
        { slot: 'ring1', label: 'Ring', colStart: 5, rowStart: 4, width: 1, height: 1 },
        { slot: 'boots', label: 'Boots', colStart: 3, rowStart: 5, width: 1, height: 1 },
        { slot: 'ring2', label: 'Ring', colStart: 5, rowStart: 5, width: 1, height: 1 },
      ];

      return (
        <div className="grid" style={{ 
          display: 'grid', 
          gridTemplateColumns: 'repeat(5, minmax(0, 1fr))', 
          gridTemplateRows: 'repeat(5, minmax(0, 1fr))',
          gap: '0.5rem',
          position: 'relative'
        }}>
          {equipmentLayout.map(({ slot, label, colStart, rowStart }) => {
            const item = equipped[slot];
            return (
              <div 
                key={slot} 
                className="relative"
                style={{ 
                  gridColumn: `${colStart} / span 1`, 
                  gridRow: `${rowStart} / span 1` 
                }}
              >
                <InventorySlot
                  slotId={`equip_${slot}`}
                  isEquipSlot={true}
                  label={label}
                  isOccupied={!!item}
                  isDraggingOver={isDraggingOver === `equip_${slot}`}
                  onDragOver={handleDragOver}
                  onDrop={handleDrop}
                />
                {item && (
                  <Item
                    item={item}
                    slotId={`equip_${slot}`}
                    onDragStart={handleDragStart}
                    onDragEnd={handleDragEnd}
                    onMouseEnter={handleMouseEnter}
                    onMouseLeave={handleMouseLeave}
                    onRotate={() => {}}
                  />
                )}
              </div>
            );
          })}
        </div>
      );
    };

    // Create empty backpack grid
    const renderBackpackGrid = () => {
      const occupationMap = createOccupationMap();
      const rows = Math.ceil(INVENTORY_SIZE / GRID_COLS);
      const grid = [];
      
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < GRID_COLS; x++) {
          const slotId = getSlotIdFromCoordinates(x, y);
          const isOccupied = !!occupationMap[slotId];
          
          grid.push(
            <InventorySlot
              key={slotId}
              slotId={slotId}
              isEquipSlot={false}
              isOccupied={isOccupied}
              isDraggingOver={isDraggingOver === slotId}
              onDragOver={handleDragOver}
              onDrop={handleDrop}
            />
          );
        }
      }
      
      return grid;
    };

    // Render inventory items
    const renderBackpackItems = () => {
      return backpackItems.map((item, index) => {
        if (!item || !item.position) return null;
        
        const { x, y, width, height } = item;
        const slotId = getSlotIdFromCoordinates(item.position.x, item.position.y);
        
        return (
          <div
            key={`item-${index}`}
            className={`absolute ${item.width !== item.height ? 'bg-gray-700/30' : ''}`}
            style={{
              left: `calc(${item.position.x} * ${SLOT_SIZE}rem)`,
              top: `calc(${item.position.y} * ${SLOT_SIZE}rem)`,
              width: `calc(${item.width} * ${SLOT_SIZE}rem)`,
              height: `calc(${item.height} * ${SLOT_SIZE}rem)`,
              zIndex: 5
            }}
          >
            <Item
              item={item}
              slotId={slotId}
              onDragStart={handleDragStart}
              onDragEnd={handleDragEnd}
              onMouseEnter={handleMouseEnter}
              onMouseLeave={handleMouseLeave}
              onRotate={rotateItem}
            />
          </div>
        );
      });
    };
    
    return (
      <div className="max-w-4xl mx-auto p-4 bg-gray-800 text-white rounded-lg">
        <h2 className="text-xl font-bold mb-6">Advanced ARPG Inventory System</h2>

        {/* Character Equipment */}
        <div className="relative bg-gray-900/30 p-6 rounded-lg mb-4">
          <CharacterSilhouette />
          {renderEquipmentSlots()}
        </div>

        {/* Backpack */}
        <div className="bg-gray-900/30 p-4 rounded">
          <h3 className="text-lg font-semibold mb-2">Backpack</h3>
          <div 
            className="inventory-grid relative grid-background"
            style={{ 
              display: 'grid',
              gridTemplateColumns: `repeat(${GRID_COLS}, ${SLOT_SIZE}rem)`,
              gridAutoRows: `${SLOT_SIZE}rem`,
              gap: '1px',
              maxHeight: '400px',
              overflowY: 'auto',
              position: 'relative'
            }}
          >
            {renderBackpackGrid()}
            {renderBackpackItems()}
          </div>
        </div>

        {/* Actions */}
        <div className="mt-4 flex space-x-2">
          <button 
            className="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded"
            onClick={() => {
              if (confirm("Reset inventory to default?")) {
                setBackpackItems(initializeBackpack());
                setEquipped({
                  ring1: null,
                  ring2: null,
                  amulet: null,
                  helm: null,
                  armor: null,
                  gloves: null,
                  boots: null,
                  belt: null,
                  weapon: null,
                  offhand: null,
                });
              }
            }}
          >
            Reset Inventory
          </button>
        </div>

        {/* Tooltip */}
        {tooltipItem && (
          <Tooltip item={tooltipItem} position={tooltipPosition} />
        )}
      </div>
    );
  };

  ReactDOM.render(<InventoryGrid />, document.getElementById('root'));
</script>
</body>
</html>

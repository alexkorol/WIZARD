<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ARPG Inventory System</title>
<!-- Include Tailwind CSS via CDN -->
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<!-- Include React and ReactDOM via CDN -->
<script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
<!-- Include Babel for JSX transformation -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  /* Custom scrollbar styling */
  .inventory-grid::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  .inventory-grid::-webkit-scrollbar-thumb {
    background-color: rgba(55, 65, 81, 0.8);
    border-radius: 4px;
  }
  .tooltip {
    position: absolute;
    z-index: 50;
    width: 12rem;
    padding: 0.5rem;
    background-color: #1f2937;
    border: 1px solid #374151;
    border-radius: 0.25rem;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    pointer-events: none;
  }
</style>
</head>
<body class="bg-gray-900 text-white">

<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect } = React;

  // Define rarity colors
  const RARITY_COLORS = {
    common: 'text-gray-200 border-gray-600',
    uncommon: 'text-green-400 border-green-700',
    rare: 'text-blue-400 border-blue-700',
    epic: 'text-purple-400 border-purple-700',
    legendary: 'text-yellow-400 border-yellow-700',
  };

  // Define items
  const ITEMS = {
    POTION: { 
      icon: '🧪', 
      name: 'Health Potion', 
      width: 1, 
      height: 1, 
      type: 'consumable',
      rarity: 'common',
      stats: 'Restores 100 HP',
      stackable: true,
      maxStack: 20,
      count: 1,
    },
    SWORD: { 
      icon: '⚔️', 
      name: 'Ancient Broadsword', 
      width: 1, 
      height: 3, 
      type: 'weapon',
      rarity: 'rare',
      stats: '+45 Physical Damage\n+10% Attack Speed',
    },
    SHIELD: { 
      icon: '🛡️', 
      name: 'Tower Shield', 
      width: 2, 
      height: 2, 
      type: 'shield',
      rarity: 'uncommon',
      stats: '+30 Armor\n+5% Block Chance',
    },
    CHEST: { 
      icon: '🎽', 
      name: 'Plate Mail', 
      width: 2, 
      height: 3, 
      type: 'armor',
      rarity: 'rare',
      stats: '+150 Armor\n+20 Vitality',
    },
    HELM: { 
      icon: '⛑️', 
      name: 'War Helm', 
      width: 2, 
      height: 2, 
      type: 'helm',
      rarity: 'uncommon',
      stats: '+50 Armor\n+10 Strength',
    },
    BOOTS: { 
      icon: '👢', 
      name: 'Steel Boots', 
      width: 2, 
      height: 2, 
      type: 'boots',
      rarity: 'common',
      stats: '+40 Armor\n+5% Movement Speed',
    },
    GLOVES: { 
      icon: '🧤', 
      name: 'Leather Gloves', 
      width: 2, 
      height: 2, 
      type: 'gloves',
      rarity: 'common',
      stats: '+30 Armor\n+5 Dexterity',
    },
    RING: { 
      icon: '💍', 
      name: 'Magic Ring', 
      width: 1, 
      height: 1, 
      type: 'ring',
      rarity: 'epic',
      stats: '+15% Magic Find\n+10 Intelligence',
    },
    AMULET: { 
      icon: '📿', 
      name: 'Ancient Amulet', 
      width: 1, 
      height: 1, 
      type: 'amulet',
      rarity: 'epic',
      stats: '+20% Experience Gain\n+15 All Attributes',
    },
    BELT: { 
      icon: '🎗️', 
      name: 'Warrior Belt', 
      width: 2, 
      height: 1, 
      type: 'belt',
      rarity: 'uncommon',
      stats: '+50 Armor\n+10% Potion Effectiveness',
    },
    STAFF: { 
      icon: '🏑', 
      name: 'Magic Staff', 
      width: 2, 
      height: 4, 
      type: 'weapon',
      rarity: 'rare',
      stats: '+60 Magic Damage\n+15% Spell Casting Speed',
    },
    BOOK: { 
      icon: '📕', 
      name: 'Spell Tome', 
      width: 2, 
      height: 2, 
      type: 'offhand',
      rarity: 'rare',
      stats: '+25 Intelligence\n+10% Mana Regeneration',
    },
  };

  // Tooltip component
  const Tooltip = ({ item, position }) => {
    return (
      <div
        className="tooltip"
        style={{ top: position.y, left: position.x }}
      >
        <div className={`font-bold ${RARITY_COLORS[item.rarity]}`}>{item.name}</div>
        <div className="mt-1 text-xs whitespace-pre-wrap">{item.stats}</div>
        {item.stackable && (
          <div className="mt-1 text-xs text-gray-400">
            Stackable (Max: {item.maxStack})
          </div>
        )}
      </div>
    );
  };

  // InventorySlot component
  const InventorySlot = ({
    width = 1,
    height = 1,
    item = null,
    label = '',
    isEquipSlot = false,
    slotId,
    onDropItem,
    onDragStart,
    onDragOver,
    onDragEnd,
    onMouseEnter,
    onMouseLeave,
    isDraggingOver,
  }) => {
    return (
      <div
        className={`relative border ${
          isEquipSlot ? 'border-gray-600' : 'border-gray-800'
        } 
        ${item ? 'bg-gray-700/50' : 'bg-gray-900/50'}
        ${isDraggingOver ? 'ring-2 ring-blue-400' : ''}
        hover:bg-gray-800/50 transition-colors`}
        style={{
          gridColumn: `span ${width}`,
          gridRow: `span ${height}`,
          minHeight: `${height * 2.5}rem`,
        }}
        onDragOver={(e) => onDragOver(e, slotId)}
        onDrop={(e) => onDropItem(e, slotId)}
        onMouseEnter={onMouseEnter}
        onMouseLeave={onMouseLeave}
      >
        {label && (
          <span className="absolute -top-5 left-0 text-xs text-gray-400">
            {label}
          </span>
        )}
        {item && (
          <div
            className="absolute inset-0 flex flex-col items-center justify-center cursor-move"
            draggable
            onDragStart={(e) => onDragStart(e, slotId)}
            onDragEnd={onDragEnd}
          >
            <div className={`text-2xl mb-1 ${RARITY_COLORS[item.rarity]}`}>
              {item.icon}
            </div>
            <div className="text-xs text-center px-1">{item.name}</div>
            {item.stackable && item.count > 1 && (
              <div className="absolute bottom-0 right-1 text-xs bg-gray-900/80 px-1 rounded">
                {item.count}
              </div>
            )}
          </div>
        )}
      </div>
    );
  };

  // Character silhouette
  const CharacterSilhouette = () => (
    <svg
      className="absolute inset-0 w-full h-full opacity-20 pointer-events-none"
      viewBox="0 0 100 200"
    >
      <path
        d="M50 10 C60 10, 65 15, 65 25 C65 35, 60 40, 50 40 C40 40, 35 35, 35 25 C35 15, 40 10, 50 10"
        fill="currentColor"
      />
      <path d="M45 40 L55 40 L60 90 L40 90 Z" fill="currentColor" />
      <path d="M60 50 L75 80 L65 85 L55 60" fill="currentColor" />
      <path d="M40 50 L25 80 L35 85 L45 60" fill="currentColor" />
      <path d="M45 90 L40 130 L45 130 L50 100 L55 130 L60 130 L55 90" fill="currentColor" />
    </svg>
  );

  // Main InventoryGrid component
  const InventoryGrid = () => {
    const [equipped, setEquipped] = useState({
      ring1: null,
      ring2: null,
      amulet: null,
      helm: null,
      armor: null,
      gloves: null,
      boots: null,
      belt: null,
      weapon: null,
      offhand: null,
    });

    const initialBackpack = Array(72).fill(null);
    initialBackpack[0] = { ...ITEMS.POTION, count: 5 };
    initialBackpack[12] = ITEMS.SWORD;
    initialBackpack[24] = ITEMS.SHIELD;
    initialBackpack[36] = ITEMS.STAFF;
    initialBackpack[48] = ITEMS.BOOK;
    initialBackpack[60] = { ...ITEMS.POTION, count: 15 };

    const [backpack, setBackpack] = useState(initialBackpack);
    const [draggedItem, setDraggedItem] = useState(null);
    const [draggedFromSlot, setDraggedFromSlot] = useState(null);
    const [isDraggingOver, setIsDraggingOver] = useState(null);
    const [tooltipItem, setTooltipItem] = useState(null);
    const [tooltipPosition, setTooltipPosition] = useState({ x: 0, y: 0 });

    // Get item in slot
    const getSlotContent = (slotId) => {
      if (slotId.startsWith('equip_')) {
        return equipped[slotId.split('_')[1]];
      } else {
        return backpack[parseInt(slotId.split('_')[1])];
      }
    };

    // Check if item can be equipped in target slot
    const isValidEquipTarget = (sourceItem, targetSlot) => {
      if (!sourceItem) return false;
      const slotType = targetSlot.split('_')[1];
      const slotTypeMap = {
        ring1: ['ring'],
        ring2: ['ring'],
        amulet: ['amulet'],
        helm: ['helm'],
        armor: ['armor'],
        gloves: ['gloves'],
        boots: ['boots'],
        belt: ['belt'],
        weapon: ['weapon'],
        offhand: ['offhand', 'shield'],
      };
      return slotTypeMap[slotType]?.includes(sourceItem.type);
    };

    // Handle drag start
    const handleDragStart = (e, slotId) => {
      const item = getSlotContent(slotId);
      if (!item) {
        e.preventDefault();
        return;
      }
      setDraggedItem(item);
      setDraggedFromSlot(slotId);
      e.dataTransfer.effectAllowed = 'move';
    };

    // Handle drag over
    const handleDragOver = (e, slotId) => {
      e.preventDefault();
      setIsDraggingOver(slotId);
    };

    // Handle drag end
    const handleDragEnd = () => {
      setDraggedItem(null);
      setDraggedFromSlot(null);
      setIsDraggingOver(null);
    };

    // Handle drop
    const handleDrop = (e, targetSlotId) => {
      e.preventDefault();
      setIsDraggingOver(null);

      if (!draggedItem || draggedFromSlot === targetSlotId) return;

      const sourceItem = draggedItem;
      const targetItem = getSlotContent(targetSlotId);

      // Handle equipment slots
      if (targetSlotId.startsWith('equip_')) {
        if (!isValidEquipTarget(sourceItem, targetSlotId)) {
          alert(`Cannot equip ${sourceItem.name} in this slot!`);
          return;
        }
      }

      // Handle stacking
      if (
        sourceItem.stackable &&
        targetItem?.name === sourceItem.name &&
        targetItem.stackable
      ) {
        // Stack items
        const totalCount = (targetItem.count || 1) + (sourceItem.count || 1);
        if (totalCount <= sourceItem.maxStack) {
          moveItem(draggedFromSlot, targetSlotId, null, {
            ...sourceItem,
            count: totalCount,
          });
        } else {
          // If exceeding max stack, fill to max and leave remainder in source
          const remaining = totalCount - sourceItem.maxStack;
          moveItem(
            draggedFromSlot,
            targetSlotId,
            { ...sourceItem, count: remaining },
            { ...sourceItem, count: sourceItem.maxStack }
          );
        }
      } else {
        // Swap items
        moveItem(draggedFromSlot, targetSlotId, targetItem, sourceItem);
      }

      handleDragEnd();
    };

    // Move item between slots
    const moveItem = (sourceSlotId, targetSlotId, sourceItem, targetItem = null) => {
      // Remove item from source slot
      if (sourceSlotId.startsWith('equip_')) {
        const sourceSlotType = sourceSlotId.split('_')[1];
        setEquipped((prev) => ({ ...prev, [sourceSlotType]: sourceItem }));
      } else {
        const sourceIndex = parseInt(sourceSlotId.split('_')[1]);
        setBackpack((prev) => {
          const newBackpack = [...prev];
          newBackpack[sourceIndex] = sourceItem;
          return newBackpack;
        });
      }

      // Place item in target slot
      if (targetSlotId.startsWith('equip_')) {
        const targetSlotType = targetSlotId.split('_')[1];
        setEquipped((prev) => ({ ...prev, [targetSlotType]: targetItem }));
      } else {
        const targetIndex = parseInt(targetSlotId.split('_')[1]);
        setBackpack((prev) => {
          const newBackpack = [...prev];
          newBackpack[targetIndex] = targetItem;
          return newBackpack;
        });
      }
    };

    // Render equipment slots
    const renderEquipmentSlots = () => {
      const equipmentLayout = [
        { slot: 'helm', label: 'Helm', colStart: 3, rowStart: 1, width: 2, height: 2 },
        { slot: 'amulet', label: 'Amulet', colStart: 5, rowStart: 1, width: 1, height: 1 },
        { slot: 'weapon', label: 'Weapon', colStart: 1, rowStart: 2, width: 2, height: 3 },
        { slot: 'armor', label: 'Armor', colStart: 3, rowStart: 2, width: 2, height: 3 },
        { slot: 'offhand', label: 'Offhand', colStart: 5, rowStart: 2, width: 2, height: 3 },
        { slot: 'gloves', label: 'Gloves', colStart: 1, rowStart: 5, width: 2, height: 2 },
        { slot: 'belt', label: 'Belt', colStart: 3, rowStart: 5, width: 2, height: 1 },
        { slot: 'ring1', label: 'Ring', colStart: 5, rowStart: 5, width: 1, height: 1 },
        { slot: 'boots', label: 'Boots', colStart: 3, rowStart: 6, width: 2, height: 2 },
        { slot: 'ring2', label: 'Ring', colStart: 5, rowStart: 6, width: 1, height: 1 },
      ];

      return equipmentLayout.map(({ slot, label, colStart, rowStart, width, height }) => (
        <div
          key={slot}
          style={{ gridColumnStart: colStart, gridRowStart: rowStart }}
        >
          <InventorySlot
            label={label}
            width={width}
            height={height}
            item={equipped[slot]}
            isEquipSlot={true}
            slotId={`equip_${slot}`}
            onDropItem={handleDrop}
            onDragStart={handleDragStart}
            onDragOver={handleDragOver}
            onDragEnd={handleDragEnd}
            onMouseEnter={(e) => handleMouseEnter(e, equipped[slot])}
            onMouseLeave={handleMouseLeave}
            isDraggingOver={isDraggingOver === `equip_${slot}`}
          />
        </div>
      ));
    };

    // Handle tooltip mouse enter
    const handleMouseEnter = (e, item) => {
      if (!item) return;
      const rect = e.target.getBoundingClientRect();
      setTooltipPosition({ x: rect.right + 10, y: rect.top });
      setTooltipItem(item);
    };

    // Handle tooltip mouse leave
    const handleMouseLeave = () => {
      setTooltipItem(null);
    };

    return (
      <div className="max-w-4xl mx-auto p-4 bg-gray-800 text-white rounded-lg">
        <h2 className="text-xl font-bold mb-6">Character Inventory</h2>

        {/* Character Equipment */}
        <div className="relative bg-gray-900/30 p-6 rounded-lg mb-4">
          <CharacterSilhouette />

          <div className="grid grid-cols-6 grid-rows-8 gap-2 relative z-10">
            {renderEquipmentSlots()}
          </div>
        </div>

        {/* Backpack */}
        <div className="bg-gray-900/30 p-2 rounded">
          <h3 className="text-lg font-semibold mb-2 px-2">Backpack</h3>
          <div
            className="grid grid-cols-12 gap-1 inventory-grid"
            style={{ maxHeight: '400px', overflowY: 'auto' }}
          >
            {backpack.map((item, index) => (
              <InventorySlot
                key={index}
                item={item}
                width={item?.width || 1}
                height={item?.height || 1}
                slotId={`backpack_${index}`}
                onDropItem={handleDrop}
                onDragStart={handleDragStart}
                onDragOver={handleDragOver}
                onDragEnd={handleDragEnd}
                onMouseEnter={(e) => handleMouseEnter(e, item)}
                onMouseLeave={handleMouseLeave}
                isDraggingOver={isDraggingOver === `backpack_${index}`}
              />
            ))}
          </div>
        </div>

        {/* Tooltip */}
        {tooltipItem && (
          <Tooltip item={tooltipItem} position={tooltipPosition} />
        )}
      </div>
    );
  };

  ReactDOM.render(<InventoryGrid />, document.getElementById('root'));
</script>
</body>
</html>

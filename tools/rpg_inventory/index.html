<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG Inventory Overhaul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #0c0f17;
      --panel: #111827;
      --panel-2: #0e1421;
      --accent: #f7c266;
      --accent-2: #7c3aed;
      --grid: #1f2937;
      --slot: 64px;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #253044;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, rgba(124, 58, 237, 0.08), transparent 30%),
                  radial-gradient(circle at 80% 0%, rgba(247, 194, 102, 0.12), transparent 25%),
                  linear-gradient(180deg, #0a0e17 0%, #05070d 100%);
      color: var(--text);
      font-family: 'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif;
      letter-spacing: 0.01em;
      padding: 32px 20px 56px;
    }

    .app {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }

    .title {
      margin: 0;
      font-family: 'Cinzel', serif;
      letter-spacing: 2px;
      font-size: clamp(24px, 4vw, 34px);
      text-transform: uppercase;
    }

    .lede {
      margin: 4px 0 0;
      color: var(--muted);
      max-width: 720px;
      line-height: 1.5;
    }

    .badge {
      background: rgba(247, 194, 102, 0.1);
      border: 1px solid rgba(247, 194, 102, 0.4);
      color: var(--accent);
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 600;
      letter-spacing: 0.6px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
    }

    .card {
      background: linear-gradient(160deg, var(--panel) 0%, var(--panel-2) 100%);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 18px 38px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      position: relative;
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .equipment-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, var(--slot));
      gap: 10px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      overflow: hidden;
    }

    .silhouette {
      position: absolute;
      inset: 6px;
      opacity: 0.08;
      pointer-events: none;
      fill: var(--text);
    }

    .slot {
      width: var(--slot);
      height: var(--slot);
      border-radius: 10px;
      border: 1px dashed rgba(255, 255, 255, 0.08);
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.03), rgba(17, 24, 39, 0.8));
      position: relative;
      display: grid;
      place-items: center;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
      color: var(--muted);
    }

    .slot.equip {
      border-style: solid;
      border-color: rgba(124, 58, 237, 0.4);
    }

    .slot:hover {
      border-color: rgba(247, 194, 102, 0.5);
      box-shadow: 0 0 0 1px rgba(247, 194, 102, 0.2);
    }

    .slot.drag-over {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(247, 194, 102, 0.45);
      transform: translateY(-2px);
    }

    .slot-label {
      position: absolute;
      top: -18px;
      left: 0;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.3px;
    }

    .inventory-shell {
      display: grid;
      gap: 12px;
    }

    .grid-wrapper {
      position: relative;
      border-radius: 14px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, rgba(255, 255, 255, 0.01) 100%);
    }

    .inventory-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(8, var(--slot));
      grid-auto-rows: var(--slot);
      gap: 6px;
      padding: 6px;
      background: repeating-linear-gradient(
        0deg,
        rgba(255, 255, 255, 0.02),
        rgba(255, 255, 255, 0.02) 1px,
        transparent 1px,
        transparent calc(var(--slot))
      ),
      repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.02),
        rgba(255, 255, 255, 0.02) 1px,
        transparent 1px,
        transparent calc(var(--slot))
      );
      min-height: calc(var(--slot) * 9);
    }

    .item {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      padding: 8px 8px 10px;
      display: grid;
      align-content: start;
      gap: 6px;
      cursor: grab;
      user-select: none;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.01));
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      transition: transform 0.12s, box-shadow 0.12s;
    }

    .item:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
    }

    .item-name {
      font-weight: 600;
      font-size: 12px;
      line-height: 1.3;
    }

    .item-icon {
      font-size: 20px;
      line-height: 1;
    }

    .stack-badge {
      position: absolute;
      bottom: 6px;
      right: 8px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 600;
    }

    .rotate-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      font-size: 11px;
      border-radius: 6px;
      padding: 4px 6px;
      cursor: pointer;
    }

    .rarity-common { border-color: rgba(148, 163, 184, 0.4); }
    .rarity-uncommon { border-color: rgba(52, 211, 153, 0.5); box-shadow: 0 12px 22px rgba(52, 211, 153, 0.12); }
    .rarity-rare { border-color: rgba(96, 165, 250, 0.55); box-shadow: 0 12px 22px rgba(96, 165, 250, 0.16); }
    .rarity-epic { border-color: rgba(167, 139, 250, 0.7); box-shadow: 0 12px 22px rgba(167, 139, 250, 0.22); }
    .rarity-legendary { border-color: rgba(251, 191, 36, 0.8); box-shadow: 0 12px 22px rgba(251, 191, 36, 0.28); }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.4px;
      transition: transform 0.1s, box-shadow 0.1s, border-color 0.1s;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: rgba(247, 194, 102, 0.5);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
    }

    .btn.secondary {
      background: rgba(255, 255, 255, 0.03);
    }

    .legend {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .tooltip {
      position: fixed;
      background: #0b0f18;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 12px;
      min-width: 180px;
      max-width: 260px;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      z-index: 100;
      font-size: 13px;
    }

    .tooltip .name {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .tooltip .stat {
      color: var(--muted);
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .status {
      position: fixed;
      bottom: 14px;
      right: 20px;
      background: rgba(247, 194, 102, 0.14);
      color: var(--accent);
      border: 1px solid rgba(247, 194, 102, 0.5);
      padding: 10px 12px;
      border-radius: 10px;
      font-weight: 600;
      letter-spacing: 0.3px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    @media (max-width: 1080px) {
      .layout {
        grid-template-columns: 1fr;
      }
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      .equipment-grid {
        grid-template-columns: repeat(5, var(--slot));
        justify-content: center;
      }
    }

    @media (max-width: 720px) {
      :root { --slot: 56px; }
      body { padding: 24px 14px 42px; }
      .inventory-grid { grid-template-columns: repeat(6, var(--slot)); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    const GRID_COLS = 8;
    const GRID_ROWS = 9;
    const STORAGE_KEY = 'rpg_inventory_overhaul_v1';

    const SLOT_RULES = {
      helm: ['helm'],
      amulet: ['amulet'],
      weapon: ['weapon'],
      armor: ['armor'],
      offhand: ['shield', 'offhand'],
      gloves: ['gloves'],
      belt: ['belt'],
      ring1: ['ring'],
      ring2: ['ring'],
      boots: ['boots'],
    };

    const RARITY_CLASS = {
      common: 'rarity-common',
      uncommon: 'rarity-uncommon',
      rare: 'rarity-rare',
      epic: 'rarity-epic',
      legendary: 'rarity-legendary',
    };

    const ITEM_LIBRARY = {
      potion: { id: 'potion', icon: '🧪', name: 'Healing Potion', width: 1, height: 1, type: 'consumable', rarity: 'common', stats: 'Restores 100 HP', stackable: true, maxStack: 20, count: 1 },
      mana: { id: 'mana', icon: '🔮', name: 'Mana Flask', width: 1, height: 1, type: 'consumable', rarity: 'common', stats: 'Restores 60 Mana', stackable: true, maxStack: 20, count: 1 },
      sword: { id: 'sword', icon: '⚔️', name: 'Ancient Broadsword', width: 1, height: 2, type: 'weapon', rarity: 'rare', stats: '+45 Physical Damage\n+10% Attack Speed' },
      shield: { id: 'shield', icon: '🛡️', name: 'Tower Shield', width: 2, height: 2, type: 'shield', rarity: 'uncommon', stats: '+30 Armor\n+5% Block Chance' },
      chest: { id: 'chest', icon: '🎽', name: 'Plate Mail', width: 2, height: 2, type: 'armor', rarity: 'rare', stats: '+150 Armor\n+20 Vitality' },
      helm: { id: 'helm', icon: '⛑️', name: 'War Helm', width: 2, height: 2, type: 'helm', rarity: 'uncommon', stats: '+50 Armor\n+10 Strength' },
      boots: { id: 'boots', icon: '👢', name: 'Steel Boots', width: 2, height: 1, type: 'boots', rarity: 'common', stats: '+40 Armor\n+5% Movement Speed' },
      gloves: { id: 'gloves', icon: '🧤', name: 'Leather Gloves', width: 2, height: 1, type: 'gloves', rarity: 'common', stats: '+30 Armor\n+5 Dexterity' },
      ring: { id: 'ring', icon: '💍', name: 'Magic Ring', width: 1, height: 1, type: 'ring', rarity: 'epic', stats: '+15% Magic Find\n+10 Intelligence' },
      amulet: { id: 'amulet', icon: '📿', name: 'Ancient Amulet', width: 1, height: 1, type: 'amulet', rarity: 'epic', stats: '+20% Experience Gain\n+15 All Attributes' },
      belt: { id: 'belt', icon: '🎗️', name: 'Warrior Belt', width: 2, height: 1, type: 'belt', rarity: 'uncommon', stats: '+50 Armor\n+10% Potion Effectiveness' },
      staff: { id: 'staff', icon: '🏑', name: 'Mage Staff', width: 1, height: 3, type: 'weapon', rarity: 'rare', stats: '+60 Magic Damage\n+15% Spell Speed' },
      book: { id: 'book', icon: '📕', name: 'Spell Tome', width: 2, height: 2, type: 'offhand', rarity: 'rare', stats: '+25 Intelligence\n+10% Mana Regen' },
      dagger: { id: 'dagger', icon: '🗡️', name: 'Shadow Dagger', width: 1, height: 1, type: 'weapon', rarity: 'rare', stats: '+30 Physical Damage\n+20% Crit Chance' },
      axe: { id: 'axe', icon: '🪓', name: 'Battle Axe', width: 2, height: 3, type: 'weapon', rarity: 'uncommon', stats: '+70 Physical Damage\n-5% Attack Speed' },
      mace: { id: 'mace', icon: '🔨', name: 'War Hammer', width: 2, height: 3, type: 'weapon', rarity: 'rare', stats: '+80 Physical Damage\n+10 Strength' },
      bow: { id: 'bow', icon: '🏹', name: 'Longbow', width: 2, height: 3, type: 'weapon', rarity: 'uncommon', stats: '+50 Physical Damage\n+15 Dexterity' },
    };

    const emptyEquipped = {
      ring1: null,
      ring2: null,
      amulet: null,
      helm: null,
      armor: null,
      gloves: null,
      boots: null,
      belt: null,
      weapon: null,
      offhand: null,
    };

    const makeItem = (base, overrides = {}) => ({
      ...base,
      uid: `${base.id}-${Math.random().toString(16).slice(2)}`,
      count: base.stackable ? overrides.count || base.count || 1 : 1,
      position: overrides.position || null,
      width: overrides.width || base.width,
      height: overrides.height || base.height,
    });

    const defaultBackpack = () => ([
      makeItem(ITEM_LIBRARY.potion, { count: 6, position: { x: 0, y: 0 } }),
      makeItem(ITEM_LIBRARY.potion, { count: 5, position: { x: 1, y: 0 } }),
      makeItem(ITEM_LIBRARY.dagger, { position: { x: 2, y: 0 } }),
      makeItem(ITEM_LIBRARY.ring, { position: { x: 3, y: 0 } }),
      makeItem(ITEM_LIBRARY.amulet, { position: { x: 4, y: 0 } }),
      makeItem(ITEM_LIBRARY.sword, { position: { x: 0, y: 1 } }),
      makeItem(ITEM_LIBRARY.shield, { position: { x: 2, y: 1 } }),
      makeItem(ITEM_LIBRARY.chest, { position: { x: 4, y: 1 } }),
      makeItem(ITEM_LIBRARY.boots, { position: { x: 6, y: 1 } }),
      makeItem(ITEM_LIBRARY.staff, { position: { x: 0, y: 3 } }),
      makeItem(ITEM_LIBRARY.belt, { position: { x: 2, y: 3 } }),
      makeItem(ITEM_LIBRARY.axe, { position: { x: 4, y: 3 } }),
      makeItem(ITEM_LIBRARY.book, { position: { x: 6, y: 3 } }),
      makeItem(ITEM_LIBRARY.mana, { count: 8, position: { x: 0, y: 6 } }),
    ]);

    const loadState = () => {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && saved.backpack && saved.equipped) {
          return saved;
        }
      } catch (e) {}
      return { backpack: defaultBackpack(), equipped: { ...emptyEquipped } };
    };

    const saveState = (state) => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    };

    const buildOccupation = (backpack, ignoreUid = null) => {
      const occ = new Map();
      backpack.forEach((item) => {
        if (!item.position) return;
        if (ignoreUid && item.uid === ignoreUid) return;
        for (let y = item.position.y; y < item.position.y + item.height; y++) {
          for (let x = item.position.x; x < item.position.x + item.width; x++) {
            occ.set(`${x}-${y}`, item.uid);
          }
        }
      });
      return occ;
    };

    const isWithinBounds = (item, position) => (
      position.x >= 0 &&
      position.y >= 0 &&
      position.x + item.width <= GRID_COLS &&
      position.y + item.height <= GRID_ROWS
    );

    const canPlace = (backpack, item, position, ignoreUid = null) => {
      if (!isWithinBounds(item, position)) return false;
      const occ = buildOccupation(backpack, ignoreUid);
      for (let y = position.y; y < position.y + item.height; y++) {
        for (let x = position.x; x < position.x + item.width; x++) {
          if (occ.has(`${x}-${y}`)) return false;
        }
      }
      return true;
    };

    const findFirstFit = (backpack, item) => {
      for (let y = 0; y < GRID_ROWS; y++) {
        for (let x = 0; x < GRID_COLS; x++) {
          if (canPlace(backpack, item, { x, y })) {
            return { x, y };
          }
        }
      }
      return null;
    };

    const itemAt = (backpack, coords) => backpack.find((item) => {
      if (!item.position) return false;
      return coords.x >= item.position.x &&
             coords.x < item.position.x + item.width &&
             coords.y >= item.position.y &&
             coords.y < item.position.y + item.height;
    });

    const Tooltip = ({ item, position }) => {
      if (!item) return null;
      return (
        <div className="tooltip" style={{ top: position.y, left: position.x }}>
          <div className={`name ${RARITY_CLASS[item.rarity]}`}>{item.name}</div>
          <div className="stat">{item.stats}</div>
          {item.stackable && (
            <div className="stat" style={{ marginTop: 4 }}>
              Stackable · Max {item.maxStack}
            </div>
          )}
        </div>
      );
    };

    const Slot = ({ label, isEquip, onDrop, onDragOver, highlight }) => (
      <div
        className={`slot ${isEquip ? 'equip' : ''} ${highlight ? 'drag-over' : ''}`}
        onDragOver={(e) => onDragOver?.(e)}
        onDrop={(e) => onDrop?.(e)}
      >
        {label && <span className="slot-label">{label}</span>}
      </div>
    );

    const ItemTile = ({ item, onDragStart, onDragEnd, onRotate, onHover, showRotate }) => (
      <div
        className={`item ${RARITY_CLASS[item.rarity]}`}
        draggable
        onDragStart={(e) => onDragStart(e)}
        onDragEnd={onDragEnd}
        onMouseEnter={(e) => onHover?.(e, item)}
        onMouseLeave={() => onHover?.(null, null)}
      >
        <div className="item-icon">{item.icon}</div>
        <div className="item-name">{item.name}</div>
        {item.stackable && item.count > 1 && (
          <div className="stack-badge">x{item.count}</div>
        )}
        {showRotate && (
          <button className="rotate-btn" onClick={(e) => { e.stopPropagation(); onRotate?.(); }}>
            ↻
          </button>
        )}
      </div>
    );

    const App = () => {
      const [state, setState] = useState(loadState);
      const [drag, setDrag] = useState(null); // { source: 'bag'|'equip', uid, slotKey? }
      const [dragOver, setDragOver] = useState(null);
      const [hover, setHover] = useState({ item: null, pos: { x: 0, y: 0 } });
      const [status, setStatus] = useState('');

      useEffect(() => saveState(state), [state]);

      const occupation = useMemo(
        () => buildOccupation(state.backpack, drag?.source === 'bag' ? drag.uid : null),
        [state.backpack, drag]
      );

      const showStatus = (msg) => {
        setStatus(msg);
        setTimeout(() => setStatus(''), 1500);
      };

      const getDraggedItem = () => {
        if (!drag) return null;
        if (drag.source === 'bag') {
          return state.backpack.find((i) => i.uid === drag.uid);
        }
        return state.equipped[drag.slotKey];
      };

      const handleRotate = (uid) => {
        setState((prev) => {
          const item = prev.backpack.find((i) => i.uid === uid);
          if (!item || !item.position) return prev;
          const rotated = { ...item, width: item.height, height: item.width };
          if (!canPlace(prev.backpack, rotated, item.position, uid)) {
            showStatus('Rotation blocked: no room.');
            return prev;
          }
          return {
            ...prev,
            backpack: prev.backpack.map((i) => i.uid === uid ? rotated : i),
          };
        });
      };

      const handleDragStart = (source, uid, slotKey = null) => {
        setDrag({ source, uid, slotKey });
      };

      const handleDragEnd = () => {
        setDrag(null);
        setDragOver(null);
      };

      const handleEquipDrop = (slotKey) => {
        const draggedItem = getDraggedItem();
        if (!draggedItem) return;
        if (!SLOT_RULES[slotKey].includes(draggedItem.type)) {
          showStatus('Cannot equip there.');
          handleDragEnd();
          return;
        }

        setState((prev) => {
          const next = { ...prev, equipped: { ...prev.equipped } };
          let backpack = [...prev.backpack];

          if (drag.source === 'bag') {
            backpack = backpack.filter((i) => i.uid !== draggedItem.uid);
          } else if (drag.source === 'equip') {
            next.equipped[drag.slotKey] = null;
          }

          const displaced = next.equipped[slotKey];
          next.equipped[slotKey] = { ...draggedItem, position: null };

          if (displaced) {
            const position = findFirstFit(backpack, displaced);
            if (!position) {
              showStatus('No space to unequip the current item.');
              return prev;
            }
            backpack.push({ ...displaced, position });
          }

          next.backpack = backpack;
          return next;
        });

        handleDragEnd();
      };

      const mergeStacks = (target, incoming) => {
        if (!target.stackable || !incoming.stackable) return null;
        if (target.id !== incoming.id) return null;
        const combined = (target.count || 1) + (incoming.count || 1);
        if (combined > target.maxStack) return null;
        return { ...target, count: combined };
      };

      const handleBackpackDrop = (coords) => {
        const draggedItem = getDraggedItem();
        if (!draggedItem) return;

        setState((prev) => {
          let backpack = [...prev.backpack];
          const equipped = { ...prev.equipped };
          const ignoreUid = drag.source === 'bag' ? draggedItem.uid : null;

          const target = itemAt(backpack, coords);
          if (target) {
            const merged = mergeStacks(target, draggedItem);
            if (!merged) {
              showStatus('Slot occupied.');
              return prev;
            }
            backpack = backpack.map((i) => i.uid === target.uid ? merged : i);
            if (drag.source === 'bag') {
              backpack = backpack.filter((i) => i.uid !== draggedItem.uid || i.uid === target.uid);
            } else if (drag.source === 'equip') {
              equipped[drag.slotKey] = null;
            }
            return { backpack, equipped };
          }

          if (!canPlace(backpack, draggedItem, coords, ignoreUid)) {
            showStatus('Not enough room.');
            return prev;
          }

          if (drag.source === 'bag') {
            backpack = backpack.filter((i) => i.uid !== draggedItem.uid);
          } else if (drag.source === 'equip') {
            equipped[drag.slotKey] = null;
          }

          backpack.push({ ...draggedItem, position: coords });
          return { backpack, equipped };
        });

        handleDragEnd();
      };

      const resetInventory = () => {
        setState({ backpack: defaultBackpack(), equipped: { ...emptyEquipped } });
        setDrag(null);
        setDragOver(null);
        setStatus('');
      };

      const addRandomLoot = () => {
        const pool = Object.values(ITEM_LIBRARY);
        const candidate = makeItem(pool[Math.floor(Math.random() * pool.length)]);
        setState((prev) => {
          const position = findFirstFit(prev.backpack, candidate);
          if (!position) {
            showStatus('Backpack is full.');
            return prev;
          }
          candidate.position = position;
          return { ...prev, backpack: [...prev.backpack, candidate] };
        });
      };

      const equipmentLayout = [
        { key: 'helm', label: 'Helm', col: 2, row: 0 },
        { key: 'amulet', label: 'Amulet', col: 3, row: 0 },
        { key: 'weapon', label: 'Weapon', col: 0, row: 1 },
        { key: 'armor', label: 'Armor', col: 2, row: 1 },
        { key: 'offhand', label: 'Offhand', col: 4, row: 1 },
        { key: 'gloves', label: 'Gloves', col: 0, row: 3 },
        { key: 'belt', label: 'Belt', col: 2, row: 3 },
        { key: 'ring1', label: 'Ring', col: 4, row: 3 },
        { key: 'boots', label: 'Boots', col: 2, row: 4 },
        { key: 'ring2', label: 'Ring', col: 4, row: 4 },
      ];

      const rows = GRID_ROWS;
      const bagSlots = [];
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < GRID_COLS; x++) {
          const id = `${x}-${y}`;
          bagSlots.push(
            <div key={id} style={{ position: 'relative' }}>
              <Slot
                isEquip={false}
                highlight={dragOver === id}
                onDragOver={(e) => {
                  e.preventDefault();
                  setDragOver(id);
                }}
                onDrop={(e) => {
                  e.preventDefault();
                  handleBackpackDrop({ x, y });
                }}
              />
            </div>
          );
        }
      }

      const bagItems = state.backpack.map((item) => {
        if (!item.position) return null;
        const left = item.position.x * (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--slot'), 10) || 64 + 6);
        return (
          <div
            key={item.uid}
            style={{
              position: 'absolute',
              left: `calc(${item.position.x} * var(--slot) + ${item.position.x * 6}px)`,
              top: `calc(${item.position.y} * var(--slot) + ${item.position.y * 6}px)`,
              width: `calc(${item.width} * var(--slot) + ${(item.width - 1) * 6}px)`,
              height: `calc(${item.height} * var(--slot) + ${(item.height - 1) * 6}px)`,
            }}
          >
            <ItemTile
              item={item}
              showRotate={item.width !== item.height}
              onRotate={() => handleRotate(item.uid)}
              onDragStart={(e) => handleDragStart('bag', item.uid)}
              onDragEnd={handleDragEnd}
              onHover={(ev, hovered) => {
                if (!hovered) {
                  setHover({ item: null, pos: { x: 0, y: 0 } });
                  return;
                }
                const pos = ev.target.getBoundingClientRect();
                setHover({ item: hovered, pos: { x: pos.right + 10, y: pos.top } });
              }}
            />
          </div>
        );
      });

      return (
        <div className="app">
          <header>
            <div>
              <p className="badge">Drag + Drop • Stack • Rotate • Equip</p>
              <h1 className="title">RPG Inventory</h1>
              <p className="lede">A refreshed ARPG-inspired grid with clear slot rules, stacking, rotation checks, and quick-save persistence.</p>
            </div>
            <div className="controls">
              <button className="btn" onClick={addRandomLoot}>Add Random Loot</button>
              <button className="btn secondary" onClick={resetInventory}>Reset Inventory</button>
            </div>
          </header>

          <div className="layout">
            <div className="card">
              <h3>Equipment</h3>
              <div className="equipment-grid">
                <svg className="silhouette" viewBox="0 0 100 200">
                  <path d="M50 10 C60 10, 65 15, 65 25 C65 35, 60 40, 50 40 C40 40, 35 35, 35 25 C35 15, 40 10, 50 10" />
                  <path d="M45 40 L55 40 L60 90 L40 90 Z" />
                  <path d="M60 50 L75 80 L65 85 L55 60" />
                  <path d="M40 50 L25 80 L35 85 L45 60" />
                  <path d="M45 90 L40 130 L45 130 L50 100 L55 130 L60 130 L55 90" />
                </svg>
                {equipmentLayout.map(({ key, label, col, row }) => {
                  const item = state.equipped[key];
                  const highlight = dragOver === `equip-${key}`;
                  return (
                    <div
                      key={key}
                      style={{
                        gridColumn: col + 1,
                        gridRow: row + 1,
                        position: 'relative',
                      }}
                    >
                      <Slot
                        label={label}
                        isEquip
                        highlight={highlight}
                        onDragOver={(e) => { e.preventDefault(); setDragOver(`equip-${key}`); }}
                        onDrop={(e) => { e.preventDefault(); handleEquipDrop(key); }}
                      />
                      {item && (
                        <div style={{ position: 'absolute', inset: 0 }}>
                          <ItemTile
                            item={item}
                            onDragStart={() => handleDragStart('equip', item.uid, key)}
                            onDragEnd={handleDragEnd}
                            onHover={(ev, hovered) => {
                              const pos = ev.target.getBoundingClientRect();
                              setHover({ item: hovered, pos: { x: pos.right + 10, y: pos.top } });
                            }}
                          />
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="card inventory-shell">
              <div className="grid-wrapper">
                <h3>Backpack</h3>
                <div
                  className="inventory-grid"
                  onDragLeave={() => setDragOver(null)}
                >
                  {bagSlots}
                  {bagItems}
                </div>
              </div>
              <div className="legend">
                <div>• Drag items between backpack and equipment.</div>
                <div>• Hover to inspect stats, click ↻ to rotate long items.</div>
                <div>• Stacks merge when identical and under max capacity.</div>
              </div>
            </div>
          </div>

          <Tooltip item={hover.item} position={hover.pos} />
          {status && <div className="status">{status}</div>}
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>

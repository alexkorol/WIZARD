<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WIZARD: Artifact Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

  <style>
    :root {
      --bg-depth: #050507;
      --bg-panel: rgba(13, 17, 26, 0.85);
      --slot-bg: rgba(0, 0, 0, 0.3);
      --slot-border: rgba(255, 255, 255, 0.08);

      --rarity-common: #a3a3a3;
      --rarity-magic: #3b82f6;
      --rarity-rare: #eab308;
      --rarity-legendary: #f97316;
      --rarity-unique: #a855f7;

      --accent: #d4b483;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;

      --cell-size: 50px;
      --gap: 2px;
    }

    * { box-sizing: border-box; user-select: none; }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-depth);
      background-image:
        radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08), transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(234, 179, 8, 0.05), transparent 40%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 { font-family: 'Cinzel', serif; color: var(--accent); text-shadow: 0 0 15px rgba(212, 180, 131, 0.3); margin: 0; }
    .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; }

    .interface {
      display: flex;
      gap: 32px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      position: relative;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(10, var(--cell-size));
      grid-template-rows: repeat(6, var(--cell-size));
      gap: var(--gap);
      padding: 10px;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      border: 1px solid var(--slot-border);
      position: relative;
    }

    .grid-cell {
      width: var(--cell-size);
      height: var(--cell-size);
      background: var(--slot-bg);
      border: 1px solid var(--slot-border);
      border-radius: 4px;
      transition: background 0.2s;
    }

    .grid-cell.hover-valid { background: rgba(34, 197, 94, 0.15); border-color: rgba(34, 197, 94, 0.3); }
    .grid-cell.hover-invalid { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); }

    .item {
      position: absolute;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
      border: 1px solid;
      border-radius: 4px;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      overflow: hidden;
      transition: transform 0.1s, box-shadow 0.2s;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }

    .item:hover { filter: brightness(1.2); z-index: 20; }
    .item:active { cursor: grabbing; transform: scale(1.02); }
    .item svg { width: 60%; height: 60%; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }

    .item.common { border-color: var(--rarity-common); color: var(--rarity-common); }
    .item.magic { border-color: var(--rarity-magic); color: var(--rarity-magic); box-shadow: inset 0 0 15px rgba(59, 130, 246, 0.2); }
    .item.rare { border-color: var(--rarity-rare); color: var(--rarity-rare); box-shadow: inset 0 0 15px rgba(234, 179, 8, 0.2); }
    .item.legendary { border-color: var(--rarity-legendary); color: var(--rarity-legendary); box-shadow: inset 0 0 15px rgba(249, 115, 22, 0.3); }
    .item.unique { border-color: var(--rarity-unique); color: var(--rarity-unique); box-shadow: inset 0 0 20px rgba(168, 85, 247, 0.3); animation: pulse-border 3s infinite; }

    @keyframes pulse-border {
      0% { border-color: var(--rarity-unique); }
      50% { border-color: #d8b4fe; }
      100% { border-color: var(--rarity-unique); }
    }

    .doll-container {
      position: relative;
      width: 300px;
      height: 450px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" fill="%23ffffff05"><path d="M100,20 C120,20 130,40 130,60 L140,70 L130,120 L140,180 L110,280 L90,280 L60,180 L70,120 L60,70 L70,60 C70,40 80,20 100,20 Z" /></svg>') center no-repeat;
      background-size: contain;
    }

    .equip-slot {
      position: absolute;
      width: var(--cell-size);
      height: var(--cell-size);
      background: rgba(0,0,0,0.4);
      border: 1px dashed #444;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .equip-slot.large { height: calc(var(--cell-size) * 2 + var(--gap)); }
    .equip-slot.hover-valid { border-color: #4ade80; background: rgba(74, 222, 128, 0.1); }

    .slot-icon { opacity: 0.2; width: 50%; height: 50%; }

    .slot-head { top: 20px; left: 125px; }
    .slot-chest { top: 100px; left: 125px; height: calc(var(--cell-size) * 3 + var(--gap) * 2); width: calc(var(--cell-size) * 2); transform: translateX(-25%); }
    .slot-mainhand { top: 100px; left: 20px; width: calc(var(--cell-size) * 1.5); height: calc(var(--cell-size) * 3); }
    .slot-offhand { top: 100px; right: 20px; width: calc(var(--cell-size) * 1.5); height: calc(var(--cell-size) * 3); }
    .slot-legs { top: 280px; left: 125px; }
    .slot-feet { top: 350px; left: 125px; }
    .slot-hands { top: 200px; left: 10px; }
    .slot-amulet { top: 40px; left: 190px; width: 40px; height: 40px; }
    .slot-ring1 { top: 280px; left: 80px; width: 40px; height: 40px; }
    .slot-ring2 { top: 280px; left: 180px; width: 40px; height: 40px; }

    .tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      background: #0f1115;
      border: 1px solid #333;
      padding: 12px;
      min-width: 250px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border-radius: 4px;
      display: none;
    }
    .tooltip.visible { display: block; }

    .tt-header { font-family: 'Cinzel', serif; font-size: 1.1rem; margin-bottom: 4px; border-bottom: 1px solid #333; padding-bottom: 8px; }
    .tt-type { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 12px; }
    .tt-stat { display: flex; justify-content: space-between; color: #818cf8; font-size: 0.9rem; margin-bottom: 4px; font-family: 'JetBrains Mono', monospace; }
    .tt-stat.implicit { color: var(--text-main); margin-bottom: 8px; }
    .tt-req { color: #ef4444; font-size: 0.8rem; margin-top: 10px; }
    .tt-flavor { font-style: italic; color: #555; margin-top: 12px; font-size: 0.8rem; line-height: 1.4; }

    .tt-common { color: var(--text-main); border-color: var(--rarity-common); }
    .tt-magic { color: var(--rarity-magic); border-color: var(--rarity-magic); }
    .tt-rare { color: var(--rarity-rare); border-color: var(--rarity-rare); }
    .tt-legendary { color: var(--rarity-legendary); border-color: var(--rarity-legendary); }
    .tt-unique { color: var(--rarity-unique); border-color: var(--rarity-unique); }

    .controls { margin-top: 20px; display: flex; gap: 12px; }
    button {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-main);
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      transition: all 0.2s;
    }
    button:hover { background: var(--accent); color: #000; border-color: var(--accent); }

    .instructions {
      position: absolute;
      bottom: -40px;
      left: 0;
      width: 100%;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    kbd { background: #333; padding: 2px 6px; border-radius: 4px; border: 1px solid #555; }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  const playSound = (type) => {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    const now = ctx.currentTime;

    if (type === 'pickup') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
    } else if (type === 'drop') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.15);
      osc.start(now);
      osc.stop(now + 0.15);
    } else if (type === 'error') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
    } else if (type === 'rotate') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, now);
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.05);
      osc.start(now);
      osc.stop(now + 0.05);
    }
  };

  const GRID_W = 10;
  const GRID_H = 6;
  const CELL_SIZE = 50;
  const GAP = 2;

  const ITEM_DB = {
    sword: { name: "Void Blade", w: 1, h: 3, type: 'mainhand', icon: 'path d="M10,10 L90,90 M20,80 L80,20"', rarity: 'rare', stats: {'Physical Dmg': '45-60', 'Attack Speed': '1.2'}, flavor: "Whispers of the void emanate from the steel." },
    shield: { name: "Aegis of Valor", w: 2, h: 2, type: 'offhand', icon: 'rect x="10" y="10" width="80" height="80" rx="10"', rarity: 'legendary', stats: {'Armor': '450', 'Block Chance': '32%'}, flavor: "Unbreakable." },
    potion: { name: "Elixir of Life", w: 1, h: 1, type: 'consumable', icon: 'circle cx="50" cy="50" r="30"', rarity: 'magic', stats: {'Heal': '500 HP'}, flavor: "Tastes like cherries." },
    bow: { name: "Windrunner", w: 2, h: 3, type: 'mainhand', icon: 'path d="M20,10 Q90,50 20,90 M20,10 L20,90"', rarity: 'unique', stats: {'Dexterity': '+50', 'Move Speed': '+10%'}, flavor: "Swift as the gale." },
    helm: { name: "Iron Casque", w: 2, h: 2, type: 'head', icon: 'path d="M10,50 Q50,0 90,50 L90,90 L10,90 Z"', rarity: 'common', stats: {'Armor': '120'}, flavor: "Standard issue." },
    chest: { name: "Astral Plate", w: 2, h: 3, type: 'chest', icon: 'rect x="10" y="10" width="80" height="80"', rarity: 'rare', stats: {'Armor': '800', 'Resist All': '+15%'}, flavor: "Forged in starlight." },
    ring: { name: "Signet", w: 1, h: 1, type: 'ring', icon: 'circle cx="50" cy="50" r="20" fill="none" stroke="currentColor" stroke-width="5"', rarity: 'unique', stats: {'Crit Dmg': '+25%'}, flavor: "Precious." },
  };

  const INITIAL_ITEMS = [
    { id: 'i1', dbId: 'sword', x: 0, y: 0, rotated: false },
    { id: 'i2', dbId: 'shield', x: 2, y: 0, rotated: false },
    { id: 'i3', dbId: 'potion', x: 5, y: 0, rotated: false },
    { id: 'i4', dbId: 'chest', x: 0, y: 3, rotated: false }
  ];

  const Tooltip = ({ item, position }) => {
    if (!item) return null;
    const db = ITEM_DB[item.dbId];
    const style = { top: position.y + 10, left: position.x + 10 };

    if (style.left + 250 > window.innerWidth) style.left -= 270;
    if (style.top + 200 > window.innerHeight) style.top -= 200;

    return (
      <div className={`tooltip visible tt-${db.rarity}`} style={style}>
        <div className="tt-header">{db.name}</div>
        <div className="tt-type">{db.rarity} {db.type}</div>
        {Object.entries(db.stats).map(([k, v]) => (
          <div key={k} className="tt-stat"><span>{k}</span><span>{v}</span></div>
        ))}
        {db.flavor && <div className="tt-flavor">"{db.flavor}"</div>}
      </div>
    );
  };

  const EquipmentSlot = ({ slot, type, item, onDrop, className }) => {
    const handleDragOver = (e) => {
      e.preventDefault();
      if (window.draggedItem) {
        const db = ITEM_DB[window.draggedItem.dbId];
        if ((db.type === type || (type === 'ring' && db.type === 'ring')) && !window.draggedItem.rotated) {
           e.target.closest('.equip-slot').classList.add('hover-valid');
        }
      }
    };

    const handleLeave = (e) => {
      e.target.closest('.equip-slot').classList.remove('hover-valid');
    };

    const handleDrop = (e) => {
      e.preventDefault();
      e.target.closest('.equip-slot').classList.remove('hover-valid');
      onDrop(slot);
    };

    return (
      <div
        className={`equip-slot ${className || ''}`}
        onDragOver={handleDragOver}
        onDragLeave={handleLeave}
        onDrop={handleDrop}
      >
        {!item && <svg className="slot-icon" viewBox="0 0 100 100">
          <path d="M20,20 L80,80 M80,20 L20,80" stroke="#fff" strokeWidth="2" />
        </svg>}
        {item && <InventoryItem item={item} isEquipped={true} />}
      </div>
    );
  };

  const InventoryItem = ({ item, isEquipped }) => {
    const db = ITEM_DB[item.dbId];
    const w = item.rotated ? db.h : db.w;
    const h = item.rotated ? db.w : db.h;

    const style = {
      width: `calc(${w * CELL_SIZE + (w-1)*GAP}px)`,
      height: `calc(${h * CELL_SIZE + (h-1)*GAP}px)`,
      left: !isEquipped ? `calc(${item.x * CELL_SIZE + item.x * GAP}px)` : undefined,
      top: !isEquipped ? `calc(${item.y * CELL_SIZE + item.y * GAP}px)` : undefined,
      position: !isEquipped ? 'absolute' : 'relative',
    };

    const handleDragStart = (e) => {
      window.draggedItem = item;
      const ghost = e.target.cloneNode(true);
      ghost.style.opacity = '0.5';
      document.body.appendChild(ghost);
      e.dataTransfer.setDragImage(ghost, 25, 25);
      setTimeout(() => document.body.removeChild(ghost), 0);
      playSound('pickup');
    };

    const renderIcon = () => {
      if (db.icon.startsWith('path') || db.icon.startsWith('rect') || db.icon.startsWith('circle')) {
        return <svg viewBox="0 0 100 100" stroke="currentColor" strokeWidth="4" fill="none" dangerouslySetInnerHTML={{__html: db.icon}} />;
      }
      return null;
    };

    return (
      <div
        className={`item ${db.rarity}`}
        style={style}
        draggable="true"
        onDragStart={handleDragStart}
        data-id={item.id}
      >
        {renderIcon()}
      </div>
    );
  };

  const App = () => {
    const [inventory, setInventory] = useState(INITIAL_ITEMS);
    const [equipped, setEquipped] = useState({});
    const [tooltip, setTooltip] = useState(null);
    const gridRef = useRef(null);

    const checkCollision = (x, y, w, h, excludeId = null) => {
      if (x < 0 || y < 0 || x + w > GRID_W || y + h > GRID_H) return true;
      return inventory.some(i => {
        if (i.id === excludeId) return false;
        const iw = i.rotated ? ITEM_DB[i.dbId].h : ITEM_DB[i.dbId].w;
        const ih = i.rotated ? ITEM_DB[i.dbId].w : ITEM_DB[i.dbId].h;
        return (x < i.x + iw && x + w > i.x && y < i.y + ih && y + h > i.y);
      });
    };

    const findFreeSpace = (dbId) => {
      const db = ITEM_DB[dbId];
      const w = db.w;
      const h = db.h;
      for (let y = 0; y <= GRID_H - h; y++) {
        for (let x = 0; x <= GRID_W - w; x++) {
          if (!checkCollision(x, y, w, h)) return { x, y, rotated: false };
        }
      }
      for (let y = 0; y <= GRID_H - w; y++) {
        for (let x = 0; x <= GRID_W - h; x++) {
          if (!checkCollision(x, y, h, w)) return { x, y, rotated: true };
        }
      }
      return null;
    };

    const handleGridDrop = (e) => {
      e.preventDefault();
      const dragged = window.draggedItem;
      if (!dragged) return;

      const rect = gridRef.current.getBoundingClientRect();
      const offsetX = e.clientX - rect.left;
      const offsetY = e.clientY - rect.top;

      const cellX = Math.floor(offsetX / (CELL_SIZE + GAP));
      const cellY = Math.floor(offsetY / (CELL_SIZE + GAP));

      const db = ITEM_DB[dragged.dbId];
      const w = dragged.rotated ? db.h : db.w;
      const h = dragged.rotated ? db.w : db.h;

      const finalX = Math.min(Math.max(0, cellX), GRID_W - w);
      const finalY = Math.min(Math.max(0, cellY), GRID_H - h);

      if (!checkCollision(finalX, finalY, w, h, dragged.id)) {
        playSound('drop');
        const newEquipped = { ...equipped };
        Object.keys(newEquipped).forEach(k => {
          if (newEquipped[k] && newEquipped[k].id === dragged.id) delete newEquipped[k];
        });
        setEquipped(newEquipped);

        const newInv = inventory.filter(i => i.id !== dragged.id);
        newInv.push({ ...dragged, x: finalX, y: finalY });
        setInventory(newInv);
      } else {
        playSound('error');
      }
      window.draggedItem = null;
    };

    const handleGridDragOver = (e) => {
      e.preventDefault();
    };

    const handleEquipDrop = (slotName) => {
      const dragged = window.draggedItem;
      if (!dragged) return;
      const db = ITEM_DB[dragged.dbId];

      let valid = false;
      if (slotName === 'mainhand' && db.type === 'mainhand') valid = true;
      if (slotName === 'offhand' && (db.type === 'offhand' || db.type === 'shield')) valid = true;
      if (slotName === 'head' && db.type === 'head') valid = true;
      if (slotName === 'chest' && db.type === 'chest') valid = true;
      if ((slotName === 'ring1' || slotName === 'ring2') && db.type === 'ring') valid = true;
      if (slotName === 'consumable' && db.type === 'consumable') valid = true;

      if (valid) {
        playSound('drop');

        const existing = equipped[slotName];
        const newInv = inventory.filter(i => i.id !== dragged.id);

        if (existing) {
          const space = findFreeSpace(existing.dbId);
          if (space) {
            newInv.push({ ...existing, ...space });
          } else {
            playSound('error');
            return;
          }
        }

        setInventory(newInv);
        setEquipped({ ...equipped, [slotName]: { ...dragged, x: 0, y: 0, rotated: false } });
      } else {
        playSound('error');
      }
      window.draggedItem = null;
    };

    useEffect(() => {
      const handleKey = (e) => {
        if (e.key.toLowerCase() === 'r' && window.draggedItem) {
          playSound('rotate');
          window.draggedItem.rotated = !window.draggedItem.rotated;
        }
      };
      window.addEventListener('keydown', handleKey);
      return () => window.removeEventListener('keydown', handleKey);
    }, []);

    const handleMouseMove = (e) => {
      const target = e.target.closest('.item');
      if (target) {
        const id = target.dataset.id;
        let item = inventory.find(i => i.id === id);
        if (!item) item = Object.values(equipped).find(i => i && i.id === id);

        if (item) {
          setTooltip({ item, x: e.clientX, y: e.clientY });
          return;
        }
      }
      setTooltip(null);
    };

    const addLoot = () => {
      const keys = Object.keys(ITEM_DB);
      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      const space = findFreeSpace(randomKey);
      if (space) {
        const newItem =
          {
            id: `gen-${Date.now()}`,
            dbId: randomKey,
            x: space.x,
            y: space.y,
            rotated: space.rotated
          };
        setInventory([...inventory, newItem]);
        playSound('drop');
      } else {
        playSound('error');
        alert("Inventory Full!");
      }
    };

    return (
      <div className="app" onMouseMove={handleMouseMove}>
        <div style={{textAlign: 'center', marginBottom: '20px'}}>
          <h1>WIZARD: ARTIFACT VAULT</h1>
          <div className="subtitle">Drag & Drop Inventory System • Press 'R' to Rotate Items</div>
        </div>

        <div className="interface">
          <div className="panel">
            <div className="doll-container">
              <EquipmentSlot slot="head" type="head" className="slot-head" item={equipped.head} onDrop={handleEquipDrop} />
              <EquipmentSlot slot="chest" type="chest" className="slot-chest" item={equipped.chest} onDrop={handleEquipDrop} />
              <EquipmentSlot slot="mainhand" type="mainhand" className="slot-mainhand" item={equipped.mainhand} onDrop={handleEquipDrop} />
              <EquipmentSlot slot="offhand" type="offhand" className="slot-offhand" item={equipped.offhand} onDrop={handleEquipDrop} />
              <EquipmentSlot slot="legs" type="legs" className="slot-legs" item={equipped.legs} onDrop={handleEquipDrop} />
              <EquipmentSlot slot="feet" type="feet" className="slot-feet" item={equipped.feet} onDrop={handleEquipDrop} />
              <EquipmentSlot slot="hands" type="hands" className="slot-hands" item={equipped.hands} onDrop={handleEquipDrop} />
              <EquipmentSlot slot="amulet" type="amulet" className="slot-amulet" item={equipped.amulet} onDrop={handleEquipDrop} />
              <EquipmentSlot slot="ring1" type="ring" className="slot-ring1" item={equipped.ring1} onDrop={handleEquipDrop} />
              <EquipmentSlot slot="ring2" type="ring" className="slot-ring2" item={equipped.ring2} onDrop={handleEquipDrop} />
            </div>
          </div>

          <div className="panel">
            <div
              className="grid-container"
              ref={gridRef}
              onDrop={handleGridDrop}
              onDragOver={handleGridDragOver}
              style={{
                width: GRID_W * CELL_SIZE + (GRID_W + 1) * GAP + 20 + 'px',
                height: GRID_H * CELL_SIZE + (GRID_H + 1) * GAP + 20 + 'px'
              }}
            >
              {Array.from({ length: GRID_W * GRID_H }).map((_, i) => (
                <div key={i} className="grid-cell" />
              ))}

              {inventory.map(item => (
                <InventoryItem key={item.id} item={item} />
              ))}
            </div>
            <div className="instructions">
              <kbd>R</kbd> Rotate Item • <kbd>Drag</kbd> Move & Equip
            </div>
          </div>
        </div>

        <div className="controls">
          <button onClick={addLoot}>Generate Loot</button>
          <button onClick={() => { setInventory([]); setEquipped({}); playSound('error'); }}>Clear All</button>
        </div>

        {tooltip && <Tooltip item={tooltip.item} position={tooltip} />}
      </div>
    );
  };

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>

</body>
</html>

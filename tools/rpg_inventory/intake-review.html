<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Verdigris Intake Review</title>
<style>
  :root {
    --bg: #121417; --panel: #1c2026; --panel2: #252a32; --edge: #343b46;
    --ink: #ece8df; --dim: #a2a8b3; --ok: #8ac286; --warn: #e3b15d;
    --bad: #dd7474; --accent: #83c7d5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 10; display: flex; gap: 12px;
    align-items: center; padding: 12px 16px; background: var(--panel);
    border-bottom: 1px solid var(--edge); }
  h1 { margin: 0; font-size: 16px; font-weight: 650; }
  .stat { color: var(--dim); font-size: 12px; }
  .spacer { flex: 1; }
  button { color: var(--ink); background: var(--panel2); border: 1px solid var(--edge);
    border-radius: 7px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  main { padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; overflow: hidden; }
  .thumb { height: 260px; display: flex; align-items: center; justify-content: center;
    background-color: #30343a;
    background-image: linear-gradient(45deg, #3c4149 25%, transparent 25%),
      linear-gradient(-45deg, #3c4149 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #3c4149 75%),
      linear-gradient(-45deg, transparent 75%, #3c4149 75%);
    background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0; }
  .thumb img { max-width: 96%; max-height: 96%; filter: drop-shadow(0 4px 10px rgba(0,0,0,.45)); }
  .body { padding: 11px; display: grid; gap: 8px; }
  .line { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .name { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { color: #11161a; background: var(--accent); border-radius: 999px; padding: 1px 7px; font-size: 11px; }
  .pill.low { background: var(--bad); }
  .pill.medium { background: var(--warn); }
  label { display: block; color: var(--dim); font-size: 11px; margin-bottom: 2px; }
  input, textarea, select { width: 100%; color: var(--ink); background: var(--panel2);
    border: 1px solid var(--edge); border-radius: 6px; padding: 6px 7px; font: 12px/1.35 inherit; }
  textarea { min-height: 50px; resize: vertical; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .status { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .status button { padding: 5px 0; font-size: 12px; }
  .status button.on[data-status="accept"] { background: var(--ok); color: #101510; border-color: var(--ok); }
  .status button.on[data-status="rename"] { background: var(--warn); color: #15110a; border-color: var(--warn); }
  .status button.on[data-status="discard"] { background: var(--bad); color: #1a1010; border-color: var(--bad); }
  .status button.on[data-status="duplicate"] { background: var(--accent); color: #101418; border-color: var(--accent); }
  #exportPane { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.62); z-index: 20; }
  #exportPane .inner { width: min(900px, 92vw); max-height: 88vh; overflow: auto;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 14px; }
  #exportText { min-height: 360px; font-family: ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>
<header>
  <h1>Verdigris Intake Review</h1>
  <div class="stat"><span id="count">0</span> manual downloads, labels are provisional</div>
  <div class="spacer"></div>
  <button id="exportBtn">Export Corrections</button>
  <button id="resetBtn">Reset Local Edits</button>
</header>
<main id="grid"></main>

<div id="exportPane"><div class="inner">
  <div class="line"><b>Review export</b><div class="spacer"></div><button id="copyBtn">Copy</button><button id="closeBtn">Close</button></div>
  <p class="stat">Send this back after correcting labels. It includes your status, label, art id, slot, and notes.</p>
  <textarea id="exportText" readonly></textarea>
</div></div>

<script src="core/download-intake.js"></script>
<script>
const KEY = "verdigris_intake_review_v1";
const items = window.VerdigrisDownloadIntake || [];
let state = JSON.parse(localStorage.getItem(KEY) || "{}");

function rowState(item) {
  if (!state[item.file]) {
    state[item.file] = {
      status: "rename",
      label: item.proposedLabel,
      artId: item.proposedArtId,
      slot: item.slot,
      confidence: item.confidence,
      notes: item.note
    };
  }
  return state[item.file];
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
function field(label, html) { return `<div><label>${label}</label>${html}</div>`; }
function render() {
  document.getElementById("count").textContent = items.length;
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  items.forEach((item, idx) => {
    const s = rowState(item);
    const card = document.createElement("section");
    card.className = "card";
    card.innerHTML = `
      <div class="thumb"><img src="${item.file}" alt="${item.proposedLabel}"></div>
      <div class="body">
        <div class="line"><span class="name">${idx + 1}. ${item.proposedLabel}</span><span class="pill ${item.confidence}">${item.confidence}</span></div>
        <div class="stat">${item.file}<br>original: ${item.original}</div>
        <div class="status">
          ${["accept","rename","duplicate","discard"].map(st => `<button data-status="${st}" class="${s.status === st ? "on" : ""}">${st}</button>`).join("")}
        </div>
        ${field("Label", `<input data-k="label" value="${s.label.replace(/"/g, "&quot;")}">`)}
        <div class="cols">
          ${field("Art id", `<input data-k="artId" value="${s.artId.replace(/"/g, "&quot;")}">`)}
          ${field("Slot", `<input data-k="slot" value="${s.slot.replace(/"/g, "&quot;")}">`)}
        </div>
        ${field("Notes", `<textarea data-k="notes">${s.notes}</textarea>`)}
      </div>`;
    card.querySelectorAll("button[data-status]").forEach(btn => {
      btn.onclick = () => { s.status = btn.dataset.status; save(); render(); };
    });
    card.querySelectorAll("[data-k]").forEach(el => {
      el.oninput = () => { s[el.dataset.k] = el.value; save(); };
    });
    grid.appendChild(card);
  });
}
document.getElementById("exportBtn").onclick = () => {
  const out = items.map(item => ({ file: item.file, original: item.original, ...rowState(item) }));
  document.getElementById("exportText").value = JSON.stringify(out, null, 2);
  document.getElementById("exportPane").style.display = "flex";
};
document.getElementById("copyBtn").onclick = () => {
  const t = document.getElementById("exportText");
  t.select();
  document.execCommand("copy");
};
document.getElementById("closeBtn").onclick = () => document.getElementById("exportPane").style.display = "none";
document.getElementById("resetBtn").onclick = () => {
  if (confirm("Clear local intake label edits?")) {
    state = {};
    localStorage.removeItem(KEY);
    render();
  }
};
render();
</script>
</body>
</html>

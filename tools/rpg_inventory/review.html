<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Verdigris Asset Review</title>
<style>
  :root{
    --bg:#14161a; --panel:#1d2026; --panel2:#23272f; --edge:#333a44;
    --ink:#e8e6df; --dim:#9aa0ab; --accent:#7fd8c2; --warn:#e5b567; --bad:#e06b6b; --ok:#7fc97f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--edge);padding:12px 18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px}
  .stat{font-size:12px;color:var(--dim)}
  .stat b{color:var(--ink)}
  .spacer{flex:1}
  button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--edge);border-radius:7px;padding:6px 11px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.active{background:var(--accent);color:#0c0f12;border-color:var(--accent);font-weight:600}
  .filters{display:flex;gap:6px}
  main{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--edge);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .card.flag{border-color:var(--warn)}
  .card.discard{border-color:var(--bad);opacity:.76}
  .card.missing{border-color:var(--bad)}
  .thumb{height:200px;display:flex;align-items:center;justify-content:center;
    background-color:#8a8f98;
    background-image:linear-gradient(45deg,#7c828b 25%,transparent 25%),linear-gradient(-45deg,#7c828b 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#7c828b 75%),linear-gradient(-45deg,transparent 75%,#7c828b 75%);
    background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
  .thumb img{max-width:96%;max-height:96%;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
  .thumb .none{color:#2a2d33;font-weight:700;font-size:13px}
  .body{padding:11px 12px;display:flex;flex-direction:column;gap:9px}
  .row{display:flex;align-items:center;gap:8px}
  .name{font-weight:600;font-size:14px}
  .cv{font-size:10px;color:var(--dim);border:1px solid var(--edge);border-radius:4px;padding:1px 5px}
  .status{display:flex;gap:6px}
  .status button{flex:1;padding:5px 0;font-size:12px}
  .status button.ok.on{background:var(--ok);color:#0c0f12;border-color:var(--ok);font-weight:600}
  .status button.rw.on{background:var(--warn);color:#0c0f12;border-color:var(--warn);font-weight:600}
  .status button.ds.on{background:var(--bad);color:#120c0c;border-color:var(--bad);font-weight:600}
  .modes{display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-size:11px;padding:2px 7px;border:1px solid var(--edge);border-radius:20px;color:var(--dim);cursor:pointer;user-select:none}
  .chip.on{background:var(--bad);border-color:var(--bad);color:#120c0c;font-weight:600}
  label.fld{font-size:11px;color:var(--dim);display:block;margin-bottom:2px}
  textarea{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--edge);border-radius:6px;padding:6px 7px;font:12px/1.4 inherit;resize:vertical}
  textarea.desc{min-height:52px}
  textarea.notes{min-height:34px}
  .hidden{display:none}
  #exportPane{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:40}
  #exportPane .inner{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:18px;width:min(820px,92vw);max-height:88vh;overflow:auto}
  #exportPane textarea{min-height:320px;font-family:ui-monospace,Menlo,monospace}
  .modelegend{font-size:11px;color:var(--dim)}
  .summary{background:var(--panel2);border:1px solid var(--edge);border-radius:8px;padding:10px 12px;font-size:12px;margin:0 18px}
  .summary b{color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1>Verdigris Asset Review</h1>
  <div class="stat"><b id="cTotal">0</b> items · <b id="cFlag" style="color:var(--warn)">0</b> to rework · <b id="cDiscard" style="color:var(--bad)">0</b> discarded · <b id="cOk" style="color:var(--ok)">0</b> ok · <b id="cMiss" style="color:var(--bad)">0</b> missing art</div>
  <div class="spacer"></div>
  <div class="filters">
    <button data-f="all" class="active">All</button>
    <button data-f="flag">Flagged</button>
    <button data-f="discard">Discarded</button>
    <button data-f="ok">OK</button>
    <button data-f="untouched">Unreviewed</button>
  </div>
  <button id="btnExport">Export flags ▸</button>
  <button id="btnReset" title="Clear all your marks">Reset</button>
</header>
<div class="summary" id="summary"></div>
<main id="grid"></main>

<div id="exportPane"><div class="inner">
  <div class="row" style="margin-bottom:10px"><b style="font-size:15px">Flagged items export</b><div class="spacer"></div>
    <button id="btnCopy">Copy JSON</button><button id="btnClose">Close</button></div>
  <p class="modelegend">Paste this back to Claude to drive prompt reworks, regeneration, or retirement. Includes status, reworked DESC, failure modes, and notes for every item you marked "Rework" or "Discard".</p>
  <textarea id="exportText" readonly></textarea>
</div></div>

<script src="core/asset-review.js"></script>
<script>
const MODES = ["proportion","malformed","oversimplified","hard-shape","ambiguous-read","material-bleed","mask","style/wash"];
// name, canvas, desc, preflag(status|modes|suggestion)
const ITEMS = [
 ["handaxe_copper","P","a cast copper handaxe with a clean hammered blade on a leather-wrapped haft, held vertical"],
 ["handaxe_bronze","P","a cast bronze handaxe with a leather-wrapped haft, held vertical"],
 ["handaxe_obsidian","P","a handaxe of knapped black obsidian, glassy conchoidal facets, lashed to a short wooden haft with sinew, held vertical"],
 ["handaxe_skymetal","P","a handaxe with a dark iridescent meteoric-iron head, star-flecked, on a short wooden haft, held vertical"],
 ["spear_flint","P","a flint-tipped hunting spear on a long ash shaft with sinew lashing, the entire spear visible tip to butt, posed on a slight diagonal so the full length fits inside the frame"],
 ["spear_bone","P","a spear tipped with a barbed carved-bone point on a long ash shaft, sinew lashing, the entire spear visible tip to butt, posed on a slight diagonal so the full length fits inside the frame"],
 ["spear_copper","P","a copper-bladed spear on a long ash shaft, the entire spear visible tip to butt, posed on a slight diagonal so the full length fits inside the frame"],
 ["spear_bronze","P","a leaf-bladed bronze spear on a long ash shaft, the entire spear visible tip to butt, posed on a slight diagonal so the full length fits inside the frame"],
 ["spear_obsidian","P","a spear with a long saw-edged black obsidian head inlaid with tiny turquoise chips, faint cool teal glints in the glassy facets, dark hardwood shaft with a gold-leaf band at the socket, the entire spear visible tip to butt, posed on a slight diagonal so the full length fits inside the frame"],
 ["spear_skymetal","P","a spear with a dark iridescent meteoric-iron head, star-flecked and traced with faint cool teal veins, gold socket collar with a small carved bone skull fetish, the entire spear visible tip to butt, posed on a slight diagonal so the full length fits inside the frame"],
 ["macuahuitl_obsidian","P","an Aztec macuahuitl: flat hardwood club edged with rows of black obsidian blades, the wood plated with embossed gold panels and turquoise inlay dots, a small gold skull at the pommel, held vertical"],
 ["macuahuitl_flint","P","a macuahuitl: flat hardwood club edged with rows of knapped grey flint blades, grip whipped in rawhide, a red ochre handprint stamped on the wood, held vertical"],
 ["macuahuitl_bone","P","a macuahuitl: flat dark hardwood club edged with rows of polished bone shards, plain wood body, held vertical"],
 ["atlatl_bone","P","a carved bone atlatl dart-thrower incised with bird-flight tally marks, a black-and-teal fletched dart resting in its groove, vertical", "rework","hard-shape,oversimplified","a carved bone atlatl (spear-thrower): a long hooked throwing stick held vertical, a separate fletched dart laid alongside it, clear hook at the top end, incised bird-flight tally marks"],
 ["atlatl_copper","P","a copper-plated atlatl dart-thrower with a plain red cord grip, feathered dart in its groove, vertical","rework","hard-shape,oversimplified",""],
 ["atlatl_bronze","P","a bronze atlatl dart-thrower with a plain red cord grip, feathered dart in its groove, vertical","rework","hard-shape,oversimplified",""],
 ["khopesh_copper","P","a copper sickle-sword khopesh with a clean broad hooked blade and a dark leather-wrapped hilt, held vertical"],
 ["khopesh_bronze","P","a bronze khopesh with a bold broad sweeping hooked blade and a solid leather-wrapped hilt, held vertical"],
 ["khopesh_skymetal","P","a khopesh of raw dark meteoric iron, clean broad hooked blade, plain leather-wound hilt, held vertical"],
 ["sling_hide","P","a braided hide sling with a smooth river stone in the pouch, straps hanging vertical","rework","proportion,hard-shape","a braided hide sling laid out full length: two long thin cords meeting at a small central pouch cradling a smooth river stone"],
 ["sling_quilted","P","a sling of tightly braided undyed linen cords, the pouch quilted and smooth river stone seated in it, straps hanging vertical","rework","proportion,hard-shape",""],
 ["hideshield_bronze","P","a tall shield faced with clean hammered bronze, concentric raised rings around a plain domed central boss"],
 ["hideshield_bronzescale","P","a tall oval shield faced with overlapping gilded bronze scales on leather backing, a plain bronze domed boss at center"],
 ["hideshield_rivetmail","P","a tall shield reinforced with riveted iron strips over dark leather, impossibly advanced, dull grey gleam, edges bound in gold wire"],
 ["wrap_hide","P","a wrapped tunic of oxblood-dyed hide with cream fur-trimmed shoulder panels, clean simple garment shape"],
 ["wrap_quilted","P","a quilted linen armor vest of layered stitched cloth, undyed off-white with madder-red binding along the seams, cord tie at the shoulder"],
 ["wrap_bronzescale","P","a vest of overlapping gilded bronze scales sewn onto oxblood leather backing, clean raised collar plates"],
 ["wrap_rivetmail","P","a riveted mail hauberk laid out flat and spread like a garment, technology from beyond the horizon, collar bound in gold wire with one lapis bead"],
 ["crest_bone","S","a headpiece of carved bone and boar tusks with two short antler tines, crowned with a black horsehair crest, the tusks capped in copper"],
 ["crest_hide","S","a headpiece of stretched hide over a wicker frame with a russet horsehair crest, a row of small cowrie shells across the brow and one natural tan feather at the temple"],
 ["crest_copper","S","a hammered copper cap with cheek guards and a plain raised brow band"],
 ["crest_bronze","S","a hammered bronze cap with cheek guards and a short black feather plume at the crown"],
 ["crest_jade","S","a jade circlet-diadem carved with river motifs, faint cool inner glow, gold wire wrapping at the temples, a fan of glossy black-dyed feathers rising behind, two dangling jade drops"],
 ["grips_hide","S","a pair of hide handwraps with knuckle cords, a small bone bead knotted at each wrist","rework","ambiguous-read","a pair of hide hand-wraps for a person's hands (fingerless), knuckle cords and a small bone bead at each wrist, clearly hands not feet, laid flat side by side"],
 ["grips_quilted","S","a pair of quilted linen handwraps of layered stitched cloth, undyed off-white with red-stitched knuckle lines"],
 ["grips_bronzescale","S","a pair of handwraps armored with overlapping gilded bronze scales on oxblood leather"],
 ["sandals_hide","S","a pair of simple strapped hide sandals, clean and lightly used, shown as a pair"],
 ["sandals_quilted","S","a pair of strapped sandals of layered quilted linen, undyed off-white with red binding thread, small bronze ankle discs"],
 ["girdle_quilted","L","a wide girdle belt of layered quilted linen laid out horizontally, stitched in simple red chevrons, clean simple band"],
 ["girdle_copper","L","a wide belt of clean hammered copper plates on oxblood leather backing laid out horizontally"],
 ["gorget_jade","S","a carved jade gorget pendant on a knotted cord, smooth simple crescent shape","rework","proportion","a carved jade gorget pendant hung on a long knotted cord forming a full wearable neck-loop (cord much longer than the pendant), smooth simple crescent shape"],
 ["gorget_bone","S","a gorget pendant of carved bone on a knotted sinew cord, incised tally marks rubbed with red ochre","rework","proportion","a carved bone gorget pendant on a long sinew cord forming a full wearable neck-loop, incised tally marks rubbed with red ochre"],
 ["gorget_copper","S","a crescent gorget of clean hammered copper on a knotted cord","rework","proportion","a crescent hammered-copper gorget on a long cord forming a full wearable neck-loop, clean copper surface"],
 ["gorget_amber","S","a raw amber pendant with a trapped insect, on sinew cord","rework","proportion","a raw amber pendant with a trapped insect, hung on a long sinew cord forming a full wearable neck-loop (cord several times longer than the pendant)"],
 ["ring_bone","S","a ring carved from a single knucklebone, incised marks rubbed with soot"],
 ["ring_copper","S","a simple coiled copper ring with clean hammered metal"],
 ["ring_jade","S","a ring carved from a single piece of green jade, faint cool sheen, a hair-thin gold band inlaid around its center"],
 ["ring_amber","S","a ring carved from raw honey-gold amber, translucent with a trapped seed inside, set in a thin embossed gold collar"],
 ["curio_bone","S","a small carved bone bird curio with clean simple shape"],
 ["curio_jade","S","a strange small curio: a tiny carved jade river-fish with incised scales and gold-leaf fins, resting on a black feather"],
 ["curio_amber","S","a single polished amber sphere with a trapped mayfly centered alone"],
 ["red_ochre","S","a lump of red ochre pigment beside a grinding stone stained crimson, a pinch of spilled powder beside it"],
 ["woad","S","vivid blue woad paste in a pearly seashell, a bone stirring stick resting across it"],
 ["soot","S","black soot powder in a carved bone tube capped with copper, a smudge of black spilled at its mouth"],
 ["marsh_ochre","S","yellow marsh ochre in a small woven reed basket, the weave stained gold at the rim"],
 ["entrail_omen","S","a clay liver-model omen piece incised with a divination grid in the Mesopotamian style, some lines rubbed with red ochre"],
 ["bird_omen","S","a bird-flight omen: a bundle of black and teal feathers bound with knotted string and a small bronze ring"],
 ["smoke_omen","S","a smoldering herb bundle wrapped in red cord on a small clay dish, one thin wisp of pale smoke rising"],
 ["blood_omen","S","a shallow clay bowl glazed dark, stained with old blood, a bronze lancet resting across its rim"]
];
const MISSING = new Set([]);
const KEY="verdigris_review_v1";
const SAVED_REVIEW = Object.fromEntries((window.VerdigrisAssetReview||[]).map(r=>[r.name,r]));
const HAS_SAVED_REVIEW = Object.keys(SAVED_REVIEW).length>0;
let state = JSON.parse(localStorage.getItem(KEY)||"{}");
let filter="all";

function saveState(){localStorage.setItem(KEY,JSON.stringify(state))}
function get(n){return state[n]||(state[n]={status:"",modes:[],desc:"",notes:""})}
function defaultState(it, includePreflags){
  const [n,cv,desc,pf,modes,sugg]=it;
  const s={status:"",modes:[],desc:"",notes:""};
  if(includePreflags && pf==="rework"){s.status="rework";s.modes=(modes||"").split(",").filter(Boolean);s.desc=sugg||"";}
  return s;
}
function sameState(a,b){
  return a && b && a.status===b.status && (a.desc||"")===(b.desc||"") && (a.notes||"")===(b.notes||"") && (a.modes||[]).join(",")===(b.modes||[]).join(",");
}
function applySavedReview(s,saved){
  s.status=saved.status||s.status;
  s.modes=Array.isArray(saved.failure_modes)?saved.failure_modes.slice():s.modes;
  s.desc=saved.reworked_desc||s.desc;
  s.notes=saved.notes||"";
}

function seed(){
  // preseed from ITEMS preflag columns and durable exported review feedback
  // if user hasn't touched that item in this browser.
  ITEMS.forEach(it=>{
    const n=it[0];
    const base=defaultState(it,!HAS_SAVED_REVIEW);
    const legacyBase=defaultState(it,true);
    const saved=SAVED_REVIEW[n];
    const wasDefault=!state[n] || sameState(state[n],base) || sameState(state[n],legacyBase);
    if(!state[n])state[n]=base;
    else if(HAS_SAVED_REVIEW && !saved && sameState(state[n],legacyBase))state[n]=base;
    if(saved && wasDefault)applySavedReview(state[n],saved);
  });
  saveState();
}

function render(){
  const grid=document.getElementById("grid");grid.innerHTML="";
  let nFlag=0,nOk=0,nDiscard=0,nMiss=0;
  ITEMS.forEach(it=>{
    const [n,cv,desc]=it; const st=get(n);
    if(st.status==="rework")nFlag++; if(st.status==="ok")nOk++; if(st.status==="discard")nDiscard++; if(MISSING.has(n))nMiss++;
    let show=true;
    if(filter==="flag")show=st.status==="rework";
    else if(filter==="discard")show=st.status==="discard";
    else if(filter==="ok")show=st.status==="ok";
    else if(filter==="untouched")show=!st.status;
    if(!show)return;
    const card=document.createElement("div");
    card.className="card"+(st.status==="rework"?" flag":"")+(st.status==="discard"?" discard":"")+(MISSING.has(n)?" missing":"");
    const img = MISSING.has(n)?`<span class="none">NO ART YET</span>`:`<img src="assets/${n}.png" alt="${n}" loading="lazy"/>`;
    card.innerHTML=`
      <div class="thumb">${img}</div>
      <div class="body">
        <div class="row"><span class="name">${n}</span><span class="cv">${cv}</span></div>
        <div class="status">
          <button class="ok ${st.status==="ok"?"on":""}" data-a="ok">OK</button>
          <button class="rw ${st.status==="rework"?"on":""}" data-a="rework">Rework</button>
          <button class="ds ${st.status==="discard"?"on":""}" data-a="discard">Discard</button>
        </div>
        <div class="modes">${MODES.map(m=>`<span class="chip ${st.modes.includes(m)?"on":""}" data-m="${m}">${m}</span>`).join("")}</div>
        <div><label class="fld">DESC / reworked prompt</label><textarea class="desc" data-k="desc" placeholder="original: ${desc.replace(/"/g,'&quot;')}">${st.desc||""}</textarea></div>
        <div><label class="fld">notes</label><textarea class="notes" data-k="notes">${st.notes||""}</textarea></div>
      </div>`;
    card.querySelectorAll(".status button").forEach(b=>b.onclick=()=>{
      st.status = st.status===b.dataset.a?"":b.dataset.a; saveState(); render();});
    card.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
      const m=c.dataset.m; const i=st.modes.indexOf(m);
      if(i>=0)st.modes.splice(i,1);else st.modes.push(m);
      saveState(); render();});
    card.querySelectorAll("textarea").forEach(t=>t.oninput=()=>{st[t.dataset.k]=t.value;saveState();});
    grid.appendChild(card);
  });
  document.getElementById("cTotal").textContent=ITEMS.length;
  document.getElementById("cFlag").textContent=nFlag;
  document.getElementById("cDiscard").textContent=nDiscard;
  document.getElementById("cOk").textContent=nOk;
  document.getElementById("cMiss").textContent=nMiss;
  // summary of failure modes
  const tally={};ITEMS.forEach(it=>{const st=get(it[0]);if(st.status==="rework")st.modes.forEach(m=>tally[m]=(tally[m]||0)+1)});
  const parts=Object.entries(tally).sort((a,b)=>b[1]-a[1]).map(([m,c])=>`${m}: <b>${c}</b>`);
  const summary=[];
  if(parts.length) summary.push("Failure modes across rework items — "+parts.join(" · "));
  if(nDiscard) summary.push(`${nDiscard} discarded as not worth regenerating.`);
  document.getElementById("summary").innerHTML = summary.length? summary.join(" ") : "No items flagged yet. Mark items 'Rework' to draft a better prompt, or 'Discard' for ideas that are not worth another image-2 attempt.";
}
document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{
  filter=b.dataset.f;document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render();});
document.getElementById("btnExport").onclick=()=>{
  const out=ITEMS.filter(it=>["rework","discard"].includes(get(it[0]).status)).map(it=>{
    const [n,cv,desc]=it;const st=get(n);
    return {name:n,status:st.status,canvas:cv,failure_modes:st.modes,original_desc:desc,reworked_desc:st.desc||desc,notes:st.notes||""};});
  document.getElementById("exportText").value=JSON.stringify(out,null,2);
  document.getElementById("exportPane").style.display="flex";};
document.getElementById("btnClose").onclick=()=>document.getElementById("exportPane").style.display="none";
document.getElementById("btnCopy").onclick=()=>{const t=document.getElementById("exportText");t.select();document.execCommand("copy");};
document.getElementById("btnReset").onclick=()=>{if(confirm("Clear all your review marks?")){state={};localStorage.removeItem(KEY);seed();render();}};
seed();render();
</script>
</body>
</html>

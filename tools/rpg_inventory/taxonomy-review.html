<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verdigris Character Item Taxonomy</title>
<style>
  :root {
    --bg: #111315;
    --panel: #191d21;
    --panel2: #20262b;
    --edge: #333b43;
    --ink: #e8e3d7;
    --dim: #9a9d9f;
    --muted: #777d82;
    --accent: #bfa76a;
    --ok: #80b879;
    --warn: #d6aa5e;
    --bad: #d87171;
    --info: #8fb7d7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  a { color: inherit; }
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--edge);
    background: rgba(25, 29, 33, 0.98);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: 0.02em; }
  .nav { display: flex; gap: 8px; flex-wrap: wrap; }
  .spacer { flex: 1 1 auto; }
  .meta { color: var(--dim); font-size: 12px; }
  .btn, button, select, input, textarea {
    font: inherit;
    color: var(--ink);
    background: var(--panel2);
    border: 1px solid var(--edge);
    border-radius: 7px;
  }
  .btn, button {
    padding: 7px 10px;
    cursor: pointer;
    text-decoration: none;
  }
  button:hover, .btn:hover, select:focus, input:focus, textarea:focus { border-color: var(--accent); outline: none; }
  button.active { background: var(--accent); border-color: var(--accent); color: #111315; font-weight: 700; }
  .toolbar {
    display: grid;
    grid-template-columns: minmax(180px, 1fr) repeat(3, minmax(130px, 170px));
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    background: #14171a;
  }
  .toolbar input, .toolbar select { width: 100%; padding: 8px 10px; }
  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
    padding: 14px 16px 0;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 8px;
    padding: 9px 10px;
    min-height: 62px;
  }
  .stat b { display: block; font-size: 18px; line-height: 1.1; }
  .stat span { color: var(--dim); font-size: 12px; }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px 16px 0;
  }
  .chip {
    color: var(--dim);
    border: 1px solid var(--edge);
    border-radius: 999px;
    padding: 3px 8px;
    font-size: 12px;
    background: rgba(255,255,255,0.02);
  }
  main {
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .card.keep { border-color: rgba(128, 184, 121, 0.65); }
  .card.replace { border-color: rgba(214, 170, 94, 0.75); }
  .card.duplicate { border-color: rgba(143, 183, 215, 0.75); }
  .card.discard { border-color: rgba(216, 113, 113, 0.75); opacity: 0.78; }
  .thumb {
    height: 250px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #7f8586;
    background-image:
      linear-gradient(45deg, #6f7677 25%, transparent 25%),
      linear-gradient(-45deg, #6f7677 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #6f7677 75%),
      linear-gradient(-45deg, transparent 75%, #6f7677 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    border-bottom: 1px solid var(--edge);
  }
  .thumb img {
    max-width: 96%;
    max-height: 96%;
    filter: drop-shadow(0 3px 8px rgba(0,0,0,0.45));
  }
  .body { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .id { font-weight: 700; letter-spacing: 0.02em; }
  .tag { color: var(--dim); border: 1px solid var(--edge); border-radius: 5px; padding: 1px 5px; font-size: 11px; white-space: nowrap; }
  label { display: grid; gap: 3px; color: var(--dim); font-size: 11px; }
  label span { white-space: nowrap; }
  input, select, textarea { width: 100%; padding: 6px 7px; min-width: 0; }
  textarea { resize: vertical; min-height: 45px; }
  .twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .status { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .status button { padding: 5px 3px; font-size: 11px; color: var(--dim); }
  .status button.on[data-status="review"] { color: var(--ink); border-color: var(--muted); }
  .status button.on[data-status="keep"] { background: var(--ok); border-color: var(--ok); color: #101410; }
  .status button.on[data-status="replace"] { background: var(--warn); border-color: var(--warn); color: #17130d; }
  .status button.on[data-status="duplicate"] { background: var(--info); border-color: var(--info); color: #0d1217; }
  .status button.on[data-status="discard"] { background: var(--bad); border-color: var(--bad); color: #160d0d; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--dim); }
  .links a { color: var(--dim); text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.16); }
  .links a:hover { color: var(--ink); border-color: var(--accent); }
  .hidden { display: none !important; }
  #exportPane {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,0.65);
  }
  #exportPane.open { display: flex; }
  .modal {
    width: min(980px, 96vw);
    max-height: 88vh;
    overflow: auto;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 10px;
    padding: 14px;
  }
  #exportText { min-height: 420px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  @media (max-width: 760px) {
    .toolbar { grid-template-columns: 1fr 1fr; }
    main { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); padding: 10px; }
    .thumb { height: 210px; }
    .status { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Character Item Taxonomy</h1>
    <div class="meta" id="batchMeta">Loading batch...</div>
  </div>
  <div class="nav">
    <a class="btn" href="index.html">Inventory</a>
    <a class="btn" href="review.html">Base Review</a>
  </div>
  <div class="spacer"></div>
  <button id="exportBtn">Export taxonomy</button>
  <button id="resetBtn">Reset edits</button>
</header>

<section class="toolbar">
  <input id="searchInput" type="search" placeholder="Search id, label, subtype, notes" />
  <select id="slotFilter"></select>
  <select id="laneFilter"></select>
  <select id="statusFilter"></select>
</section>

<section class="summary" id="summary"></section>
<section class="chips" id="chips"></section>
<main id="grid"></main>

<div id="exportPane">
  <div class="modal">
    <div class="row" style="margin-bottom: 10px;">
      <b>Taxonomy export</b>
      <div class="spacer"></div>
      <button id="copyBtn">Copy JSON</button>
      <button id="closeBtn">Close</button>
    </div>
    <textarea id="exportText" readonly></textarea>
  </div>
</div>

<script src="core/character-item-taxonomy.js"></script>
<script>
const STORAGE_KEY = "verdigris_character_item_taxonomy_v1";
const ITEMS = window.VerdigrisCharacterItemTaxonomy || [];
const META = window.VerdigrisCharacterItemTaxonomyMeta || {};
const STATUS = META.statuses || ["review", "keep", "replace", "duplicate", "discard"];
const SLOTS = META.slots || [...new Set(ITEMS.map((it) => it.slot))].sort();
const LANES = [...new Set(ITEMS.map((it) => it.visualLane))];
const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
const els = {
  batchMeta: document.getElementById("batchMeta"),
  grid: document.getElementById("grid"),
  summary: document.getElementById("summary"),
  chips: document.getElementById("chips"),
  search: document.getElementById("searchInput"),
  slot: document.getElementById("slotFilter"),
  lane: document.getElementById("laneFilter"),
  status: document.getElementById("statusFilter"),
  exportPane: document.getElementById("exportPane"),
  exportText: document.getElementById("exportText"),
};

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function merged(item) {
  return { ...item, ...(state[item.id] || {}) };
}

function setItem(id, patch, shouldRender = true) {
  state[id] = { ...(state[id] || {}), ...patch };
  save();
  if (shouldRender) render();
}

function optionList(select, label, values) {
  select.innerHTML = [`<option value="">${label}</option>`].concat(values.map((v) => `<option value="${v}">${v}</option>`)).join("");
}

function countsBy(items, key) {
  return items.reduce((acc, item) => {
    const value = item[key] || "unset";
    acc[value] = (acc[value] || 0) + 1;
    return acc;
  }, {});
}

function searchText(item) {
  return [item.id, item.label, item.slot, item.subtype, item.visualLane, item.status, item.notes].join(" ").toLowerCase();
}

function filteredItems() {
  const q = els.search.value.trim().toLowerCase();
  return ITEMS.map(merged).filter((item) => {
    if (q && !searchText(item).includes(q)) return false;
    if (els.slot.value && item.slot !== els.slot.value) return false;
    if (els.lane.value && item.visualLane !== els.lane.value) return false;
    if (els.status.value && item.status !== els.status.value) return false;
    return true;
  });
}

function renderSummary(visible) {
  const all = ITEMS.map(merged);
  const statusCounts = countsBy(all, "status");
  const slotCounts = countsBy(all, "slot");
  const laneCounts = countsBy(all, "visualLane");
  els.summary.innerHTML = [
    ["Visible", `${visible.length}/${ITEMS.length}`],
    ["Keep", statusCounts.keep || 0],
    ["Replace", statusCounts.replace || 0],
    ["Duplicate", statusCounts.duplicate || 0],
    ["Discard", statusCounts.discard || 0],
    ["Review", statusCounts.review || 0],
  ].map(([label, value]) => `<div class="stat"><b>${value}</b><span>${label}</span></div>`).join("");
  els.chips.innerHTML = Object.entries(slotCounts).map(([k, v]) => `<span class="chip">${k}: ${v}</span>`).join("") +
    Object.entries(laneCounts).map(([k, v]) => `<span class="chip">${k}: ${v}</span>`).join("");
}

function card(item) {
  const statusButtons = STATUS.map((s) => `<button type="button" data-id="${item.id}" data-status="${s}" class="${item.status === s ? "on" : ""}">${s}</button>`).join("");
  return `<article class="card ${item.status}">
    <div class="thumb"><img src="${item.reviewImage}" alt="${item.id}" loading="lazy" /></div>
    <div class="body">
      <div class="row"><span class="id">${item.id}</span><span class="tag">${item.slot}</span><span class="tag">${item.visualLane}</span></div>
      <label><span>Label</span><input data-edit="${item.id}" data-field="label" value="${escapeAttr(item.label)}" /></label>
      <div class="twocol">
        <label><span>Slot</span><select data-edit="${item.id}" data-field="slot">${SLOTS.map((s) => `<option value="${s}" ${item.slot === s ? "selected" : ""}>${s}</option>`).join("")}</select></label>
        <label><span>Status</span><select data-edit="${item.id}" data-field="status">${STATUS.map((s) => `<option value="${s}" ${item.status === s ? "selected" : ""}>${s}</option>`).join("")}</select></label>
      </div>
      <div class="twocol">
        <label><span>Subtype</span><input data-edit="${item.id}" data-field="subtype" value="${escapeAttr(item.subtype)}" /></label>
        <label><span>Visual lane</span><select data-edit="${item.id}" data-field="visualLane">${LANES.map((s) => `<option value="${s}" ${item.visualLane === s ? "selected" : ""}>${s}</option>`).join("")}</select></label>
      </div>
      <div class="status">${statusButtons}</div>
      <label><span>Notes</span><textarea data-edit="${item.id}" data-field="notes">${escapeHtml(item.notes || "")}</textarea></label>
      <div class="links">
        <a href="${item.reviewImage}" target="_blank" rel="noreferrer">review webp</a>
        <a href="${item.cleanedImage}" target="_blank" rel="noreferrer">local cleaned png</a>
        <a href="${item.sourceImage}" target="_blank" rel="noreferrer">local source png</a>
      </div>
    </div>
  </article>`;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function escapeAttr(value) {
  return escapeHtml(value).replace(/`/g, "&#96;");
}

function render() {
  const visible = filteredItems();
  renderSummary(visible);
  els.grid.innerHTML = visible.map(card).join("");
}

function exportPayload() {
  return {
    meta: {
      ...META,
      exportedAt: new Date().toISOString(),
      localStorageKey: STORAGE_KEY,
      itemCount: ITEMS.length,
    },
    items: ITEMS.map((item) => merged(item)),
  };
}

function showExport() {
  els.exportText.value = JSON.stringify(exportPayload(), null, 2);
  els.exportPane.classList.add("open");
}

optionList(els.slot, "All slots", SLOTS);
optionList(els.lane, "All visual lanes", LANES);
optionList(els.status, "All statuses", STATUS);
els.batchMeta.textContent = `${META.batch || "batch"} - ${ITEMS.length} classified review assets`;

document.getElementById("exportBtn").onclick = showExport;
document.getElementById("resetBtn").onclick = () => {
  if (confirm("Clear local taxonomy edits for this batch?")) {
    localStorage.removeItem(STORAGE_KEY);
    Object.keys(state).forEach((key) => delete state[key]);
    render();
  }
};
document.getElementById("copyBtn").onclick = async () => {
  try {
    await navigator.clipboard.writeText(els.exportText.value);
  } catch {
    els.exportText.select();
    document.execCommand("copy");
  }
};
document.getElementById("closeBtn").onclick = () => els.exportPane.classList.remove("open");
els.exportPane.onclick = (event) => {
  if (event.target === els.exportPane) els.exportPane.classList.remove("open");
};
[els.search, els.slot, els.lane, els.status].forEach((el) => el.addEventListener("input", render));
els.grid.addEventListener("input", (event) => {
  const node = event.target.closest("[data-edit]");
  if (!node) return;
  const shouldRender = node.tagName === "SELECT";
  setItem(node.dataset.edit, { [node.dataset.field]: node.value }, shouldRender);
});
els.grid.addEventListener("change", (event) => {
  const node = event.target.closest("select[data-edit]");
  if (!node) return;
  setItem(node.dataset.edit, { [node.dataset.field]: node.value });
});
els.grid.addEventListener("click", (event) => {
  const button = event.target.closest("button[data-status]");
  if (!button) return;
  setItem(button.dataset.id, { status: button.dataset.status });
});

render();
</script>
</body>
</html>

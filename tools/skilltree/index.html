<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Modular RPG Skill Tree</title>
  <style>
    :root {
      --bg: #04070f;
      --panel: rgba(12, 18, 34, 0.8);
      --grid: rgba(56, 189, 248, 0.1);
      --text: #e2e8f0;
      --strength: #ef4444;
      --dexterity: #22c55e;
      --intellect: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at 50% 10%, rgba(56, 189, 248, 0.25), transparent 55%),
                  radial-gradient(circle at 10% 80%, rgba(248, 113, 113, 0.18), transparent 60%),
                  radial-gradient(circle at 85% 75%, rgba(74, 222, 128, 0.22), transparent 65%),
                  var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      min-height: 100vh;
    }

    .container {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 3rem;
    }

    .hud {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      z-index: 10;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(15, 23, 42, 0.45);
    }

    .skill-points {
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.03em;
    }

    .legend {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.9rem;
    }

    .legend button {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.25s ease;
    }

    .legend button:hover {
      transform: translateY(-1px);
      border-color: rgba(148, 163, 184, 0.5);
      box-shadow: 0 0 18px rgba(148, 163, 184, 0.25);
    }

    .legend button.active {
      border-color: currentColor;
      box-shadow: 0 0 18px currentColor;
    }

    .branch-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
    }

    svg {
      width: 100%;
      height: 100%;
      border-radius: 1.5rem;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.65), rgba(15, 23, 42, 0.35));
      border: 1px solid rgba(148, 163, 184, 0.12);
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.1);
    }

    .grid-line {
      stroke: var(--grid);
      stroke-width: 0.2;
    }

    .node {
      cursor: pointer;
      transition: transform 0.25s ease;
      pointer-events: all;
    }

    .node circle {
      stroke: rgba(15, 23, 42, 0.85);
      stroke-width: 1.3;
      filter: drop-shadow(0 0 2px rgba(15, 23, 42, 0.75));
      transition: all 0.3s ease;
    }

    .node text {
      fill: rgba(226, 232, 240, 0.95);
      font-size: 2.8px;
      letter-spacing: 0.02em;
      font-weight: 500;
      pointer-events: none;
      transition: font-size 0.25s ease;
    }

    .node:hover text {
      font-size: 3.2px;
    }

    .inactive-node circle {
      fill: rgba(30, 41, 59, 0.7);
    }

    .available-node circle {
      fill: rgba(59, 130, 246, 0.5);
      stroke: rgba(191, 219, 254, 0.45);
    }

    .active-node circle {
      stroke-width: 2;
      filter: drop-shadow(0 0 6px currentColor);
    }

    .node.strength.active-node circle {
      fill: rgba(239, 68, 68, 0.92);
      color: var(--strength);
    }

    .node.dexterity.active-node circle {
      fill: rgba(34, 197, 94, 0.92);
      color: var(--dexterity);
    }

    .node.intellect.active-node circle {
      fill: rgba(56, 189, 248, 0.92);
      color: var(--intellect);
    }

    .node.augment.active-node circle {
      fill: rgba(250, 204, 21, 0.95);
      color: #facc15;
    }

    .branch-highlight circle {
      filter: drop-shadow(0 0 10px currentColor);
    }

    .connection {
      stroke-width: 0.6;
      stroke-linecap: round;
      transition: stroke 0.3s ease, stroke-width 0.2s ease;
    }

    .connection.inactive {
      stroke: rgba(94, 102, 122, 0.5);
      stroke-dasharray: 2;
    }

    .connection.available {
      stroke: rgba(148, 197, 255, 0.75);
      stroke-dasharray: 1.2;
    }

    .connection.active {
      stroke-width: 1.1;
    }

    .connection.strength.active { stroke: var(--strength); }
    .connection.dexterity.active { stroke: var(--dexterity); }
    .connection.intellect.active { stroke: var(--intellect); }
    .connection.augment.active { stroke: #facc15; }

    .tooltip {
      position: absolute;
      pointer-events: none;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.35);
      color: var(--text);
      font-size: 0.9rem;
      max-width: 260px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.45);
      display: none;
      z-index: 20;
    }

    .tooltip strong {
      display: block;
      font-size: 1rem;
      margin-bottom: 0.25rem;
    }

    .tooltip span {
      display: block;
      color: rgba(148, 163, 184, 0.85);
      font-size: 0.8rem;
      margin-top: 0.35rem;
    }

    @media (max-width: 900px) {
      body {
        overflow: auto;
      }
      .container {
        height: auto;
        padding: 1.5rem;
      }
      svg {
        min-height: 600px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hud">
      <div class="panel skill-points">Unspent Points: <span id="points">15</span></div>
      <div class="panel legend">
        <button data-branch="all" class="active"><span class="branch-dot" style="background: linear-gradient(90deg, var(--strength), var(--dexterity), var(--intellect));"></span>Show All Branches</button>
        <button data-branch="strength"><span class="branch-dot" style="background: var(--strength);"></span>Titan Vanguard (Strength)</button>
        <button data-branch="dexterity"><span class="branch-dot" style="background: var(--dexterity);"></span>Shadow Dancer (Dexterity)</button>
        <button data-branch="intellect"><span class="branch-dot" style="background: var(--intellect);"></span>Arcanist (Intellect)</button>
      </div>
    </div>
    <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="tooltip" id="tooltip"></div>
  </div>

  <script>
    const svg = document.querySelector('svg');
    const tooltip = document.getElementById('tooltip');
    const pointsEl = document.getElementById('points');
    const legendButtons = document.querySelectorAll('.legend button');

    const gridGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    for (let i = 10; i < 100; i += 10) {
      const hLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      hLine.setAttribute('x1', 5);
      hLine.setAttribute('y1', i);
      hLine.setAttribute('x2', 95);
      hLine.setAttribute('y2', i);
      hLine.setAttribute('class', 'grid-line');
      gridGroup.appendChild(hLine);

      const vLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      vLine.setAttribute('x1', i);
      vLine.setAttribute('y1', 5);
      vLine.setAttribute('x2', i);
      vLine.setAttribute('y2', 95);
      vLine.setAttribute('class', 'grid-line');
      gridGroup.appendChild(vLine);
    }
    svg.appendChild(gridGroup);

    const nodes = [
      { id: 'core', name: 'Ascendant Core', description: 'Unlocks access to all branches and grants +5 to all stats.', branch: 'augment', tier: 0, x: 50, y: 88, cost: 0, bonuses: '+5 Strength\n+5 Dexterity\n+5 Intellect', requires: [] },

      { id: 'str-novice', name: 'Brute Training', description: 'Increases base melee damage and grants access to Vanguard upgrades.', branch: 'strength', tier: 1, x: 20, y: 72, cost: 1, bonuses: '+10% Melee Damage\n+50 Armor', requires: ['core'] },
      { id: 'dex-novice', name: 'Initiate Acrobatics', description: 'Improve mobility and evasion to weave through enemy fire.', branch: 'dexterity', tier: 1, x: 50, y: 72, cost: 1, bonuses: '+8% Movement Speed\n+6% Dodge', requires: ['core'] },
      { id: 'int-novice', name: 'Arcane Fundamentals', description: 'Master the flow of mana to sustain spellcasting.', branch: 'intellect', tier: 1, x: 80, y: 72, cost: 1, bonuses: '+15 Mana\n+10% Spell Damage', requires: ['core'] },

      { id: 'str-adept', name: 'Crushing Blows', description: 'Empower heavy strikes with shockwaves that stagger foes.', branch: 'strength', tier: 2, x: 20, y: 58, cost: 1, bonuses: '+20% Two-Hand Damage\nHits apply Slow', requires: ['str-novice'] },
      { id: 'dex-adept', name: 'Shadow Step', description: 'Blink behind enemies after evading an attack.', branch: 'dexterity', tier: 2, x: 50, y: 58, cost: 1, bonuses: 'Evade grants Shadow Step\n+12% Critical Chance', requires: ['dex-novice'] },
      { id: 'int-adept', name: 'Sigil Weaving', description: 'Carve persistent sigils to amplify sustained spells.', branch: 'intellect', tier: 2, x: 80, y: 58, cost: 1, bonuses: 'Sigils last 4s longer\n+15% DoT Damage', requires: ['int-novice'] },

      { id: 'str-master', name: 'Iron Tempest', description: 'Spending Rage releases a cone shockwave dealing area damage.', branch: 'strength', tier: 3, x: 20, y: 44, cost: 2, bonuses: 'Rage Spend Shockwave\n+25% Stun Duration', requires: ['str-adept'] },
      { id: 'dex-master', name: 'Phantom Blades', description: 'Critical hits launch phantom blades towards nearby foes.', branch: 'dexterity', tier: 3, x: 50, y: 44, cost: 2, bonuses: 'Crits fire blades\n+20% Attack Speed', requires: ['dex-adept'] },
      { id: 'int-master', name: 'Astral Channel', description: 'Channel cosmic energies to reduce cooldowns and empower spells.', branch: 'intellect', tier: 3, x: 80, y: 44, cost: 2, bonuses: 'Cooldowns reduced by 15%\n+20% AoE Radius', requires: ['int-adept'] },

      { id: 'str-keystone', name: 'Titan\'s Resolve', description: 'Become unstoppable while above 50% life, gaining immunity to control.', branch: 'strength', tier: 4, x: 20, y: 28, cost: 3, bonuses: 'Immune to Crowd Control >50% Life\n+40% Damage while Unstoppable', requires: ['str-master'] },
      { id: 'dex-keystone', name: 'Echoed Steps', description: 'Dodging leaves an echo that repeats the next skill cast.', branch: 'dexterity', tier: 4, x: 50, y: 28, cost: 3, bonuses: 'Echo repeats skills at 50% power\n+25% Projectile Speed', requires: ['dex-master'] },
      { id: 'int-keystone', name: 'Celestial Conductor', description: 'Spells add harmony charges that can be discharged in a devastating nova.', branch: 'intellect', tier: 4, x: 80, y: 28, cost: 3, bonuses: 'Harmony Nova deals 400% weapon damage\n+30% Mana Regeneration', requires: ['int-master'] },

      { id: 'augment-str-dex', name: 'Battle Rhythm', description: 'Blend raw strength with precision to keep momentum high.', branch: 'augment', tier: 2, x: 35, y: 52, cost: 1, bonuses: '+15% Attack Speed\nGain Momentum on hit', requires: ['str-adept', 'dex-adept'] },
      { id: 'augment-dex-int', name: 'Veil Piercer', description: 'Weave illusions into strikes causing spells to auto-target weakened foes.', branch: 'augment', tier: 2, x: 65, y: 52, cost: 1, bonuses: 'Critical hits mark enemies\nSpells prioritise marked foes', requires: ['dex-adept', 'int-adept'] },
      { id: 'augment-triad', name: 'Ascendant Synthesis', description: 'Master all disciplines to unlock a signature ability slot.', branch: 'augment', tier: 5, x: 50, y: 16, cost: 4, bonuses: 'Unlock Ascendant Signature Skill Slot\n+10 All Attributes', requires: ['str-keystone', 'dex-keystone', 'int-keystone'] }
    ];

    const synergyLinks = [
      ['str-adept', 'dex-adept'],
      ['dex-adept', 'int-adept'],
      ['str-master', 'augment-str-dex'],
      ['dex-master', 'augment-str-dex'],
      ['dex-master', 'augment-dex-int'],
      ['int-master', 'augment-dex-int'],
      ['augment-str-dex', 'augment-dex-int'],
      ['str-keystone', 'augment-triad'],
      ['dex-keystone', 'augment-triad'],
      ['int-keystone', 'augment-triad']
    ];

    let activeNodes = new Set(['core']);
    let skillPoints = 15;
    let highlightedBranch = 'all';

    const connectionElements = [];
    const nodeElements = new Map();

    nodes.forEach(node => {
      node.requires.forEach(req => {
        const requirementNode = nodes.find(n => n.id === req);
        if (!requirementNode) return;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', requirementNode.x);
        line.setAttribute('y1', requirementNode.y);
        line.setAttribute('x2', node.x);
        line.setAttribute('y2', node.y);
        line.setAttribute('class', `connection inactive ${node.branch}`);
        line.dataset.from = requirementNode.id;
        line.dataset.to = node.id;
        line.dataset.branch = node.branch;
        svg.appendChild(line);
        connectionElements.push(line);
      });
    });

    synergyLinks.forEach(([fromId, toId]) => {
      const from = nodes.find(n => n.id === fromId);
      const to = nodes.find(n => n.id === toId);
      if (!from || !to) return;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', from.x);
      line.setAttribute('y1', from.y);
      line.setAttribute('x2', to.x);
      line.setAttribute('y2', to.y);
      line.setAttribute('class', 'connection inactive augment');
      line.dataset.synergy = 'true';
      line.dataset.branch = 'augment';
      svg.appendChild(line);
      connectionElements.push(line);
    });

    nodes.forEach(node => {
      const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      group.setAttribute('transform', `translate(${node.x},${node.y})`);
      group.setAttribute('class', `node ${node.branch}`);
      group.dataset.id = node.id;
      group.dataset.branch = node.branch;

      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('r', node.tier === 4 ? '4.4' : node.tier === 5 ? '5' : '3.6');
      circle.setAttribute('fill', branchColor(node.branch, 0.55));
      group.appendChild(circle);

      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('y', -circle.getAttribute('r') - 1);
      text.setAttribute('text-anchor', 'middle');
      text.textContent = node.name;
      group.appendChild(text);

      svg.appendChild(group);
      nodeElements.set(node.id, group);

      group.addEventListener('mouseenter', evt => showTooltip(evt, node));
      group.addEventListener('mouseleave', hideTooltip);
      group.addEventListener('mousemove', evt => moveTooltip(evt));
      group.addEventListener('click', () => toggleNode(node.id));
    });

    function branchColor(branch, alpha = 1) {
      switch (branch) {
        case 'strength': return `rgba(239, 68, 68, ${alpha})`;
        case 'dexterity': return `rgba(34, 197, 94, ${alpha})`;
        case 'intellect': return `rgba(56, 189, 248, ${alpha})`;
        default: return `rgba(250, 204, 21, ${alpha})`;
      }
    }

    function showTooltip(evt, node) {
      tooltip.style.display = 'block';
      tooltip.innerHTML = `<strong>${node.name}</strong>${node.description}<span>${node.bonuses.replace(/\n/g, '<br>')}</span><span>Cost: ${node.cost} point${node.cost !== 1 ? 's' : ''}</span>`;
      moveTooltip(evt);
    }

    function moveTooltip(evt) {
      const padding = 16;
      tooltip.style.left = `${evt.clientX + padding}px`;
      tooltip.style.top = `${evt.clientY + padding}px`;
    }

    function hideTooltip() {
      tooltip.style.display = 'none';
    }

    function canActivate(node) {
      if (activeNodes.has(node.id)) return true;
      if (skillPoints < node.cost) return false;
      return node.requires.every(req => activeNodes.has(req));
    }

    function hasDependents(nodeId) {
      return nodes.some(n => n.requires.includes(nodeId) && activeNodes.has(n.id));
    }

    function toggleNode(nodeId) {
      const node = nodes.find(n => n.id === nodeId);
      if (!node) return;
      if (node.id === 'core') return;

      if (activeNodes.has(nodeId)) {
        if (hasDependents(nodeId)) return;
        activeNodes.delete(nodeId);
        skillPoints += node.cost;
      } else {
        if (!canActivate(node)) return;
        activeNodes.add(nodeId);
        skillPoints -= node.cost;
      }

      updateTree();
    }

    function updateTree() {
      pointsEl.textContent = skillPoints;

      nodeElements.forEach((group, nodeId) => {
        const node = nodes.find(n => n.id === nodeId);
        const isActive = activeNodes.has(nodeId);
        const isAvailable = !isActive && canActivate(node);
        const className = `node ${node.branch} ${isActive ? 'active-node' : isAvailable ? 'available-node' : 'inactive-node'}`;
        group.setAttribute('class', className);
        const dim = highlightedBranch !== 'all' && node.branch !== highlightedBranch && node.branch !== 'augment';
        group.style.opacity = dim ? '0.35' : '1';
      });

      connectionElements.forEach(line => {
        const from = line.dataset.from;
        const to = line.dataset.to;
        const synergy = line.dataset.synergy === 'true';
        const isActive = (!synergy && activeNodes.has(from) && activeNodes.has(to)) ||
                         (synergy && activeNodes.has(from) && activeNodes.has(to));
        const isAvailable = !isActive && !synergy && activeNodes.has(from);
        let stateClass = 'inactive';
        if (isActive) stateClass = 'active';
        else if (isAvailable) stateClass = 'available';
        const branch = line.dataset.branch || 'augment';
        line.setAttribute('class', `connection ${stateClass} ${branch}`);
        if (highlightedBranch !== 'all' && branch !== highlightedBranch && branch !== 'augment') {
          line.style.opacity = '0.25';
        } else {
          line.style.opacity = '1';
        }
      });
    }

    legendButtons.forEach(button => {
      button.addEventListener('click', () => {
        legendButtons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        highlightedBranch = button.dataset.branch;
        updateTree();
      });
    });

    updateTree();
  </script>
</body>
</html>

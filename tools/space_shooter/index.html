<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Space Shooter</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #0f0;
            font-family: monospace;
        }
        #gameCanvas {
            width: 100%;
            height: 100%;
            position: absolute;
        }
        #hud {
            position: absolute;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            z-index: 10;
            pointer-events: none;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #0f0;
            z-index: 10;
        }
        #radar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 120px;
            height: 120px;
            border: 1px solid #0f0;
            border-radius: 50%;
            z-index: 10;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            z-index: 5;
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: "";
            position: absolute;
            background-color: rgba(0, 255, 0, 0.5);
        }
        #crosshair::before {
            width: 100%;
            height: 2px;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
        }
        #crosshair::after {
            width: 2px;
            height: 100%;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
        }
        .enemy-blip {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: #f00;
            border-radius: 50%;
        }
        .player-blip {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #0f0;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        /* Cockpit overlay styles */
        #cockpit {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        .cockpit-frame {
            position: absolute;
            border: 2px solid #0f0;
            opacity: 0.5;
        }
        #cockpit-top {
            top: 0;
            left: 10%;
            right: 10%;
            height: 5%;
            border-bottom: none;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        #cockpit-bottom {
            bottom: 0;
            left: 5%;
            right: 5%;
            height: 15%;
            border-top: none;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
        }
        #cockpit-left {
            top: 20%;
            left: 0;
            width: 5%;
            bottom: 20%;
            border-right: none;
        }
        #cockpit-right {
            top: 20%;
            right: 0;
            width: 5%;
            bottom: 20%;
            border-left: none;
        }
        #speed-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #0f0;
            font-size: 14px;
            text-align: center;
            z-index: 10;
        }
        .target-indicator {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 1px solid #f00;
            border-radius: 50%;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
        <div id="score">SCORE: 0</div>
        <div id="shields">SHIELDS: 100%</div>
    </div>
    <div id="controls">
        CONTROLS:<br>
        W/S - Pitch<br>
        A/D - Roll<br>
        Q/E - Yaw<br>
        ARROWS - Move<br>
        SPACE - Fire
    </div>
    <div id="radar">
        <div class="player-blip"></div>
    </div>
    <div id="crosshair"></div>
    
    <!-- Add cockpit overlay -->
    <div id="cockpit">
        <div id="cockpit-top" class="cockpit-frame"></div>
        <div id="cockpit-bottom" class="cockpit-frame"></div>
        <div id="cockpit-left" class="cockpit-frame"></div>
        <div id="cockpit-right" class="cockpit-frame"></div>
    </div>
    <div id="speed-indicator">SPEED: 0</div>
    <div class="target-indicator"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game variables
        let scene, camera, renderer;
        let playerShip, enemies = [];
        let lasers = [];
        let score = 0;
        let shields = 100;
        let gameOver = false;
        
        // Movement controls
        const keys = {};
        document.addEventListener('keydown', (e) => { keys[e.key] = true; });
        document.addEventListener('keyup', (e) => { keys[e.key] = false; });
        
        // Initialize the game
        function init() {
            // Create scene
            scene = new THREE.Scene();
            
            // Create camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('gameCanvas'),
                antialias: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000);
            
            // Add starfield
            createStarfield();
            
            // Create player ship
            createPlayerShip();
            
            // Create initial enemies
            for (let i = 0; i < 10; i++) {
                createEnemy();
            }
            
            // Add event listener for window resize
            window.addEventListener('resize', onWindowResize);
            
            // Start game loop
            animate();
        }
        
        function createStarfield() {
            const starGeometry = new THREE.BufferGeometry();
            const starMaterial = new THREE.PointsMaterial({
                color: 0xFFFFFF,
                size: 1,
                sizeAttenuation: false
            });
            
            const starVertices = [];
            for (let i = 0; i < 3000; i++) {
                const x = (Math.random() - 0.5) * 2000;
                const y = (Math.random() - 0.5) * 2000;
                const z = (Math.random() - 0.5) * 2000;
                starVertices.push(x, y, z);
            }
            
            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
            const stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);
        }
        
        function createPlayerShip() {
            // Create geometry for a wireframe ship
            const geometry = new THREE.BufferGeometry();
            
            // Simple ship shape vertices
            const vertices = new Float32Array([
                // Front point
                0, 0, -3,
                
                // Wing points
                -2, 0, 1,
                2, 0, 1,
                
                // Rear points
                0, 1, 2,
                0, -1, 2
            ]);
            
            // Ship edges
            const indices = [
                0, 1, 0, 2, // Front to wings
                1, 3, 1, 4, // Left wing to rear
                2, 3, 2, 4, // Right wing to rear
                3, 4        // Connect rear points
            ];
            
            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geometry.setIndex(indices);
            
            const material = new THREE.LineBasicMaterial({ color: 0x00ff00 });
            playerShip = new THREE.LineSegments(geometry, material);
            
            // Position camera inside the ship for first-person view
            camera.position.set(0, 0.5, -1);
            playerShip.add(camera);
            
            scene.add(playerShip);
        }
        
        function createEnemy() {
            // Create geometry for a wireframe enemy ship
            const geometry = new THREE.BufferGeometry();
            
            // Simple enemy shape vertices - octahedron-inspired
            const vertices = new Float32Array([
                // Front point
                0, 0, -2,
                
                // Middle points
                -1, 1, 0,
                1, 1, 0,
                1, -1, 0,
                -1, -1, 0,
                
                // Rear point
                0, 0, 2
            ]);
            
            // Enemy ship edges
            const indices = [
                0, 1, 0, 2, 0, 3, 0, 4, // Front to middle
                5, 1, 5, 2, 5, 3, 5, 4, // Rear to middle
                1, 2, 2, 3, 3, 4, 4, 1  // Connect middle points
            ];
            
            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geometry.setIndex(indices);
            
            const material = new THREE.LineBasicMaterial({ color: 0xff0000 });
            const enemy = new THREE.LineSegments(geometry, material);
            
            // Position randomly in space
            enemy.position.set(
                (Math.random() - 0.5) * 200,
                (Math.random() - 0.5) * 200,
                (Math.random() - 0.5) * 200 - 50 // Bias enemies to be in front of player
            );
            
            // Store velocity for movement
            enemy.userData = {
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.5
                ),
                health: 100
            };
            
            scene.add(enemy);
            enemies.push(enemy);
            
            // Add to radar
            updateRadar();
        }
        
        function fireLaser() {
            const geometry = new THREE.BufferGeometry();
            // Make lasers appear to come from slightly to the sides of the cockpit
            // for a more immersive first-person effect
            const leftLaser = new THREE.BufferGeometry();
            const rightLaser = new THREE.BufferGeometry();
            
            leftLaser.setAttribute('position', new THREE.Float32BufferAttribute([
                -0.5, -0.2, -2,
                -0.5, -0.2, -20
            ], 3));
            
            rightLaser.setAttribute('position', new THREE.Float32BufferAttribute([
                0.5, -0.2, -2,
                0.5, -0.2, -20
            ], 3));
            
            const material = new THREE.LineBasicMaterial({ color: 0x00ffff });
            const laserLeft = new THREE.Line(leftLaser, material);
            const laserRight = new THREE.Line(rightLaser, material);
            
            // Position at ship's front
            laserLeft.position.copy(playerShip.position);
            laserLeft.rotation.copy(playerShip.rotation);
            laserRight.position.copy(playerShip.position);
            laserRight.rotation.copy(playerShip.rotation);
            
            // Set laser direction based on ship's orientation
            const direction = new THREE.Vector3(0, 0, -1);
            direction.applyQuaternion(playerShip.quaternion);
            
            laserLeft.userData = { 
                direction: direction,
                distance: 0
            };
            
            laserRight.userData = { 
                direction: direction,
                distance: 0
            };
            
            scene.add(laserLeft);
            scene.add(laserRight);
            lasers.push(laserLeft);
            lasers.push(laserRight);
        }
        
        function updateRadar() {
            // Clear previous blips
            const radar = document.getElementById('radar');
            const enemyBlips = document.querySelectorAll('.enemy-blip');
            enemyBlips.forEach(blip => blip.remove());
            
            // Add enemy blips
            enemies.forEach(enemy => {
                // Calculate relative position
                const relativePos = enemy.position.clone().sub(playerShip.position);
                
                // Rotate based on player orientation (simplified)
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(playerShip.quaternion);
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(playerShip.quaternion);
                
                // Project onto 2D plane
                const x = relativePos.dot(right) / 100;
                const y = relativePos.dot(forward) / 100;
                
                // Only show if in reasonable radar range
                if (Math.abs(x) < 1 && Math.abs(y) < 1) {
                    const blip = document.createElement('div');
                    blip.className = 'enemy-blip';
                    blip.style.left = `${50 + x * 50}%`;
                    blip.style.top = `${50 - y * 50}%`;
                    radar.appendChild(blip);
                }
            });
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function handleControls() {
            if (gameOver) return;
            
            // Rotation
            if (keys['a']) playerShip.rotation.z += 0.05; // Roll left
            if (keys['d']) playerShip.rotation.z -= 0.05; // Roll right
            if (keys['w']) playerShip.rotation.x -= 0.05; // Pitch up
            if (keys['s']) playerShip.rotation.x += 0.05; // Pitch down
            if (keys['q']) playerShip.rotation.y += 0.05; // Yaw left
            if (keys['e']) playerShip.rotation.y -= 0.05; // Yaw right
            
            // Movement
            const moveSpeed = 0.5;
            if (keys['ArrowUp']) {
                const direction = new THREE.Vector3(0, 0, -1);
                direction.applyQuaternion(playerShip.quaternion);
                playerShip.position.addScaledVector(direction, moveSpeed);
                currentSpeed = moveSpeed * 100; // Scale for display
                isMoving = true;
            }
            if (keys['ArrowDown']) {
                const direction = new THREE.Vector3(0, 0, 1);
                direction.applyQuaternion(playerShip.quaternion);
                playerShip.position.addScaledVector(direction, moveSpeed);
                currentSpeed = moveSpeed * 100; // Scale for display
                isMoving = true;
            }
            if (keys['ArrowLeft']) {
                const direction = new THREE.Vector3(-1, 0, 0);
                direction.applyQuaternion(playerShip.quaternion);
                playerShip.position.addScaledVector(direction, moveSpeed);
                isMoving = true;
            }
            if (keys['ArrowRight']) {
                const direction = new THREE.Vector3(1, 0, 0);
                direction.applyQuaternion(playerShip.quaternion);
                playerShip.position.addScaledVector(direction, moveSpeed);
                isMoving = true;
            }
            
            // Gradually decrease speed if not moving
            if (!isMoving && currentSpeed > 0) {
                currentSpeed = Math.max(0, currentSpeed - 2);
            }
            
            // Update speed indicator
            document.getElementById('speed-indicator').textContent = `SPEED: ${Math.round(currentSpeed)}`;
            
            // Shooting
            if (keys[' ']) {
                // Limit firing rate
                if (!playerShip.userData.lastFired || performance.now() - playerShip.userData.lastFired > 250) {
                    fireLaser();
                    playerShip.userData.lastFired = performance.now();
                }
            }
        }
        
        function updateGame() {
            if (gameOver) return;
            
            // Update enemy positions
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                
                // Move enemy
                enemy.position.add(enemy.userData.velocity);
                
                // Simple AI - sometimes change direction or target player
                if (Math.random() < 0.01) {
                    enemy.userData.velocity.x += (Math.random() - 0.5) * 0.1;
                    enemy.userData.velocity.y += (Math.random() - 0.5) * 0.1;
                    enemy.userData.velocity.z += (Math.random() - 0.5) * 0.1;
                    
                    // Limit max speed
                    const speed = enemy.userData.velocity.length();
                    if (speed > 0.8) {
                        enemy.userData.velocity.multiplyScalar(0.8 / speed);
                    }
                }
                
                // Occasionally target player
                if (Math.random() < 0.005) {
                    const toPlayer = new THREE.Vector3().subVectors(playerShip.position, enemy.position);
                    toPlayer.normalize().multiplyScalar(0.2);
                    enemy.userData.velocity.lerp(toPlayer, 0.3);
                }
                
                // Check if enemy is too far away
                if (enemy.position.distanceTo(playerShip.position) > 300) {
                    scene.remove(enemy);
                    enemies.splice(i, 1);
                    createEnemy(); // Replace with a new one
                }
                
                // Rotate enemy for visual effect
                enemy.rotation.x += 0.01;
                enemy.rotation.y += 0.01;
            }
            
            // Update lasers
            for (let i = lasers.length - 1; i >= 0; i--) {
                const laser = lasers[i];
                
                // Move laser forward
                laser.position.add(laser.userData.direction.clone().multiplyScalar(2));
                laser.userData.distance += 2;
                
                // Remove if too far
                if (laser.userData.distance > 200) {
                    scene.remove(laser);
                    lasers.splice(i, 1);
                    continue;
                }
                
                // Check for collision with enemies
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const enemy = enemies[j];
                    if (laser.position.distanceTo(enemy.position) < 3) {
                        // Hit an enemy
                        enemy.userData.health -= 25;
                        scene.remove(laser);
                        lasers.splice(i, 1);
                        
                        // Check if enemy is destroyed
                        if (enemy.userData.health <= 0) {
                            scene.remove(enemy);
                            enemies.splice(j, 1);
                            score += 100;
                            document.getElementById('score').textContent = `SCORE: ${score}`;
                            createEnemy(); // Replace with a new one
                        }
                        
                        break;
                    }
                }
            }
            
            // Check for collisions with player
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                if (enemy.position.distanceTo(playerShip.position) < 5) {
                    // Player hit
                    shields -= 10;
                    document.getElementById('shields').textContent = `SHIELDS: ${shields}%`;
                    
                    // Bounce enemy away
                    const awayFromPlayer = new THREE.Vector3().subVectors(enemy.position, playerShip.position);
                    awayFromPlayer.normalize().multiplyScalar(1);
                    enemy.userData.velocity.copy(awayFromPlayer);
                    
                    // Check if game over
                    if (shields <= 0) {
                        gameOver = true;
                        document.getElementById('hud').innerHTML += '<div style="color: red; font-size: 24px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">GAME OVER</div>';
                        document.getElementById('hud').innerHTML += '<div style="color: #0f0; font-size: 18px; position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%);">Press R to restart</div>';
                        
                        // Add restart listener
                        document.addEventListener('keydown', function restart(e) {
                            if (e.key === 'r') {
                                document.removeEventListener('keydown', restart);
                                location.reload();
                            }
                        });
                    }
                }
            }
            
            // Update radar every few frames
            if (performance.now() % 10 < 1) {
                updateRadar();
            }
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            handleControls();
            updateGame();
            
            renderer.render(scene, camera);
        }
        
        // Start the game
        init();
    </script>
</body>
</html>

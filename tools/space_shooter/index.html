<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Space Shooter</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #0f0;
            font-family: monospace;
        }
        #gameCanvas {
            width: 100%;
            height: 100%;
            position: absolute;
        }
        #hud {
            position: absolute;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            z-index: 10;
            pointer-events: none;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #0f0;
            z-index: 10;
        }
        #radar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 120px;
            height: 120px;
            border: 1px solid #0f0;
            border-radius: 50%;
            z-index: 10;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            z-index: 5;
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: "";
            position: absolute;
            background-color: rgba(0, 255, 255, 0.7);
        }
        #crosshair::before {
            width: 100%;
            height: 2px;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
        }
        #crosshair::after {
            width: 2px;
            height: 100%;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
        }
        /* Laser trajectory indicator */
        #laser-trajectory {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 200px;
            background: linear-gradient(to bottom, rgba(0, 255, 255, 0.7), rgba(0, 255, 255, 0));
            transform: translate(-50%, 0) rotateX(90deg);
            transform-origin: top center;
            z-index: 4;
            pointer-events: none;
        }
        .enemy-blip {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: #f00;
            border-radius: 50%;
        }
        .player-blip {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #0f0;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        /* Cockpit overlay styles */
        #cockpit {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        .cockpit-frame {
            position: absolute;
            border: 2px solid #00ffff;
            opacity: 0.7;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            transition: opacity 0.3s;
        }
        #cockpit-top {
            top: 0;
            left: 10%;
            right: 10%;
            height: 5%;
            border-bottom: none;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        #cockpit-bottom {
            bottom: 0;
            left: 5%;
            right: 5%;
            height: 15%;
            border-top: none;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
        }
        #cockpit-left {
            top: 20%;
            left: 0;
            width: 5%;
            bottom: 20%;
            border-right: none;
        }
        #cockpit-right {
            top: 20%;
            right: 0;
            width: 5%;
            bottom: 20%;
            border-left: none;
        }
        #speed-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #0f0;
            font-size: 14px;
            text-align: center;
            z-index: 10;
        }
        .target-indicator {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 1px solid #f00;
            border-radius: 50%;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
        <div id="score">SCORE: 0</div>
        <div id="shields">SHIELDS: 100%</div>
    </div>
    <div id="controls">
        CONTROLS:<br>
        MOUSE - Aim/Turn<br>
        W/S - Forward/Backward<br>
        A/D - Strafe Left/Right<br>
        Q/E - Roll<br>
        SPACE - Fire Lasers<br>
        M - Lock/Fire Missile<br>
        T - Target Nearest Enemy<br>
        CLICK - Lock Mouse
    </div>
    <div id="missile-indicator" style="position: absolute; top: 50px; right: 20px; color: #ffcc00; font-size: 14px; z-index: 10;">MISSILES: 5</div>
    <div id="radar">
        <div class="player-blip"></div>
    </div>
    <div id="crosshair"></div>
    <div id="laser-trajectory"></div>
    
    <!-- Add cockpit overlay -->
    <div id="cockpit">
        <div id="cockpit-top" class="cockpit-frame"></div>
        <div id="cockpit-bottom" class="cockpit-frame"></div>
        <div id="cockpit-left" class="cockpit-frame"></div>
        <div id="cockpit-right" class="cockpit-frame"></div>
    </div>
    <div id="speed-indicator">SPEED: 0</div>
    <div class="target-indicator"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>

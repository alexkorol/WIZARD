<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life &amp; Mana Orbs</title>
<style>
  :root{
    --ink:#0b0a09; --panel:#14110d; --panel2:#1a150f;
    --gold:#c9a96a; --gold-dim:#8a7146; --bone:#d8d2c4; --mute:#9a9183;
    --life:#c8323a; --life-glow:rgba(200,40,50,.45);
    --mana:#3d7be0; --mana-glow:rgba(60,120,224,.45);
    --serif:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--bone);font-family:var(--serif);min-height:100%}
  body{display:flex;flex-direction:column;align-items:center;padding:18px 16px 40px;
       background:
         radial-gradient(1200px 500px at 50% -10%, #1c1610 0%, transparent 60%),
         radial-gradient(900px 600px at 12% 110%, rgba(120,30,36,.10), transparent 60%),
         radial-gradient(900px 600px at 88% 110%, rgba(40,80,180,.10), transparent 60%),
         var(--ink);}

  /* ---- stage ---- */
  .stage-wrap{position:relative;width:min(1180px,100%)}
  .stage{position:relative;width:100%;aspect-ratio:1672/941;border:1px solid #3a3023;outline:1px solid #000;
         outline-offset:-4px;border-radius:4px;overflow:hidden;background:#000;
         box-shadow:0 0 0 1px #000,0 30px 80px -20px #000,
                    0 0 120px -30px var(--life-glow),0 0 120px -30px var(--mana-glow);}
  .stage::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:4px;
         box-shadow:inset 0 0 90px 10px rgba(0,0,0,.55)}
  canvas{position:absolute;display:block;z-index:1}
  .corner{position:absolute;width:26px;height:26px;border:1px solid var(--gold-dim);pointer-events:none;z-index:3}
  .corner.tl{top:7px;left:7px;border-right:0;border-bottom:0}
  .corner.tr{top:7px;right:7px;border-left:0;border-bottom:0}
  .corner.bl{bottom:7px;left:7px;border-right:0;border-top:0}
  .corner.br{bottom:7px;right:7px;border-left:0;border-top:0}

  /* plaques above the orbs */
  .plaque{position:absolute;transform:translateX(-50%);top:3.5%;text-align:center;pointer-events:none;z-index:2;
          display:flex;flex-direction:column;align-items:center;gap:2px;transition:opacity .3s}
  #plaqueL{left:32.35%} #plaqueR{left:67.45%}
  .plaque .num{font-size:clamp(15px,2.2vw,26px);font-weight:700;letter-spacing:.04em;line-height:1}
  .plaque .num small{font-size:.55em;font-weight:400;color:rgba(255,255,255,.5);font-family:var(--mono);letter-spacing:.1em}
  #plaqueL .num{color:#ffd9d4;text-shadow:0 0 14px rgba(255,60,60,.85),0 2px 3px #000}
  #plaqueR .num{color:#dceaff;text-shadow:0 0 14px rgba(80,140,255,.9),0 2px 3px #000}
  .plaque .bar{width:clamp(70px,9vw,120px);height:2px;border-radius:1px;background:#241d12;overflow:hidden;
               box-shadow:0 0 0 1px rgba(0,0,0,.7)}
  .plaque .bar i{display:block;height:100%;width:100%;transform-origin:left;transition:transform .12s linear}
  #plaqueL .bar i{background:linear-gradient(90deg,#7e1f26,#e5454e)}
  #plaqueR .bar i{background:linear-gradient(90deg,#234a8f,#62a0ff)}
  .resline{display:none;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:#a59d8e;
           text-transform:uppercase;background:rgba(0,0,0,.55);border:1px solid #363026;border-radius:3px;padding:1px 6px}
  .resline.on{display:block}
  .resline b{color:#cfc8ba;font-weight:600}
  .chips{display:flex;gap:5px;min-height:18px;align-items:center}
  .chip{display:none;align-items:center;gap:3px;font-family:var(--mono);font-size:10px;letter-spacing:.05em;
        background:rgba(0,0,0,.62);border:1px solid #2c251b;border-radius:3px;padding:1px 5px}
  .chip.on{display:inline-flex}
  .chip svg{width:10px;height:12px;display:block}
  .chip.poison{color:#9ee06a;border-color:#3a5220}
  .chip.bleed{color:#f08a8a;border-color:#5a2020}
  .chip.shield{color:#9fd2ff;border-color:#274566}
  .chip.reserve{color:#b9b2a4;border-color:#3a352c}
  .hidden-read{opacity:0}

  .fps{position:absolute;right:14px;top:12px;z-index:3;font-family:var(--mono);font-size:10px;
       letter-spacing:.18em;color:var(--mute);background:rgba(0,0,0,.45);padding:4px 8px;border:1px solid #2c251b;border-radius:3px}

  /* ---- console ---- */
  .console{width:min(1080px,100%);margin-top:14px;display:grid;grid-template-columns:1.15fr .7fr 1fr;gap:10px;opacity:.94}
  .panel{background:linear-gradient(180deg,#15110d,#100d0a);border:1px solid #292218;border-radius:6px;
         padding:11px 12px 10px;position:relative}
  .panel h2{font-variant:small-caps;letter-spacing:.24em;font-size:11px;font-weight:600;display:flex;align-items:center;gap:7px;color:#857c6c}
  .panel h2 .dot{width:6px;height:6px;transform:rotate(45deg)}
  .panel.life h2 .dot{background:#7e2b30}
  .panel.mana h2 .dot{background:#2c5497}
  .panel.sys h2{justify-content:center}

  .gauge{margin:8px 0 2px}
  .gauge input[type=range]{width:100%;appearance:none;height:5px;border-radius:3px;outline:none;cursor:pointer;
      background:#221c14;border:1px solid #000}
  .gauge input::-webkit-slider-thumb{appearance:none;width:13px;height:13px;border-radius:50%;
      background:radial-gradient(circle at 35% 35%,#fff6,var(--gc));border:1px solid #000;box-shadow:0 0 6px var(--gc)}
  .gauge input::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--gc);border:1px solid #000}
  .panel.life{--gc:var(--life)} .panel.mana{--gc:var(--mana)}
  .gauge .lab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--mute);
      letter-spacing:.1em;margin-top:5px}
  .gauge .lab b{color:var(--bone);font-weight:600}

  .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .grp{font-family:var(--mono);font-size:8px;letter-spacing:.22em;color:#564f43;text-transform:uppercase;
       width:100%;margin-top:4px;display:flex;align-items:center;gap:8px}
  .grp::after{content:"";flex:1;height:1px;background:#231e16}
  button{font-family:var(--serif);font-variant:small-caps;letter-spacing:.08em;font-size:11.5px;
      color:#b9b2a4;background:#1b1611;border:1px solid #322a1e;
      border-radius:4px;padding:5px 9px;cursor:pointer;transition:all .15s;user-select:none;-webkit-user-select:none}
  button:hover{border-color:#5a4d35;color:#d8cdb4}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .panel.life button:hover{border-color:#6a3236;color:#df9ba0}
  .panel.mana button:hover{border-color:#2f4d80;color:#9fbbe8}
  button.tgl[aria-pressed="true"]{border-color:#8a7146;color:var(--gold);background:#221c12}
  button.danger:hover{border-color:#7a2a2e;color:#e08a8a}
  .key{font-family:var(--mono);font-size:8px;color:#6a6256;letter-spacing:.05em;border:1px solid #2b2419;
      border-radius:3px;padding:0 3px;margin-left:5px;vertical-align:1px}

  .sys .btns{justify-content:center}
  .sys .row{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .seg{display:flex;border:1px solid #322a1e;border-radius:4px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:5px 9px;font-size:11px}
  .seg button+button{border-left:1px solid #322a1e}
  .seg button[aria-pressed="true"]{color:var(--gold);background:#221b11}
  .seg.small button{padding:5px 9px;font-size:11px;font-family:var(--mono);letter-spacing:0}
  .resrow{display:flex;align-items:center;gap:10px;width:100%;margin-top:2px}
  .resrow input[type=range]{flex:1;appearance:none;height:5px;border-radius:3px;border:1px solid #000;
      background:linear-gradient(90deg,#6e675c var(--rp,0%),#241e15 var(--rp,0%));cursor:pointer}
  .resrow input::-webkit-slider-thumb{appearance:none;width:13px;height:13px;border-radius:2px;transform:rotate(45deg);
      background:linear-gradient(135deg,#cfc8ba,#7e776b);border:1px solid #000;box-shadow:0 0 6px rgba(200,190,170,.5)}
  .resrow input::-moz-range-thumb{width:13px;height:13px;border-radius:2px;background:#b0a899;border:1px solid #000}
  .resrow b{font-family:var(--mono);font-size:11px;color:#b9b2a4;min-width:38px;text-align:right}
  .hint{font-family:var(--mono);font-size:8px;color:#544d41;letter-spacing:.12em;text-align:center;margin-top:10px;line-height:1.7}

  @media (max-width:980px){
    .console{grid-template-columns:1fr 1fr}
    .panel.sys{grid-column:1/-1;order:3}
  }
  @media (max-width:640px){
    .console{grid-template-columns:1fr}
    .plaque .num{font-size:15px}
  }
</style>
</head>
<body>

<div class="stage-wrap">
  <div class="stage">
    <canvas id="gl"></canvas>
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>

    <div class="plaque" id="plaqueL">
      <div class="num"><span id="hpVal">1000</span> <small>/ 1000</small></div>
      <div class="bar"><i id="hpBar"></i></div>
      <div class="resline" id="resLineL">reserved <b id="resPctL">25%</b></div>
      <div class="chips">
        <span class="chip poison" id="chipPoison">
          <svg viewBox="0 0 10 12"><path d="M5 0C5 0 1 5 1 8a4 4 0 0 0 8 0C9 5 5 0 5 0Z" fill="#7fc14f"/></svg>
          <b id="poisonPct">100%</b></span>
        <span class="chip bleed" id="chipBleed">
          <svg viewBox="0 0 10 12"><path d="M5 0C5 0 1 5 1 8a4 4 0 0 0 8 0C9 5 5 0 5 0Z" fill="#a82230"/></svg>
          <b id="bleedN">×1</b></span>
      </div>
    </div>

    <div class="plaque" id="plaqueR">
      <div class="num"><span id="mpVal">800</span> <small>/ 800</small></div>
      <div class="bar"><i id="mpBar"></i></div>
      <div class="resline" id="resLineR">reserved <b id="resPctR">25%</b></div>
      <div class="chips"></div>
    </div>

    <div class="fps" id="fps">-- FPS</div>
  </div>
</div>

<div class="console">
  <section class="panel life">
    <h2><span class="dot"></span>Health</h2>
    <div class="gauge"><input type="range" id="hpSlider" min="0" max="1000" step="1" value="1000" aria-label="Health amount">
      <div class="lab"><span>0</span><b id="hpLab">1000 / 1000</b><span>1000</span></div></div>
    <div class="btns">
      <button id="btnHit">Take Hit −15%<span class="key">1</span></button>
      <button id="btnCrit" class="danger">Heavy Blow −40%<span class="key">2</span></button>
      <button id="btnPotion">Drink Potion +35%<span class="key">3</span></button>
      <button id="btnHpRegen" class="tgl" aria-pressed="false">Regenerate</button>
      <div class="grp">ailments</div>
      <button id="btnPoison">Apply Poison<span class="key">4</span></button>
      <button id="btnBleed" class="danger">Bleed +1 stack<span class="key">5</span></button>
      <div class="grp">reservation</div>
      <div class="resrow"><input type="range" id="resLSlider" min="0" max="100" step="1" value="0"
        aria-label="Life reservation percent"><b id="resLLab">0%</b></div>
    </div>
  </section>

  <section class="panel sys">
    <h2>Controls</h2>
    <div class="btns">
      <button id="btnBoss" class="tgl" aria-pressed="false">Boss Fight<span class="key">Space</span></button>
      <button id="btnRestore">Restore All<span class="key">R</span></button>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="Render quality">
        <button data-q="ultra" aria-pressed="true">Ultra</button>
        <button data-q="high" aria-pressed="false">High</button>
        <button data-q="perf" aria-pressed="false">50×</button>
      </div>
      <button id="btnVals" class="tgl" aria-pressed="true">Values</button>
    </div>
    <div class="hint">1·2·3 · 4·5 · Q·W·E · R · SPACE</div>
  </section>

  <section class="panel mana">
    <h2><span class="dot"></span>Mana</h2>
    <div class="gauge"><input type="range" id="mpSlider" min="0" max="800" step="1" value="800" aria-label="Mana amount">
      <div class="lab"><span>0</span><b id="mpLab">800 / 800</b><span>800</span></div></div>
    <div class="btns">
      <button id="btnBolt">Cast Bolt −12%<span class="key">Q</span></button>
      <button id="btnChannel">Channel (hold)<span class="key">E</span></button>
      <button id="btnElixir">Drink Elixir +40%<span class="key">W</span></button>
      <button id="btnMpRegen" class="tgl" aria-pressed="true">Meditate</button>
      <div class="grp">reservation</div>
      <div class="resrow"><input type="range" id="resRSlider" min="0" max="100" step="1" value="0"
        aria-label="Mana reservation percent"><b id="resRLab">0%</b></div>
    </div>
  </section>
</div>

<script id="fs" type="x-shader/fragment">#version 300 es
precision highp float;

uniform sampler2D uArt;
uniform sampler2D uMask;
uniform sampler2D uNorm;
uniform sampler2D uEmpty;   // empty-glass plate
uniform sampler2D uPack;    // r: sphere depth/thickness, g: ambient occlusion
uniform sampler2D uStone;   // petrified-orb plate for reservations
uniform vec2  uRes;
uniform vec2  uViewOrigin; // cropped overlay origin in full-art UV space
uniform vec2  uViewSize;   // cropped overlay extent in full-art UV space
uniform float uTime;
uniform float uHP;        // displayed 0..1
uniform float uMP;
uniform float uLvlL;      // surface height in orb units (-1.05..1.05)
uniform float uLvlR;
uniform float uSloshL;    // signed tilt
uniform float uSloshR;
uniform float uBeat;      // accumulated heartbeat phase
uniform int   uOct;
uniform float uFlashL;    // event flash impulse, decays in JS
uniform float uFlashR;
uniform float uFullL;     // gentle full-charge bloom, decays in JS
uniform float uFullR;
uniform float uPoison;    // 0..1 poison saturation of the blood
uniform float uBleed;     // 0..1 bleed intensity (stacks)
uniform float uResL;      // reserved fraction, life
uniform float uResR;      // reserved fraction, mana
uniform float uResLvlL;   // stone boundary height (orb units); >1.5 means none
uniform float uResLvlR;
uniform float uMotion;    // 1.0 normal, lower if reduced motion

out vec4 outColor;

const vec2 ART  = vec2(1672.0, 941.0);
const vec3 ORBL = vec3(541.0, 484.5, 252.0);  // cx, cy(y-up), r in art px
const vec3 ORBR = vec3(1128.0, 483.0, 252.0);
const float INNER = 0.94;                      // inner glass radius

float hash12(vec2 p){
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash12(i);
  float b = hash12(i + vec2(1.0, 0.0));
  float c = hash12(i + vec2(0.0, 1.0));
  float d = hash12(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
const mat2 M2 = mat2(0.8, 0.6, -0.6, 0.8);
float fbm(vec2 p){
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 6; i++){
    if (i >= uOct) break;
    s += a * vnoise(p);
    p = M2 * p * 2.03 + vec2(11.7, 9.3);
    a *= 0.5;
  }
  return s;
}
float luma(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }
float satur(vec3 c){
  float mx = max(c.r, max(c.g, c.b));
  float mn = min(c.r, min(c.g, c.b));
  return (mx - mn) / max(mx, 1e-3);
}
float beatEnv(float ph){
  float f = fract(ph);
  return exp(-f * 7.0) + 0.5 * exp(-pow((f - 0.33) * 9.0, 2.0)); // lub-dub
}

/* ------------------------------ LIFE ------------------------------ */
vec3 lifeLiquid(vec2 p, float surf, float surfFlat){
  float hp    = uHP;
  float low   = smoothstep(0.5, 0.1, hp);
  float vital = smoothstep(0.12, 0.85, hp);
  float beat  = beatEnv(uBeat) * low;
  float t = uTime;

  // double domain warp: opaque billowing cloud, no grid bias
  vec2 q = p * vec2(1.0, 1.22) + vec2(0.0, -t * 0.045);
  q += normalize(p + vec2(1e-4)) * beat * 0.05;
  vec2 w1 = vec2(fbm(q * 1.8 + vec2(0.0,  t * 0.04)),
                 fbm(q * 1.8 + vec2(7.3, -t * 0.05)));
  vec2 q2 = q + (w1 - 0.5) * 1.7;

  // plume density: ridged billow + base, like paint blooming in water
  float b1 = fbm(q2 * 2.3);
  float dN = clamp(b1 * 0.55 + (1.0 - abs(2.0 * b1 - 1.0)) * 0.62 - 0.12, 0.0, 1.0);
  // the same field sampled toward the light: curl edges catch it
  vec2 Ld = vec2(-0.38, 0.925);
  float b2 = fbm((q2 + Ld * 0.075) * 2.3);
  float d2s = clamp(b2 * 0.55 + (1.0 - abs(2.0 * b2 - 1.0)) * 0.62 - 0.12, 0.0, 1.0);
  float lit = clamp((dN - d2s) * 3.2, -1.0, 1.0);
  // a dimmer plume layer drifting behind
  float bF = fbm(q2 * 3.4 + vec2(5.1, 2.7) + vec2(0.0, -t * 0.018));
  float dF = clamp(bF * 0.55 + (1.0 - abs(2.0 * bF - 1.0)) * 0.62 - 0.18, 0.0, 1.0);
  float n1 = dN;
  float n2 = fbm(q2 * 4.4 + (w1 - 0.5) * 2.2 + vec2(t * 0.03, 0.0));  // fine inner cloud

  vec3 deep    = vec3(0.16, 0.005, 0.022);
  vec3 maroon  = mix(vec3(0.27, 0.012, 0.04), vec3(0.42, 0.025, 0.05), vital);
  vec3 crimson = mix(vec3(0.40, 0.03, 0.05),  vec3(0.72, 0.06, 0.06), vital);
  vec3 scarlet = mix(vec3(0.52, 0.05, 0.055), vec3(1.02, 0.16, 0.10), vital);

  // clear medium with the far plumes ghosting through it
  vec3 col = mix(deep * 0.65, crimson * 0.55, smoothstep(0.25, 0.85, dF));
  // near plumes: body, fine detail, then sculpted by the light
  vec3 near = mix(maroon, crimson, smoothstep(0.20, 0.62, dN) * (0.6 + 0.4 * smoothstep(0.3, 0.7, n2)));
  near = mix(near, scarlet, smoothstep(0.52, 0.90, dN) * (0.40 + 0.60 * vital));
  near += scarlet * max(lit, 0.0) * (0.40 + 0.50 * vital);   // sunlit curl edges
  near *= 1.0 - 0.32 * max(-lit, 0.0);                       // shadowed undersides
  col = mix(col, near, smoothstep(0.12, 0.58, dN));

  // subtle vein filaments (ridged, follows the warp — organic, connected)
  float ridge = 1.0 - abs(2.0 * fbm(q2 * 3.3 + vec2(3.1, 1.2)) - 1.0);
  float vein  = pow(smoothstep(0.66, 0.985, ridge), 3.0);
  float bleedDark = 1.0 - 0.35 * uBleed;
  col = mix(col, scarlet * 0.85 + vec3(0.10, 0.0, 0.0), vein * (0.18 + 0.14 * vital));
  col *= bleedDark + (1.0 - bleedDark) * 0.4;            // the whole blood darkens as it bleeds out

  // soft warm glints riding the warped field (replaces the gridded shimmer)
  float gl = pow(smoothstep(0.74, 0.97, fbm(q2 * 8.5 + vec2(0.0, -t * 0.35))), 2.0);
  col += gl * vec3(1.0, 0.30, 0.16) * 0.32 * vital;

  col += scarlet * 0.28 * exp(-length(p - vec2(0.0, surf - 0.55)) * 1.6) * (0.3 + 0.7 * vital);

  float dSurf = max(surf - p.y, 0.0);
  col *= mix(0.62, 1.16, exp(-dSurf * 1.1));            // oxygen-rich near the surface

  // ---- status effects ----
  if (uPoison > 0.01){                                   // sickly green blooms
    float pgn = smoothstep(0.48, 0.85, fbm(q2 * 3.1 + vec2(9.7, 4.4)));
    col = mix(col, vec3(0.14, 0.38, 0.05) * (0.55 + 0.7 * n2), pgn * uPoison * 0.75);
    col += vec3(0.25, 0.6, 0.08) * vein * uPoison * 0.25;
  }
  if (uBleed > 0.01){
    // hemorrhage: heavy dark clouds shearing downward through the blood
    float drip = pow(vnoise(vec2(p.x * 14.0 + w1.x * 4.0, p.y * 2.2 + t * 0.9)), 2.0);
    float clot = smoothstep(0.55, 0.9, fbm(q2 * 2.6 + vec2(4.4, t * 0.25)));
    col = mix(col, vec3(0.075, 0.0, 0.012), drip * uBleed * 0.75 * smoothstep(0.0, 0.3, dSurf + 0.08));
    col = mix(col, vec3(0.14, 0.002, 0.02), clot * uBleed * 0.55);
    // wound-bright seams between the clots
    col += vein * vec3(0.85, 0.06, 0.05) * uBleed * 0.35;
  }

  float ringR = fract(uBeat) * 1.25;
  float ring  = exp(-abs(length(p) - ringR) * 16.0) * low * smoothstep(1.3, 0.4, ringR);
  col += ring * vec3(0.85, 0.10, 0.10) * 0.6;

  col *= 1.0 + beat * 0.55;
  col += exp(-dSurf * 14.0) * vec3(0.9, 0.18, 0.15) * (0.3 + 0.55 * beat + 0.25 * vital)
       * (1.0 - smoothstep(0.72, 0.92, surf));
  return col;
}
vec4 lifeSplash(vec2 p, float surf){
  float low = smoothstep(0.45, 0.08, uHP);
  float boost = clamp(low + uFlashL * 0.9, 0.0, 1.0);
  boost *= smoothstep(0.015, 0.12, uResLvlL - uLvlL);
  if (boost < 0.03 || p.y < surf - 0.02) return vec4(0.0);
  boost *= 1.0 - smoothstep(0.68, 0.88, surf);
  if (boost < 0.03) return vec4(0.0);
  float vital = smoothstep(0.12, 0.85, uHP);
  vec3 body = mix(vec3(0.30, 0.012, 0.03), vec3(0.78, 0.07, 0.05), vital);
  vec3 hi   = vec3(1.0, 0.35, 0.25);
  vec4 acc = vec4(0.0);
  float tt = fract(uBeat);

  // teardrop droplets, stretched along their velocity
  for (int i = 0; i < 7; i++){
    float fi   = float(i);
    float seed = floor(uBeat) + fi * 7.31;
    float h1 = hash12(vec2(seed, fi));
    float h2 = hash12(vec2(seed, fi + 9.2));
    float h3 = hash12(vec2(seed, fi + 3.3));
    float lt = max(tt - h3 * 0.22, 0.0);
    float launch = step(0.001, lt)
                 * step(hash12(vec2(seed, fi + 5.5)), 0.40 + 0.60 * boost);
    float vx = (h2 - 0.5) * 0.7;
    float v0 = 0.45 + 0.55 * h1;
    vec2 pos = vec2(h1 * 1.3 - 0.65 + vx * lt, surf + v0 * lt - 1.6 * lt * lt);
    vec2 vel = vec2(vx, v0 - 3.2 * lt);
    float spd = length(vel) + 1e-3;
    vec2 dir = vel / spd;
    vec2 rel = p - pos;
    float along = dot(rel, dir);
    float perp  = dot(rel, vec2(-dir.y, dir.x));
    float wx = 0.013 + 0.012 * h2;
    float wy = wx * (1.5 + 2.2 * spd);
    float taper = mix(1.0, 0.45, smoothstep(0.0, -wy, along));   // tapering tail
    float dd = length(vec2(perp / (wx * taper), along / wy));
    float mB = smoothstep(1.0, 0.72, dd) * launch;               // crisp edge
    float rim = (smoothstep(1.0, 0.85, dd) - smoothstep(0.78, 0.55, dd)) * launch;
    float fade = smoothstep(1.0, 0.72, tt);
    vec3 c = body + hi * rim * 0.9 + hi * 0.3 * smoothstep(0.45, 0.0, dd);
    float a = mB * fade;
    acc.rgb = mix(acc.rgb, c, a * (1.0 - acc.a));
    acc.a = max(acc.a, a);
  }

  // crown rings breaking into arcs at the impact point
  for (int i = 0; i < 2; i++){
    float fi   = float(i);
    float seed = floor(uBeat) + fi * 3.77;
    float sx = hash12(vec2(seed, 2.2 + fi)) * 1.1 - 0.55;
    float rad = 0.05 + tt * 0.42;
    vec2 rel = p - vec2(sx, surf);
    float ringd = abs(length(rel * vec2(1.0, 1.7)) - rad);
    float seg = step(0.32, vnoise(vec2(atan(rel.y, rel.x) * 3.0 + seed * 7.0, rad * 6.0)));
    float ring = smoothstep(0.020, 0.006, ringd) * step(surf - 0.01, p.y)
               * smoothstep(0.85, 0.25, tt) * seg;
    vec3 c = body * 0.8 + hi * 0.5;
    float a = ring * 0.9;
    acc.rgb = mix(acc.rgb, c, a * (1.0 - acc.a));
    acc.a = max(acc.a, a);
  }
  acc.a = clamp(acc.a * boost, 0.0, 1.0);
  return acc;
}

/* ------------------------------ MANA ------------------------------ */
vec3 manaLiquid(vec2 p, float surf, float surfFlat){
  float mp  = uMP;
  float low = smoothstep(0.45, 0.08, mp);
  float t = uTime;

  // conserve detail: the nebula condenses — folding in on itself rather than squashing
  float fold = smoothstep(0.55, -0.05, surfFlat);
  float span = mix(1.88, max(clamp(surfFlat, -0.94, 0.94) + 0.94, 0.06), fold);
  float vy = (p.y + 0.94) / span;
  vec2 pc = mix(p, vec2(p.x, vy * 1.88 - 0.94), 0.40);   // gentle volumetric compaction
  float dens = 1.0 + 0.85 * fold;                         // overall densification, both axes
  vec2 q = pc * vec2(1.1, 1.25) * dens;
  float drift = mix(1.0, 0.55, fold);                     // condensed mass churns slower
  vec2 warp = vec2(fbm(q * 2.0 + vec2(0.0,  t * 0.05 * drift)),
                   fbm(q * 2.0 + vec2(5.2, -t * 0.04 * drift)));
  vec2 cq = q * 2.3 + warp * (1.6 + 1.6 * fold) + vec2(t * 0.028 * drift, 0.0);
  vec2 fc = cq / dens;                                    // fold at constant screen-space wavelength
  cq += vec2(sin(fc.y * 1.7 + warp.y * 3.2), sin(fc.x * 1.5 - warp.x * 3.2)) * 0.34 * fold;
  float bC = fbm(cq);
  float d = clamp(bC * 0.55 + (1.0 - abs(2.0 * bC - 1.0)) * 0.60 - 0.10, 0.0, 1.0); // billowed plumes

  // moon: floats high in the volume, sinks to the surface as mana drains
  float moonY = mix(surfFlat - 0.06, min(surfFlat - 0.42, 0.35), smoothstep(0.10, 0.6, mp));
  vec2 moon = vec2(0.30 * sin(t * 0.05 + 1.7), moonY);
  moon += vec2(sin(t * 0.9) * 0.014 + sin(t * 0.37 + 2.0) * 0.02,
               sin(t * 1.7 + 1.0) * 0.011);                       // wisp wander
  float wisp = 0.55 + 0.45 * fbm(vec2(t * 0.45, 1.3));            // breathing flicker
  vec2 toM = p - moon;
  float dm = length(toM);
  vec2 nM = toM / max(dm, 1e-4);

  float b2 = fbm(cq - nM * 0.10);                        // toward the moon
  float d2 = clamp(b2 * 0.55 + (1.0 - abs(2.0 * b2 - 1.0)) * 0.60 - 0.10, 0.0, 1.0);
  float lining = clamp((d - d2) * 3.0, 0.0, 1.0) * exp(-dm * 1.4);   // silver linings

  float band = pow(abs(sin((d * 5.0 + pc.y * 1.5 + warp.x) * 3.14159)), mix(12.0, 6.0, fold)); // malachite veins

  float dd   = smoothstep(0.18, 0.85, d);                 // occluding cloud mass
  float occl = pow(clamp(1.0 - dd, 0.0, 1.0), 2.4);       // gaps in the cover
  float moonR = 0.085;
  float disc = smoothstep(moonR * 1.45, moonR * 0.45, dm); // soft, ambiguous edge
  float glow = exp(-dm * 3.4) * (0.10 + 0.90 * occl);      // tight, brooding halo
  float peek = disc * (0.10 + 1.1 * occl) * wisp;          // moon? highlight? wisp?

  float ang  = atan(toM.y, toM.x);
  float gate = smoothstep(0.45, 0.75, fbm(vec2(t * 0.05, 3.7)));     // rays come and go
  float rays = pow(clamp(vnoise(vec2(ang * 4.0 + t * 0.10, dm * 1.5 - t * 0.12)), 0.0, 1.0), 3.0)
             * exp(-dm * 1.1) * (1.0 - d * 0.8) * gate;

  vec3 abyss    = vec3(0.006, 0.012, 0.052);
  vec3 indigo   = vec3(0.050, 0.080, 0.31);
  vec3 sapphire = vec3(0.10, 0.28, 0.85);
  vec3 silver   = vec3(0.75, 0.88, 1.05);

  vec3 col = mix(abyss, indigo, smoothstep(0.15, 0.58, d));
  col = mix(col, sapphire, smoothstep(0.50, 0.85, d) * 0.6);
  vec3 mala = mix(vec3(0.03, 0.46, 0.30), vec3(0.07, 0.30, 0.70), 0.5 + 0.5 * sin(d * 9.0));
  col += band * mala * 0.55;
  float band2 = pow(abs(sin((d * 9.0 - pc.y * 2.0 + warp.y) * 3.14159)), mix(22.0, 9.0, fold));
  col += band2 * vec3(0.10, 0.55, 0.38) * 0.30;

  vec3 moonCol = mix(vec3(1.0, 0.60, 0.34), silver, smoothstep(0.12, 0.5, mp)); // warms at moonset
  col += lining * moonCol * 1.7;
  col += glow * moonCol * 0.6 * wisp + peek * moonCol * 1.15;
  col += rays * vec3(0.55, 0.75, 1.1) * 0.65;

  float dSurf = max(surf - p.y, 0.0);
  col *= mix(0.55, 1.0, exp(-dSurf * 0.9));

  // sunset band hugging the surface when low
  float ws = exp(-abs(surf - p.y) * 5.0);
  col = mix(col, vec3(1.0, 0.45, 0.22) * 1.15, ws * low * 0.6);
  col += ws * low * vec3(1.0, 0.30, 0.42) * 0.18;

  // the flash at the surface
  float cyc = t * 0.45;
  float id  = floor(cyc);
  float happen = step(1.0 - clamp(0.18 + 0.65 * low, 0.0, 0.85), hash12(vec2(id, 4.2)));
  float fx = hash12(vec2(id, 9.1)) * 1.3 - 0.65;
  float ft = fract(cyc);
  float spark = exp(-pow((ft - 0.22) * 6.5, 2.0));
  float flash = exp(-pow((p.x - fx) * 9.0, 2.0)) * exp(-abs(p.y - surf) * 25.0) * spark * happen * (0.35 + low);
  col += flash * vec3(0.45, 1.0, 0.75) * 1.7;

  // arcane flash on big spends: the whole nebula ignites, linings flare,
  // and soft luminous filaments bloom beneath the surface
  float fl = uFlashR;
  if (fl > 0.015){
    col *= 1.0 + fl * 0.8;
    col += lining * silver * fl * 2.2;
    col += pow(1.0 - clamp(d, 0.0, 1.0), 3.0) * silver * fl * 0.5;
    float vein = pow(smoothstep(0.60, 0.94, fbm(p * 6.5 + warp * 2.2 + vec2(0.0, t * 0.7))), 2.0);
    float arcband = exp(-abs(p.y - surf + 0.07) * 22.0);
    col += vein * arcband * vec3(0.65, 0.85, 1.2) * fl * 1.8;
  }

  // glitter: sharp anisotropic micro-sparkles drifting with the nebula
  float glit = 0.0;
  for (int i = 0; i < 2; i++){
    float fi = float(i);
    float scl = mix(9.0, 17.0, fi);
    vec2 gm = (q / dens) * scl + warp * 0.35 + vec2(fi * 31.7, -t * (0.22 + fi * 0.16) * drift);
    vec2 cell = floor(gm);
    vec2 md = fract(gm) - 0.5
            - vec2(hash12(cell) - 0.5, hash12(cell + 7.7) - 0.5) * 0.6;
    float sel = step(0.84 - 0.09 * fold, hash12(cell + 1.3));
    float tw = pow(0.5 + 0.5 * sin(t * (1.5 + 3.5 * hash12(cell + 5.1))
                 + hash12(cell + 3.1) * 6.2831), 14.0);            // hard glints
    float pt = exp(-dot(md, md) * (220.0 + 160.0 * fi));
    float cross = exp(-abs(md.x) * 70.0) * exp(-abs(md.y) * 16.0)
                + exp(-abs(md.y) * 70.0) * exp(-abs(md.x) * 16.0); // star flare
    glit += (pt * 1.1 + cross * 0.7 * tw) * sel * tw;
  }
  col += glit * mix(silver, vec3(0.6, 0.95, 1.1), 0.4) * 1.1;
  return col;
}

/* --------------------------- ORB COMPOSITE ------------------------ */
vec3 orbContent(vec2 p, bool life, vec3 empty, float thick, vec3 stoneTex){
  float t = uTime;
  float lvl   = life ? uLvlL  : uLvlR;
  float slosh = life ? uSloshL : uSloshR;
  float res   = life ? uHP : uMP;
  float capLvl = life ? uResLvlL : uResLvlR;
  float capDamp = smoothstep(0.015, 0.12, capLvl - lvl);  // pinned flat against the stone
  float low   = smoothstep(0.5, 0.1, res);
  float beat  = beatEnv(uBeat) * (life ? low : 0.0);

  // animated surface
  float amp = life
    ? mix(0.006, 0.040, low) * (1.0 + beat * 1.3)
    : mix(0.008, 0.022, low);
  amp *= mix(0.10, 1.0, capDamp);
  float wob = amp * (0.6 * sin(p.x * 5.0 - t * 2.2) + 0.4 * sin(p.x * 9.3 + t * 3.7));
  if (!life) wob = amp * (0.6 * sin(p.x * 3.6 - t * 1.1) + 0.4 * sin(p.x * 7.1 + t * 1.9));
  float surf = lvl + wob + slosh * capDamp * (p.x * 0.85 + 0.3 * sin(p.x * 6.0 + t * 9.0));

  vec3 liqAvg = life
    ? mix(vec3(0.30, 0.02, 0.03), vec3(0.95, 0.13, 0.10), smoothstep(0.12, 0.85, res)) * (1.0 + beat * 0.4)
    : mix(vec3(0.20, 0.10, 0.05), vec3(0.16, 0.36, 1.00), smoothstep(0.10, 0.6, res));
  if (life){
    liqAvg = mix(liqAvg, vec3(0.22, 0.50, 0.08), uPoison * 0.55);
    liqAvg *= 1.0 - 0.35 * uBleed;
  }

  float rr = length(p);

  // real empty glass from the plate, washed by the liquid's glow
  vec3 col = empty;
  float wall = smoothstep(0.55, 0.95, rr);
  col += liqAvg * wall * exp(-max(p.y - surf, 0.0) * 2.2) * 0.22 * (0.25 + res);
  col += liqAvg * exp(-max(p.y - surf, 0.0) * 4.0) * 0.10 * res;
  if (!life) col += vec3(1.0, 0.45, 0.25) * exp(-abs(p.y - surf) * 3.5) * low * 0.18
                  + vec3(0.6, 0.8, 1.15) * exp(-max(p.y - surf, 0.0) * 2.5) * uFlashR * 0.6;

  // liquid body, clipped to inner sphere
  float inner = smoothstep(INNER + 0.01, INNER - 0.01, rr);
  float fullKick = life ? uFullL : uFullR;
  float inLiq = smoothstep(0.004, -0.004, p.y - surf) * inner;
  if (inLiq > 0.0){
    vec3 lc = life ? lifeLiquid(p, surf, lvl) : manaLiquid(p, surf, lvl);
    float vital = smoothstep(0.12, 0.85, res);
    lc *= life ? (1.0 + thick * (0.30 * vital - 0.15 * low))
               : (0.84 + 0.34 * thick);
    // topping out: the surface energy dissolves into a gentle whole-orb bloom
    lc *= 1.0 + fullKick * 0.45;
    lc += liqAvg * fullKick * 0.30;
    col = mix(col, lc, inLiq * 0.97);
    // the plate's glass reflections read over the liquid (top only —
    // the pedestal seen through the bottom of the glass stays hidden)
    col += empty * empty * 0.65 * (0.12 + 0.88 * smoothstep(-0.70, -0.05, p.y));
  }

  // anime splash above the surface (low hp, or kicked by big hits)
  if (life){
    vec4 spl = lifeSplash(p, surf);
    col = mix(col, spl.rgb, clamp(spl.a, 0.0, 1.0) * inner);
  }

  // meniscus: front line + dimmer back ellipse edge
  float chord = sqrt(max(1.0 - lvl * lvl, 0.02));
  float inSpan = smoothstep(chord + 0.03, chord - 0.02, abs(p.x));
  float men = exp(-abs(p.y - surf) * 55.0) * inSpan;
  vec3 menCol = life ? vec3(1.0, 0.30, 0.22) : vec3(0.55, 0.85, 1.1);
  float domeFade = 1.0 - smoothstep(0.72, 0.92, lvl);
  col += men * (0.7 + 0.6 * beat) * menCol * (0.45 + 0.55 * res + 0.4 * low) * domeFade;
  col += liqAvg * fullKick * 0.12;

  // ---- reservation: everything above the line is the petrified orb plate ----
  float resAmt = life ? uResL : uResR;
  float resLvl = life ? uResLvlL : uResLvlR;
  if (resAmt > 0.005 && p.y > resLvl - 0.25){
    // the stone is a sphere: its underside bows down toward the middle
    float chordR = sqrt(max(1.0 - resLvl * resLvl, 0.05));
    float midW = 1.0 - clamp(p.x * p.x / (chordR * chordR), 0.0, 1.0);
    float edgeY = resLvl;
    float dEdge = p.y - edgeY;

    // soft contact shadow cast onto the glass/liquid beneath the belly
    col *= 1.0 - 0.24 * exp(-max(-dEdge, 0.0) * 11.0) * (0.4 + 0.6 * midW) * inner;

    vec3 stCol = stoneTex + liqAvg * 0.05;
    // underside falling into shadow as it curves away from the light
    stCol *= 1.0 - 0.42 * exp(-max(dEdge, 0.0) * 11.0) * (0.40 + 0.60 * midW);
    stCol *= 1.0 - 0.15 * exp(-max(dEdge, 0.0) * 3.8) * midW;
    // thin caught-light rim tracing the curved seam
    stCol += vec3(0.32, 0.285, 0.215) * exp(-abs(dEdge) * 95.0) * 0.55;
    col = mix(col, stCol, smoothstep(-0.011, 0.011, dEdge) * inner);
  }

  // ---- bleed: rivulets running down the inside of the empty glass ----
  if (life && uBleed > 0.01 && p.y > surf){
    float colId = floor(p.x * 13.0 + 31.0);
    float colSel = step(0.55, hash12(vec2(colId, 3.7)));
    float head = fract(hash12(vec2(colId, 8.1)) + uTime * (0.05 + 0.08 * hash12(vec2(colId, 5.5))));
    float headY = mix(0.95, surf, head);
    float trail = smoothstep(headY + 0.35, headY, p.y) * step(headY, p.y);
    float lineD = abs(fract(p.x * 13.0 + 31.0) - 0.5);
    float riv = smoothstep(0.10, 0.03, lineD) * colSel * trail * smoothstep(1.0, 0.92, rr);
    float bead = exp(-(pow((p.y - headY) * 30.0, 2.0) + pow(lineD * 26.0, 2.0))) * colSel;
    col = mix(col, vec3(0.16, 0.005, 0.02), clamp(riv * 0.8 + bead, 0.0, 1.0) * uBleed * inner);
    col += vec3(0.5, 0.04, 0.04) * bead * uBleed * 0.5;
  }

  // soft fresnel of the liquid glow on the rim (the plate carries the real glass)
  float rim = pow(smoothstep(0.55, 1.0, rr), 4.0);
  col += rim * liqAvg * 0.30;

  return col;
}

void main(){
  vec2 uv = uViewOrigin + (gl_FragCoord.xy / uRes) * uViewSize;
  float m  = texture(uMask, uv).r;
  vec2 px = uv * ART;
  vec2 pL = (px - ORBL.xy) / ORBL.z;
  vec2 pR = (px - ORBR.xy) / ORBR.z;
  float rL = length(pL);
  float rR = length(pR);
  float aL = m * smoothstep(1.015, 0.995, rL);
  float aR = m * smoothstep(1.015, 0.995, rR);
  // The JPEG underneath owns every static pixel. Reject the crop's empty
  // corners and center gap before any procedural noise or relighting work.
  if (max(aL, aR) <= 0.001) discard;

  vec3 art = texture(uArt, uv).rgb;
  vec3 empty = texture(uEmpty, uv).rgb;
  vec2 pack = texture(uPack, uv).rg;
  float thick = smoothstep(0.40, 0.98, pack.r);
  float ao = 0.30 + 0.70 * pack.g;

  // material from the roughness plate: low = skin, high = cloth/hair/pedestal
  float stoneM = smoothstep(0.05, 0.22, luma(art));
  float clothy = smoothstep(0.16, 0.52, pack.g);
  art *= mix(1.0, mix(0.82, 1.07, clothy), stoneM);  // skin darker, marble drapery lighter

  // light spill onto statues, pedestals, floor
  float beat = beatEnv(uBeat) * smoothstep(0.5, 0.1, uHP);
  vec3 avgL = mix(vec3(0.30, 0.02, 0.03), vec3(0.95, 0.13, 0.10), smoothstep(0.12, 0.85, uHP)) * (1.0 + beat * 0.5);
  avgL = mix(avgL, vec3(0.22, 0.50, 0.08), uPoison * 0.55);
  avgL *= 1.0 - 0.35 * uBleed;
  vec3 avgR = mix(vec3(0.20, 0.10, 0.05), vec3(0.16, 0.36, 1.00), smoothstep(0.10, 0.6, uMP));
  float lit = 0.3 + 0.7 * luma(art);
  vec3 spill = vec3(0.0);
  spill += avgL * exp(-max(rL - 1.0, 0.0) * 2.6) * (0.10 + 0.3 * uHP) * (1.0 + smoothstep(0.0, -0.6, pL.y) * 0.7);
  spill += avgR * exp(-max(rR - 1.0, 0.0) * 2.6) * (0.10 + 0.3 * uMP) * (1.0 + smoothstep(0.0, -0.6, pR.y) * 0.7);
  vec3 base = art + spill * lit;

  // normal-mapped relighting of the stone
  float stone = stoneM * (1.0 - max(smoothstep(1.03, 0.99, rL), smoothstep(1.03, 0.99, rR)) * m);
  if (stone > 0.001){
    vec3 nrm = normalize(texture(uNorm, uv).rgb * 2.0 - 1.0);
    float inOrb = max(smoothstep(1.02, 0.98, rL), smoothstep(1.02, 0.98, rR));
    nrm = normalize(mix(nrm, vec3(0.0, 0.0, 1.0), inOrb * 0.8));   // hands over glass: soften

    // point light per orb (in front of the glass)
    vec3 fragP = vec3(px, 0.0);
    vec3 lp1 = vec3(ORBL.x, ORBL.y + clamp(uLvlL, -0.94, 0.94) * ORBL.z * 0.65, 170.0);
    vec3 lp2 = vec3(ORBR.x, ORBR.y + clamp(uLvlR, -0.94, 0.94) * ORBR.z * 0.65, 170.0);
    vec3 l1 = normalize(lp1 - fragP);
    vec3 l2 = normalize(lp2 - fragP);
    float fall1 = exp(-max(rL - 1.0, 0.0) * 1.7);
    float fall2 = exp(-max(rR - 1.0, 0.0) * 1.7);
    float i1 = (0.25 + 0.95 * uHP) * (1.0 + beat * 1.6) + uFlashL * 2.6 + uFullL * 1.8;
    float i2 = (0.30 + 0.85 * uMP) + uFlashR * 2.6 + uFullR * 1.8;

    vec3 dl = (avgL * max(dot(nrm, l1), 0.0) * fall1 * i1
             + avgR * max(dot(nrm, l2), 0.0) * fall2 * i2) * ao;

    vec3 V = vec3(0.0, 0.0, 1.0);
    vec3 h1 = normalize(l1 + V);
    vec3 h2 = normalize(l2 + V);
    float shin  = mix(64.0, 14.0, clothy);   // skin: tight polished glints
    float gloss = mix(1.30, 0.50, clothy);   // cloth: subdued, matte
    float s1 = pow(max(dot(nrm, h1), 0.0), shin) * fall1 * (0.55 * i1) * gloss;
    float s2 = pow(max(dot(nrm, h2), 0.0), shin) * fall2 * (0.55 * i2) * gloss;
    vec3 spc = ((avgL * 0.5 + vec3(0.5)) * s1 + (avgR * 0.5 + vec3(0.5)) * s2) * ao;

    // slow travelling sheen: tight on polished skin, broad and soft on rough marble
    vec3 sd = normalize(vec3(cos(uTime * 0.22), 0.45 + 0.25 * sin(uTime * 0.13), 0.62));
    float sheenPow = mix(9.0, 4.0, clothy);
    float sheen = pow(max(dot(nrm, sd), 0.0), sheenPow)
                * (0.16 + 0.10 * sin(uTime * 0.22 + px.x * 0.004)) * ao
                * mix(1.0, 1.25, clothy);
    vec3 shc = mix(vec3(0.85, 0.9, 1.0), vec3(1.0, 0.88, 0.66), clothy) * sheen;

    base += (dl * (0.45 + 0.55 * luma(art)) + spc + shc) * stone;
  }

  vec3 col = base;
  vec3 stoneTex = texture(uStone, uv).rgb;
  if (aL > 0.001) col = mix(col, orbContent(pL, true,  empty, thick, stoneTex), aL);
  if (aR > 0.001) col = mix(col, orbContent(pR, false, empty, thick, stoneTex), aR);

  // gentle tone + grain
  col = col / (1.0 + col * 0.10);
  col += (hash12(gl_FragCoord.xy + fract(uTime)) - 0.5) * 0.012;

  outColor = vec4(col, 1.0);
}

const HP_MAX = 1000, MP_MAX = 800;
const ART_SIZE = { w: 1672, h: 941 };
// Only this art-space rectangle contains pixels the shader may change. The
// full-resolution JPEG remains the stage background, so statues and frame art
// stay crisp while the procedural overlay does a fraction of the old work.
const ORB_VIEW = { x0: 270, y0: 210, x1: 1400, y1: 755 };

/* ============================ STATE =========================== */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const S = {
  hp: 1, mp: 1, hpD: 1, mpD: 1,
  sloshL: {a:0, v:0}, sloshR: {a:0, v:0},
  flashL: 0, flashR: 0,
  fullL: 0, fullR: 0, prevHpD: 1, prevMpD: 1,
  beat: 0,
  hpRegen: false, mpRegen: true,
  channeling: false, boss: false, showVals: true,
  oct: 5, resScale: 1.0, dprCap: 2.0, fpsCap: reduced ? 12 : 60,
  time: 0,
  /* statuses */
  poison: 0,
  bleedT: [],          // expiry times, one per stack
  resL: 0, resR: 0,
};

function clamp01(x){ return Math.min(1, Math.max(0, x)); }
function smoothstep(a,b,x){ const t = clamp01((x-a)/(b-a)); return t*t*(3-2*t); }

function hpCap(){ return 1 - S.resL; }
function mpCap(){ return 1 - S.resR; }

function setHP(v, kick){
  v = Math.min(hpCap(), clamp01(v));
  const d = v - S.hp;
  S.hp = v;
  if (kick !== false){
    S.sloshL.v += -d * (d < 0 ? 9 : 5);
    if (Math.abs(d) > 0.08) S.flashL = Math.min(1.4, S.flashL + Math.abs(d) * 2.2);
  }
  sync();
}
function setMP(v, kick){
  v = Math.min(mpCap(), clamp01(v));
  const d = v - S.mp;
  S.mp = v;
  if (kick !== false){
    S.sloshR.v += -d * (d < 0 ? 8 : 5);
    if (Math.abs(d) > 0.08) S.flashR = Math.min(1.8, S.flashR + Math.abs(d) * 3.2);
  }
  sync();
}

const HP_FLOOR = 0.02;   // the demo never quite kills you
function takeDamage(x){ setHP(Math.max(S.hp - x, Math.min(S.hp, HP_FLOOR))); }
function castSpell(x){ setMP(S.mp - x); }
const BLEED_DURATION = 8;
function addBleed(){ if (S.bleedT.length < 9) S.bleedT.push(S.time + BLEED_DURATION); }

/* fill -> surface height: volume-true mid-range, constant-speed at the poles */
function levelFromFill(f){
  f = clamp01(f);
  const fc = Math.min(0.9995, Math.max(0.0005, f));
  let h = 2*fc - 1;
  for (let i = 0; i < 6; i++){
    const V = (2 + 3*h - h*h*h) / 4;
    const dV = Math.max((3 - 3*h*h) / 4, 1e-3);
    h -= (V - fc) / dV;
    h = Math.min(1, Math.max(-1, h));
  }
  const vol = h * 0.94;
  const lin = (2 * f - 1) * 1.045;
  const w = smoothstep(0.70, 0.95, f) + smoothstep(0.30, 0.05, f);
  return vol * (1 - w) + lin * w;
}

/* ============================ UI ============================== */
const $ = id => document.getElementById(id);
const hpSlider = $('hpSlider'), mpSlider = $('mpSlider');
const sliderCache = { hpValue: null, mpValue: null, hpBackground: '', mpBackground: '' };

function sync(){
  const hpValue = Math.round(S.hp * HP_MAX), mpValue = Math.round(S.mp * MP_MAX);
  if (sliderCache.hpValue !== hpValue) { sliderCache.hpValue = hpValue; hpSlider.value = hpValue; }
  if (sliderCache.mpValue !== mpValue) { sliderCache.mpValue = mpValue; mpSlider.value = mpValue; }
  const hc = (S.hp*100).toFixed(1), mc = (S.mp*100).toFixed(1);
  const hpBackground = `linear-gradient(90deg, var(--life) ${hc}%, #241e15 ${hc}%)`;
  const mpBackground = `linear-gradient(90deg, var(--mana) ${mc}%, #241e15 ${mc}%)`;
  if (sliderCache.hpBackground !== hpBackground) { sliderCache.hpBackground = hpBackground; hpSlider.style.background = hpBackground; }
  if (sliderCache.mpBackground !== mpBackground) { sliderCache.mpBackground = mpBackground; mpSlider.style.background = mpBackground; }
}
function setText(el, value){
  const next = String(value);
  if (el.textContent !== next) el.textContent = next;
}
function toggleClass(el, name, on){
  const next = !!on;
  if (el.classList.contains(name) !== next) el.classList.toggle(name, next);
}
const readout = {
  hpVal: $('hpVal'), mpVal: $('mpVal'), hpLab: $('hpLab'), mpLab: $('mpLab'),
  hpBar: $('hpBar'), mpBar: $('mpBar'), chipPoison: $('chipPoison'),
  poisonPct: $('poisonPct'), chipBleed: $('chipBleed'), bleedN: $('bleedN'),
  resLineL: $('resLineL'), resPctL: $('resPctL'), resLineR: $('resLineR'), resPctR: $('resPctR')
};
function syncReadouts(){
  setText(readout.hpVal, Math.round(S.hpD * HP_MAX));
  setText(readout.mpVal, Math.round(S.mpD * MP_MAX));
  setText(readout.hpLab, `${Math.round(S.hp*HP_MAX)} / ${HP_MAX}`);
  setText(readout.mpLab, `${Math.round(S.mp*MP_MAX)} / ${MP_MAX}`);
  const hpTransform = `scaleX(${S.hpD.toFixed(3)})`;
  const mpTransform = `scaleX(${S.mpD.toFixed(3)})`;
  if (readout.hpBar.style.transform !== hpTransform) readout.hpBar.style.transform = hpTransform;
  if (readout.mpBar.style.transform !== mpTransform) readout.mpBar.style.transform = mpTransform;
  toggleClass(readout.chipPoison, 'on', S.poison > 0.005);
  setText(readout.poisonPct, Math.ceil(S.poison * 100) + '%');
  toggleClass(readout.chipBleed, 'on', S.bleedT.length > 0);
  setText(readout.bleedN, '×' + S.bleedT.length);
  toggleClass(readout.resLineL, 'on', S.resL > 0.005);
  setText(readout.resPctL, Math.round(S.resL*100) + '%');
  toggleClass(readout.resLineR, 'on', S.resR > 0.005);
  setText(readout.resPctR, Math.round(S.resR*100) + '%');
}

hpSlider.addEventListener('input', () => setHP(hpSlider.value / HP_MAX, false));
mpSlider.addEventListener('input', () => setMP(mpSlider.value / MP_MAX, false));

$('btnHit').onclick    = () => takeDamage(0.15);

$('btnPoison').onclick = () => { S.poison = 1; };

function toggle(btn, get, set){
  btn.onclick = () => { set(!get()); btn.setAttribute('aria-pressed', String(get())); };

function wireRes(slider, lab, set){
  slider.addEventListener('input', () => {
    const v = slider.value / 100;
    set(v);
    lab.textContent = slider.value + '%';
    slider.style.setProperty('--rp', slider.value + '%');
  });
}

    document.querySelectorAll('[data-q]').forEach(x => x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    const [oct, scale, dprCap, fpsCap] = QUAL[b.dataset.q];
    S.oct = oct; S.resScale = scale; S.dprCap = dprCap;
    S.fpsCap = reduced ? Math.min(12, fpsCap) : fpsCap;
    lastDraw = performance.now() - 1000;
    resize();
  };
});

addEventListener('keydown', e => {
  if (e.repeat && e.key.toLowerCase() !== 'e') return;
  switch (e.key === ' ' ? 'space' : e.key.toLowerCase()){
    case '1': takeDamage(0.15); break;
    case '2': takeDamage(0.40); break;
    case '3': $('btnPotion').click(); break;
    case '4': S.poison = 1; break;
    case '5': addBleed(); break;
    case 'q': castSpell(0.12); break;
    case 'w': setMP(S.mp + 0.40); break;
    case 'e': S.channeling = true; break;
    case 'r': $('btnRestore').click(); break;
    case 'space': e.preventDefault(); $('btnBoss').click(); break;
  }
});
addEventListener('keyup', e => { if (e.key.toLowerCase() === 'e') S.channeling = false; });

/* ============================ WEBGL =========================== */
const canvas = $('gl');
const stage = document.querySelector('.stage');
stage.style.backgroundImage = `url(data:image/jpeg;base64,${ART_B64})`;
stage.style.backgroundSize = '100% 100%';
stage.style.backgroundRepeat = 'no-repeat';
canvas.style.left = `${ORB_VIEW.x0 / ART_SIZE.w * 100}%`;
canvas.style.bottom = `${ORB_VIEW.y0 / ART_SIZE.h * 100}%`;
canvas.style.width = `${(ORB_VIEW.x1 - ORB_VIEW.x0) / ART_SIZE.w * 100}%`;
canvas.style.height = `${(ORB_VIEW.y1 - ORB_VIEW.y0) / ART_SIZE.h * 100}%`;
const gl = canvas.getContext('webgl2', { antialias:false, alpha:true, premultipliedAlpha:true, powerPreference:'high-performance' });
if (!gl){
  document.querySelector('.stage').innerHTML =
    '<div style="display:grid;place-items:center;height:100%;color:#9a9183;font-family:var(--mono);font-size:12px;letter-spacing:.2em">WEBGL2 IS REQUIRED — ENABLE HARDWARE ACCELERATION AND RELOAD</div>';
  throw new Error('no webgl2');
}

function shader(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const VS = `#version 300 es
layout(location=0) in vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent.trim()));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const U = {};
['uArt','uMask','uNorm','uEmpty','uPack','uStone','uRes','uViewOrigin','uViewSize','uTime','uHP','uMP','uLvlL','uLvlR',
 'uSloshL','uSloshR','uBeat','uOct','uFlashL','uFlashR','uFullL','uFullR',
 'uPoison','uBleed','uResL','uResR','uResLvlL','uResLvlR']
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));

function makeTex(img){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function loadImg(b64, mime){
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = rej;
    im.src = `data:${mime};base64,${b64}`;
  });
}

function resize(){
  const r = canvas.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1, S.dprCap || 2) * S.resScale;
  const w = Math.max(2, Math.round(r.width * dpr));
  const h = Math.max(2, Math.round(r.height * dpr));
  if (canvas.width !== w || canvas.height !== h){
    canvas.width = w; canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
}
addEventListener('resize', resize);

/* ============================ LOOP ============================ */
let last = performance.now(), lastDraw = -1000, fpsE = S.fpsCap, fpsTick = 0;
const fpsEl = $('fps');
const motion = reduced ? 0.45 : 1.0;

function frame(now){
  requestAnimationFrame(frame);
  if (document.hidden) { last = now; return; }
  const drawInterval = 1000 / S.fpsCap;
  const drawElapsed = now - lastDraw;
  if (drawElapsed < drawInterval) return;
  lastDraw = now - (drawElapsed % drawInterval);
  let dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  fpsE = fpsE * 0.95 + (1/Math.max(dt,1e-3)) * 0.05;
  if ((fpsTick += dt) > 0.4){ fpsTick = 0; fpsEl.textContent = Math.round(fpsE) + ' FPS'; }

  /* sim */
  S.time += dt * motion;
  if (S.hpRegen) setHP(S.hp + dt * 0.030, false);
  if (S.mpRegen) setMP(S.mp + dt * 0.022, false);
  if (S.channeling) castSpell(dt * 0.22);

  /* ailment ticks */
  if (S.poison > 0.001){
    S.poison = Math.max(0, S.poison - dt / 14);
    setHP(Math.max(S.hp - dt * 0.014 * Math.min(1, S.poison * 3), Math.min(S.hp, HP_FLOOR)), false);
  }
  if (S.bleedT.length){
    S.bleedT = S.bleedT.filter(tm => tm > S.time);   // each stack wears off on its own
    if (S.bleedT.length) setHP(Math.max(S.hp - dt * 0.007 * S.bleedT.length, Math.min(S.hp, HP_FLOOR)), false);
  }

  if (S.boss){
    bossT -= dt;
    if (bossT <= 0){
      const roll = Math.random();
      if (S.hp < 0.20 && Math.random() < 0.5) $('btnPotion').click();
      else if (roll < 0.08) addBleed();
      else if (roll < 0.11 && S.poison < 0.25) S.poison = 1;
      else if (roll < 0.55) takeDamage(0.05 + Math.random() * 0.14);
      else if (roll < 0.9){
        if (S.mp > 0.10) castSpell(0.06 + Math.random() * 0.08);
        else setMP(S.mp + 0.45);
      } else takeDamage(0.30);
      bossT = 0.35 + Math.random() * 0.9;
    }
  }

  /* smoothing & springs */
  const k = 1 - Math.exp(-dt * 5);
  S.hpD += (S.hp - S.hpD) * k;
  S.mpD += (S.mp - S.mpD) * k;
  for (const s of [S.sloshL, S.sloshR]){
    s.v += (-110 * s.a - 7.5 * s.v) * dt;
    s.a += s.v * dt;
    s.a = Math.max(-0.2, Math.min(0.2, s.a));
  }
  S.flashL *= Math.exp(-dt * 3.2);
  S.flashR *= Math.exp(-dt * 3.2);

  /* gentle bloom the moment the surface slips out of sight at the dome */
  const lvlL = levelFromFill(S.hpD), lvlR = levelFromFill(S.mpD);
  if (lvlL >= 0.95 && S.prevHpD < 0.95) S.fullL = 1;
  if (lvlR >= 0.95 && S.prevMpD < 0.95) S.fullR = 1;
  S.prevHpD = lvlL; S.prevMpD = lvlR;
  S.fullL *= Math.exp(-dt * 1.6);
  S.fullR *= Math.exp(-dt * 1.6);

  /* heartbeat: quickens as life drains */
  const bpm = 42 + 126 * smoothstep(0.55, 0.06, S.hpD);
  S.beat += dt * motion * bpm / 60;

  syncReadouts();

  /* draw */
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform2f(U.uViewOrigin, ORB_VIEW.x0 / ART_SIZE.w, ORB_VIEW.y0 / ART_SIZE.h);
  gl.uniform2f(U.uViewSize, (ORB_VIEW.x1 - ORB_VIEW.x0) / ART_SIZE.w, (ORB_VIEW.y1 - ORB_VIEW.y0) / ART_SIZE.h);
  gl.uniform1f(U.uTime, S.time);
  gl.uniform1f(U.uHP, S.hpD);
  gl.uniform1f(U.uMP, S.mpD);
  gl.uniform1f(U.uLvlL, lvlL);
  gl.uniform1f(U.uLvlR, lvlR);
  gl.uniform1f(U.uSloshL, S.sloshL.a);
  gl.uniform1f(U.uSloshR, S.sloshR.a);
  gl.uniform1f(U.uBeat, S.beat);
  gl.uniform1i(U.uOct, S.oct);
  gl.uniform1f(U.uFlashL, S.flashL);
  gl.uniform1f(U.uFlashR, S.flashR);
  gl.uniform1f(U.uFullL, S.fullL);
  gl.uniform1f(U.uFullR, S.fullR);
  gl.uniform1f(U.uPoison, S.poison);
  gl.uniform1f(U.uBleed, Math.min(1, S.bleedT.length / 4));
  gl.uniform1f(U.uResL, S.resL);
  gl.uniform1f(U.uResR, S.resR);
  gl.uniform1f(U.uResLvlL, S.resL > 0.003 ? levelFromFill(1 - S.resL) : 2.0);
  gl.uniform1f(U.uResLvlR, S.resR > 0.003 ? levelFromFill(1 - S.resR) : 2.0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

Promise.all([loadImg(ART_B64, 'image/jpeg'), loadImg(MASK_B64, 'image/png'), loadImg(NORM_B64, 'image/jpeg'),
             loadImg(EMPTY_B64, 'image/jpeg'), loadImg(PACK_B64, 'image/jpeg'), loadImg(STONE_B64, 'image/jpeg')]).then(([a, m, n, e, p, st]) => {
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, makeTex(a));
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, makeTex(m));
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, makeTex(n));
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, makeTex(e));
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, makeTex(p));
  gl.activeTexture(gl.TEXTURE5); gl.bindTexture(gl.TEXTURE_2D, makeTex(st));
  gl.uniform1i(U.uArt, 0);
  gl.uniform1i(U.uMask, 1);
  gl.uniform1i(U.uNorm, 2);
  gl.uniform1i(U.uEmpty, 3);
  gl.uniform1i(U.uPack, 4);
  gl.uniform1i(U.uStone, 5);
  sync(); syncReadouts(); resize();
  requestAnimationFrame(t => { last = t; frame(t); });
});
window.__WizardOrbs = { S, setHP, setMP, takeDamage, addBleed, HP_MAX, MP_MAX };
</script>
<script src="../../shared/wizard-lab.js"></script>
<script src="../../shared/wizard-annotations.js"></script>
<script src="wizard-adapter.js"></script>
</body>

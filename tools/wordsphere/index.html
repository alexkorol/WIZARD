<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordSphere - WIZARD</title>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.22.17/babel.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #1a1a1a;
            color: white;
        }
        
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s;
            z-index: 1000;
        }

        .back-button:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .error-boundary {
            padding: 20px;
            color: #ff4444;
            background: rgba(255, 0, 0, 0.1);
            border-radius: 8px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <a href="../../index.html" class="back-button">Back to Dashboard</a>
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">
        // Error Boundary Component
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div className="error-boundary">
                            <h2>Something went wrong.</h2>
                            <pre>{this.state.error?.toString()}</pre>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // Wrap the WordSphere component with ErrorBoundary
        ReactDOM.render(
            <ErrorBoundary>
                <WordSphere />
            </ErrorBoundary>,
            document.getElementById('root')
        );
    </script>
    <script type="text/babel" data-presets="react" src="wordsphere.js"></script>
</body>
</html>

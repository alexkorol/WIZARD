<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WordSphere | WIZARD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080a12;
      --panel: #0f1322;
      --panel-2: #0a0d18;
      --accent: #7cd6ff;
      --accent-2: #a06bff;
      --text: #e5ecf5;
      --muted: #93a3ba;
      --border: rgba(255, 255, 255, 0.08);
      --slot: 56px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(124, 214, 255, 0.12), transparent 28%),
                  radial-gradient(circle at 80% 0%, rgba(160, 107, 255, 0.14), transparent 25%),
                  linear-gradient(180deg, #05070f 0%, #080a12 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 28px 18px 48px;
    }
    .app { max-width: 1200px; margin: 0 auto; display: grid; gap: 18px; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-end; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 32px); letter-spacing: 1px; }
    .lede { margin: 2px 0 0; color: var(--muted); max-width: 720px; line-height: 1.5; }
    .badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.04); color: var(--accent); font-weight: 600; letter-spacing: 0.4px; }
    .layout { display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
    .card {
      background: linear-gradient(160deg, var(--panel) 0%, var(--panel-2) 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.03);
    }
    .card h3 { margin: 0 0 8px; font-size: 14px; letter-spacing: 0.7px; color: var(--muted); text-transform: uppercase; }
    #sphere-container {
      position: relative;
      width: 100%;
      min-height: 520px;
      border-radius: 18px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.06), rgba(0,0,0,0.65)),
                  linear-gradient(180deg, rgba(124,214,255,0.08), rgba(10,13,24,0.95));
      border: 1px solid rgba(124, 214, 255, 0.15);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), 0 20px 40px rgba(0,0,0,0.45);
    }
    .word {
      position: absolute;
      left: 0;
      top: 0;
      color: var(--text);
      font-weight: 600;
      pointer-events: auto;
      white-space: nowrap;
      text-shadow: 0 4px 16px rgba(0,0,0,0.45);
      transition: color 0.2s;
    }
    .word:hover { color: #fff; }
    .controls { display: grid; gap: 12px; }
    .control-group { display: grid; gap: 6px; }
    label { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }
    input[type="range"] { width: 100%; }
    textarea {
      width: 100%;
      min-height: 140px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--text);
      resize: vertical;
      font-family: inherit;
    }
    .btn {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
    }
    .btn:hover { transform: translateY(-1px); border-color: rgba(124,214,255,0.5); box-shadow: 0 12px 26px rgba(0,0,0,0.35); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); font-size: 13px; }
    @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } #sphere-container { min-height: 420px; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <p class="badge">Spin · Drag · Edit Words · Adjust Speed</p>
        <h1>WordSphere</h1>
        <p class="lede">Single, consolidated sphere renderer with decoupled UI. Type words, drag to orbit, tweak spin and perspective.</p>
      </div>
    </header>

    <div class="layout">
      <div class="card">
        <h3>Sphere</h3>
        <div id="sphere-container"></div>
      </div>

      <div class="card controls">
        <h3>Controls</h3>
        <div class="control-group">
          <label for="speed">Spin speed <span id="speedValue">1.0</span></label>
          <input type="range" id="speed" min="0" max="3" step="0.05" value="1">
        </div>
        <div class="control-group">
          <label for="radius">Radius scale <span id="radiusValue">1.0</span></label>
          <input type="range" id="radius" min="0.6" max="1.4" step="0.05" value="1">
        </div>
        <div class="control-group">
          <label for="words">Words (one per line)</label>
          <textarea id="words"></textarea>
        </div>
        <div class="row">
          <button class="btn" id="apply">Apply Words</button>
          <button class="btn" id="random">Randomize Sample</button>
          <button class="btn" id="reset">Reset View</button>
        </div>
        <div class="row">
          <span class="pill"><input type="checkbox" id="autospin" checked style="accent-color: #7cd6ff;"> Auto spin</span>
          <span class="pill"><input type="checkbox" id="hoverpause" checked style="accent-color: #7cd6ff;"> Pause on hover</span>
        </div>
      </div>
    </div>
  </div>

  <script src="./main.js" type="module"></script>
</body>
</html>

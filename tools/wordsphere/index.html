<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WordSphere — WIZARD</title>
  <meta name="description" content="WordSphere — an interactive 3D spherical word visualization. Type words, drag to orbit, tweak spin and perspective. Part of the WIZARD collection.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0c0a;
      --panel: #100f0c;
      --text: #e9e4d8;
      --muted: #9c9587;
      --gold: #c9a227;
      --border: rgba(233, 228, 216, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Source Sans 3', system-ui, sans-serif;
      background: radial-gradient(circle at 50% -10%, rgba(201, 162, 39, 0.05), transparent 45%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 28px 18px 48px;
    }
    .app { max-width: 1200px; margin: 0 auto; display: grid; gap: 18px; }
    .back {
      display: inline-block;
      color: var(--muted);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: color 0.15s;
    }
    .back:hover { color: var(--gold); }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-end; }
    h1 {
      margin: 4px 0 0;
      font-family: 'Cinzel', serif;
      font-weight: 600;
      font-size: clamp(24px, 4vw, 32px);
      letter-spacing: 0.04em;
    }
    .lede { margin: 6px 0 0; color: var(--muted); max-width: 720px; line-height: 1.5; }
    .badge {
      margin: 10px 0 0;
      color: var(--gold);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .layout { display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      transition: border-color 0.2s;
    }
    .card:hover { border-color: rgba(201, 162, 39, 0.3); }
    .card h3 {
      margin: 0 0 10px;
      font-family: 'Cinzel', serif;
      font-weight: 500;
      font-size: 12px;
      letter-spacing: 0.18em;
      color: var(--gold);
      text-transform: uppercase;
    }
    #sphere-container {
      position: relative;
      width: 100%;
      min-height: 520px;
      border-radius: 8px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, rgba(233, 228, 216, 0.05), rgba(0, 0, 0, 0.5)),
                  #0a0908;
      border: 1px solid var(--border);
      touch-action: none;
      cursor: grab;
    }
    #sphere-container:active { cursor: grabbing; }
    .word {
      position: absolute;
      left: 0;
      top: 0;
      color: var(--text);
      font-weight: 600;
      pointer-events: auto;
      white-space: nowrap;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      transition: color 0.2s;
    }
    .word:nth-child(4n) { color: #cdb46a; }
    .word:nth-child(7n) { color: #b3ab9c; }
    .word:hover { color: var(--gold); }
    .controls { display: grid; gap: 12px; align-content: start; }
    .control-group { display: grid; gap: 6px; }
    label { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }
    input[type="range"] { width: 100%; accent-color: var(--gold); }
    input[type="checkbox"] { accent-color: var(--gold); }
    textarea {
      width: 100%;
      min-height: 140px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      resize: vertical;
      font-family: inherit;
      font-size: 14px;
    }
    textarea:focus { outline: none; border-color: rgba(201, 162, 39, 0.5); }
    .btn {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(233, 228, 216, 0.04);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.12s, background 0.12s;
    }
    .btn:hover {
      transform: translateY(-1px);
      border-color: rgba(201, 162, 39, 0.55);
      background: rgba(201, 162, 39, 0.08);
    }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
      #sphere-container { min-height: 420px; }
    }
    @media (max-width: 480px) {
      body { padding: 18px 12px 36px; }
      #sphere-container { min-height: 320px; }
      .row .btn { flex: 1; }
      .lede { font-size: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      .btn:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <a class="back" href="../../index.html">&larr; WIZARD</a>
        <h1>WordSphere</h1>
        <p class="lede">Single, consolidated sphere renderer with decoupled UI. Type words, drag to orbit, tweak spin and perspective.</p>
        <p class="badge">Spin &middot; Drag &middot; Edit Words &middot; Adjust Speed</p>
      </div>
    </header>

    <div class="layout">
      <div class="card">
        <h3>Sphere</h3>
        <div id="sphere-container"></div>
      </div>

      <div class="card controls">
        <h3>Controls</h3>
        <div class="control-group">
          <label for="speed">Spin speed <span id="speedValue">1.0</span></label>
          <input type="range" id="speed" min="0" max="3" step="0.05" value="1">
        </div>
        <div class="control-group">
          <label for="radius">Radius scale <span id="radiusValue">1.0</span></label>
          <input type="range" id="radius" min="0.6" max="1.4" step="0.05" value="1">
        </div>
        <div class="control-group">
          <label for="words">Words (one per line)</label>
          <textarea id="words"></textarea>
        </div>
        <div class="row">
          <button class="btn" id="apply">Apply Words</button>
          <button class="btn" id="random">Randomize Sample</button>
          <button class="btn" id="reset">Reset View</button>
        </div>
        <div class="row">
          <label class="pill"><input type="checkbox" id="autospin" checked> Auto spin</label>
          <label class="pill"><input type="checkbox" id="hoverpause" checked> Pause on hover</label>
        </div>
      </div>
    </div>
  </div>

  <script src="./main.js" type="module"></script>
</body>
</html>
